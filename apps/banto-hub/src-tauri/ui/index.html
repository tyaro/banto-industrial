<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>banto-hub</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				font-family: 'Segoe UI', system-ui, sans-serif;
				background: #1b1b1f;
				color: #eee;
			}
			main {
				height: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding: 1.5rem;
			}
			main > div {
				max-width: 40rem;
			}
			#banto-hub-status {
				font-size: 1.1rem;
				white-space: pre-line;
			}
			#banto-hub-actions {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				justify-content: center;
				margin-top: 1rem;
			}
			#banto-hub-actions button {
				font: inherit;
				padding: 0.4rem 1rem;
				border-radius: 4px;
				border: 1px solid #666;
				background: #2c2c33;
				color: #eee;
				cursor: pointer;
			}
			#banto-hub-actions button:disabled {
				opacity: 0.5;
				cursor: default;
			}
			#banto-hub-action-error {
				color: #ff9a9a;
				white-space: pre-line;
			}
		</style>
	</head>
	<body>
		<!--
      T16-0 (docs/banto-hub-t16-design.md §4.1「P3」): この HTML は
      HubRuntime 起動が終わるまでの一瞬だけ表示される最小プレースホルダで
      あり、独自の管理 UI ではない。src/lib.rs の setup() が
      HubRuntime::start に成功したら、このウィンドウを Hub 自身が配信する
      http://127.0.0.1:{port}/ へ navigate() する - 管理画面本体は常に Hub
      (axum) が同一 origin で配信するものだけで、frontendDist の二重配布は
      行わない。起動に失敗した場合は Rust 側から #banto-hub-status の
      文言を書き換えてエラーを表示する（src/lib.rs::show_startup_error 参照）。
    -->
		<main>
			<div>
				<p id="banto-hub-status">起動中…</p>
				<!--
          #706 レビュー: Fallback の窓の操作（トレイと同じ集合）。Rust 側
          （src/lib.rs::status_text_script）が window.__bantoHubRenderActions へ
          [{ id, label, command }] を渡す。押すと command を invoke する
          （capabilities/default.json と build.rs の ACL に載せたコマンドだけ）。
        -->
				<div id="banto-hub-actions"></div>
				<p id="banto-hub-action-error" role="alert"></p>
			</div>
		</main>
		<script>
			(function () {
				function describeError(error) {
					if (typeof error === 'string') return error;
					if (error && typeof error.message === 'string') return error.message;
					try {
						return JSON.stringify(error);
					} catch (_) {
						return String(error);
					}
				}
				function invoke(command) {
					var internals = window.__TAURI_INTERNALS__;
					if (!internals || typeof internals.invoke !== 'function') {
						return Promise.reject(
							'この画面からは操作できません。トレイのメニューを使ってください。'
						);
					}
					return internals.invoke(command, {});
				}
				window.__bantoHubRenderActions = function (actions) {
					var box = document.getElementById('banto-hub-actions');
					var errorLine = document.getElementById('banto-hub-action-error');
					if (!box) return;
					box.textContent = '';
					if (errorLine) errorLine.textContent = '';
					(actions || []).forEach(function (action) {
						var button = document.createElement('button');
						button.type = 'button';
						button.textContent = action.label;
						button.addEventListener('click', function () {
							var buttons = box.querySelectorAll('button');
							buttons.forEach(function (b) {
								b.disabled = true;
							});
							if (errorLine) errorLine.textContent = '';
							invoke(action.command)
								.catch(function (error) {
									if (errorLine) {
										errorLine.textContent =
											'「' + action.label + '」を実行できませんでした: ' + describeError(error);
									}
								})
								.finally(function () {
									buttons.forEach(function (b) {
										b.disabled = false;
									});
								});
						});
						box.appendChild(button);
					});
				};
			})();
		</script>
	</body>
</html>
