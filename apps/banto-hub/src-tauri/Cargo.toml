[package]
name = "banto-hub-shell"
description = "banto-hub 薄いデスクトップシェル (T16-0, docs/banto-hub-t16-design.md) - HubRuntime を埋め込み、Hub 自身の localhost UI を WebView で開くだけ。ヘッドレス bin `banto-hub` とは別パッケージ（名前衝突回避）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "banto_hub_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# T16-0 設計 §4.1: HubRuntime を埋め込むだけ - 独自 frontendDist/invoke API は
# 持たない（design P3・実装指示「二重 UI は作らない」）。
banto-hub-core = { path = "../core" }
# トレイアイコン（design §4.3）用に `tray-icon` feature を有効化する - tauri
# crate の既定 feature には含まれない（chronogazer/relay-wright はトレイを
# 使わないため既定のまま）。
tauri = { version = "2", features = ["tray-icon"] }
# 設計 §4.2「単一インスタンス」: 第二インスタンスは既存ウィンドウを前面化して
# 自身は終了する。
tauri-plugin-single-instance = "2"
# T16-1（実装指示 3.「アプリを終了の確認」）: トレイ「アプリを終了」の確認
# ダイアログ用。JS 側の `@tauri-apps/plugin-dialog` は一切使わず、Rust 側
# `DialogExt` からネイティブダイアログを直接呼ぶだけ - capabilities への
# 権限追加は不要（権限は webview からの invoke 経路にのみ効く）。
tauri-plugin-dialog = "2"
# T16-1（実装指示 4.「× でトレイ格納時の初回通知」、UX-7）: OS 通知用。
# 上と同じ理由で JS 側バインディングは使わず、Rust 側 `NotificationExt` から
# 直接呼ぶ。
tauri-plugin-notification = "2"
# `RunningHub` を保持する `tokio::sync::Mutex`（AppState フィールド型を名指し
# するためだけの依存 - chronogazer/src-tauri の `tokio` 依存と同じ理由。
# `HubRuntime::start`/`RunningHub::shutdown` 自体は `tauri::async_runtime`
# 経由で呼ぶため、実行そのものにはこの依存は要らない）。
tokio = { workspace = true, features = ["sync"] }
# Desktop↔Service 切替ウィザード（`host_switch_status`/`host_switch_progress`
# invoke 面）の DTO・イベントペイロードのシリアライズ用。
serde = { workspace = true }

# `set_service_autostart` invoke が `banto-hub-elev.exe` を UAC 昇格して
# 起動する（`ShellExecuteExW`、verb "runas"）ためだけの Windows API 依存。
# `apps/banto-hub/core`が既に同じ 0.61 系を使っている（`core/Cargo.toml`
# 参照）ので新規バージョン系列は増えない。`banto_hub_core::service_elevated`
# 側は昇格後の実処理（`autostart-enable`/`-disable`）だけを持ち、昇格
# プロセス自体の起動はシェル側の責務（呼び出し元がどのプロセスを UI 経由で
# 起動するかを決めるのは composition root であるこの crate、という既存の
# 役割分担と同じ）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
