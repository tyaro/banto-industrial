[package]
name = "banto-hub-shell"
description = "banto-hub 薄いデスクトップシェル (T16-0, docs/banto-hub-t16-design.md) - HubRuntime を埋め込み、Hub 自身の localhost UI を WebView で開くだけ。ヘッドレス bin `banto-hub` とは別パッケージ（名前衝突回避）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "banto_hub_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# T16-0 設計 §4.1: HubRuntime を埋め込むだけ - 独自 frontendDist/invoke API は
# 持たない（design P3・実装指示「二重 UI は作らない」）。
banto-hub-core = { path = "../core" }
# トレイアイコン（design §4.3）用に `tray-icon` feature を有効化する - tauri
# crate の既定 feature には含まれない（chronogazer も #392 A2 でトレイを
# 使うようになり、同じ feature を有効にしている）。
tauri = { version = "2", features = ["tray-icon"] }
# 設計 §4.2「単一インスタンス」: 第二インスタンスは既存ウィンドウを前面化して
# 自身は終了する。
tauri-plugin-single-instance = "2"
# T16-1（実装指示 3.「アプリを終了の確認」）: トレイ「アプリを終了」の確認
# ダイアログ用。JS 側の `@tauri-apps/plugin-dialog` は一切使わず、Rust 側
# `DialogExt` からネイティブダイアログを直接呼ぶだけ - capabilities への
# 権限追加は不要（権限は webview からの invoke 経路にのみ効く）。
tauri-plugin-dialog = "2"
# T16-1（実装指示 4.「× でトレイ格納時の初回通知」、UX-7）: OS 通知用。
# 上と同じ理由で JS 側バインディングは使わず、Rust 側 `NotificationExt` から
# 直接呼ぶ。
tauri-plugin-notification = "2"
# #392 A2: 窓の前面化・× でトレイへ格納・初回通知・終了の確認ダイアログの
# 呼び出しを ChronoGazer と共有する。上の dialog/notification プラグインは
# この crate が使う `DialogExt`/`NotificationExt` の実体として、引き続き
# `run()` で登録する。
banto-desktop-tray = { path = "../../../crates/banto-desktop-tray" }
# Desktop↔Service 切替ウィザード（`host_switch_status`/`host_switch_progress`
# invoke 面）の DTO・イベントペイロードのシリアライズ用。
serde = { workspace = true }
# `set_service_autostart` invoke が `banto-hub-elev.exe` を UAC 昇格して
# 起動する（`ShellExecuteExW`、verb "runas"）。#392 B3-3a で、ここに直接
# 持っていた Win32 の呼び出し（と `windows-sys` の依存）を共有 crate の
# `banto_service_elev::launch::run_elevated` へ移した（ChronoGazer のシェルも
# 同じ口を使う）。昇格プロセスをいつ起動するかを決めるのは composition root で
# あるこの crate、という役割分担は変わらない。エラーの型（`LaunchError`）は
# 全 OS で使えるので、文言の写しのテストが Windows 以外でも動くよう、
# target を限らない依存にしている（Win32 の部分は crate の中で
# `#[cfg(windows)]`）。
banto-service-elev = { path = "../../../crates/banto-service-elev" }
# #661 661-5: Desktop へ進む前に profile の形（運用モードの形か）を、profile を読むだけで
# 開いて見る（`launch_gate::observe_profile_mode` → `banto_safe_root::mode::observe_root`。
# 判定はサービス本体と同じ `banto_hub_core::profile_mode::profile_shape`）。core が既に使う
# workspace の crate で、パッケージは増えない。
banto-safe-root = { path = "../../../crates/banto-safe-root" }

# #505 のテスト専用: 窓の CSP（`tauri.conf.json`）が Hub の応答の CSP（banto の
# `CONTENT_SECURITY_POLICY`）に Tauri の IPC を足しただけか、banto の
# `SecurityHeaders::content_security_policy()` と突き合わせる（banto v5.1.0）。
# どれも `banto-hub-core` が既に使っている workspace の依存で、パッケージは
# 増えない。
[dev-dependencies]
banto-server = { workspace = true }
serde_json = { workspace = true }

