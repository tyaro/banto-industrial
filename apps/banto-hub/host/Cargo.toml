[package]
name = "banto-hub-host"
description = "banto-hub's headless executables (R1-7a, docs/banto-driver-api-design.md §2.4): the `banto-hub` console/Windows-service binary and the `banto-hub-elev` UAC helper. Assembles the built-in drivers (`banto-drivers`) and hands them to `banto-hub-core`"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# 管理 UI（`apps/banto-hub/build`）の埋め込み。中身は `banto-hub-core` の
# `assets.rs` にあり、ここは転送するだけ（R1-7a で bin と一緒にこの package へ
# 移した入口。`cargo build -p banto-hub-host --bin banto-hub --features embed-ui`）。
embed-ui = ["banto-hub-core/embed-ui"]

[dependencies]
banto-hub-core = { path = "../core" }
# R1-3b / R1-7a（docs/banto-driver-api-design.md §6.4）: bin が
# `banto_drivers::builtin()` で組み込みドライバ一式を組み立て、`HubDrivers` として
# core へ注入する。R1-3b では bin が core の中にあったので core が一時的に normal で
# 持っていた（2026-10-20 オーナー決定）。R1-7a でこの package へ移し、core は dev のみ。
banto-drivers = { path = "../../../crates/banto-drivers" }
banto-driver-api = { path = "../../../crates/banto-driver-api", version = "0.3.0" }
banto-driver-wasm = { path = "../../../crates/banto-driver-wasm" }
ring = "0.17"
semver = "1"
# `bin/banto_hub/win_service.rs`（Windows 専用）が profile のルートの締める・緩める・
# 見張り（`banto_safe_root::mode`・`guard`・`open_root` 等）を直接使う。
banto-safe-root = { path = "../../../crates/banto-safe-root" }
# コンソールモードと Windows サービスがそれぞれ自前で tokio ランタイムを組み立てる
# （`Runtime::new`）。`signal` はコンソールモードの Ctrl-C 待ち。
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }

# banto-hub は Windows 専用前提だが、このワークスペースは非 Windows でも
# `cargo check --workspace --all-targets` を通す。Windows 限定の依存を使うコードは
# 必ず `#[cfg(windows)]` で囲む。
[target.'cfg(windows)'.dependencies]
# #392 B3-3b（監査 C4）: `banto-hub-elev` の `main` の先頭の
# `SetDefaultDllDirectories(LOAD_LIBRARY_SEARCH_SYSTEM32)`（昇格したプロセスの DLL の
# 探し先を System32 に限る）。R1-7a で core から移した。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(windows)'.dev-dependencies]
# `bin/banto_hub/win_service_tests.rs`（Windows 専用）の
# `#[tokio::test(flavor = "multi_thread")]` と `tokio::time::timeout`。
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# R2b-0: `tests/soak.rs` の RSS サンプリング（`GetProcessMemoryInfo`）。core の
# `[target.'cfg(windows)'.dev-dependencies]` から写した（同じ 0.61 系。新しい版は増えない）。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# R2b-0（docs/banto-driver-api-design.md §2.4）: 実ドライバ（`banto-drivers`、上の normal
# の依存）で SLMP / Modbus を Hub に通す統合テスト（`tests/*.rs`）を
# `apps/banto-hub/core/tests/` から移した。core は `banto-drivers` に dev でも依存しなく
# なり、ドライバだけの変更で core が CI に選ばれない。ここに並ぶのは、それらのテストが
# 使う分を core の `[dev-dependencies]` / `[dependencies]` から写したもの（features も同じ）。
# `tests/common/mod.rs` は core の `tests/common/mod.rs` を `#[path]` で読み、
# `hub_drivers()`（`builtin()`）だけを足す。
[dev-dependencies]
banto-driver-wasm = { path = "../../../crates/banto-driver-wasm", features = ["controlled-write-fixture", "controlled-live-write-fixture"] }
sha2 = { workspace = true }
tempfile = "3"
# `net` は空きポートの探索と TCP のプローブ、`test-util` は core と同じ（仮想時計）。
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util", "sync", "test-util"] }
axum = { workspace = true, features = ["ws"] }
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "macros", "migrate", "postgres", "tls-rustls-ring-native-roots"] }
futures-util = { workspace = true }
banto-core = { workspace = true }
banto-server = { workspace = true }
banto-tags = { path = "../../../crates/banto-tags" }
# R2b-1a: `tests/registry_tripwire.rs`（Hub のレジストリの `DriverKind` を見る）。
banto-driver-api = { path = "../../../crates/banto-driver-api", version = "0.3.0" }
banto-tstore = { path = "../../../crates/banto-tstore" }
banto-collect = { path = "../../../crates/banto-collect" }
banto-broker = { path = "../../../crates/banto-broker" }
banto-driver-engine = { path = "../../../crates/banto-driver-engine", version = "0.2.0" }
# Modbus TCP のシミュレータ（`banto-plc` の `simulator` feature）と、読み書きできる
# SLMP のシミュレータ（`banto-plc-write` の同 feature）。
banto-plc = { path = "../../../crates/banto-plc", features = ["simulator"] }
banto-plc-write = { path = "../../../crates/banto-plc-write", features = ["simulator"] }
# `tests/grpc.rs` のクライアント（`tonic::transport::Channel`）。
tonic = { workspace = true }
# `tests/stream.rs`・`tests/soak.rs` の WebSocket クライアント。
tokio-tungstenite = { workspace = true }
# `tests/mqtt.rs`・`tests/soak.rs`: 購読側のクライアントと、組み込みのブローカー
# （core の dev と同じ 0.20.x。本番の bin はブローカーを持たない）。
rumqttc = { workspace = true }
rumqttd = { version = "0.20", default-features = false }

[build-dependencies]
# T17-2 スライス2（docs/banto-hub-t17-design.md §3「T17-2」）: build.rs が
# `banto-hub-elev.exe`にだけ`requireAdministrator`マニフェストを埋め込む
# （`compile_for`は指定した`[[bin]]`名にのみ`cargo:rustc-link-arg-bin`を
# 発行するため、`banto-hub`本体には影響しない）。R1-7a で core から移した。
# Cargo.lock には既に`embed-resource 3.0.11`が（Tauri の`tauri-build`経由で）
# 存在しており、新規バージョン系列は増えない。
embed-resource = "3.0"

[[bin]]
name = "banto-hub"
path = "src/bin/banto-hub.rs"

# T17-2 スライス2（docs/banto-hub-t17-design.md §3「T17-2」）: UAC 昇格ヘルパー
# - 固定のアクションだけを受け付ける薄い CLI（本体は `banto-hub-core` の
# `service_elevated`）。`banto-hub-elev.manifest`（`requireAdministrator`、
# `build.rs`が embed-resource でこのバイナリにだけリンクする）により、実行する
# だけで OS が UAC 昇格プロンプトを出す。
[[bin]]
name = "banto-hub-elev"
path = "src/bin/banto-hub-elev.rs"
