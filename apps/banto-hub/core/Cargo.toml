[package]
name = "banto-hub-core"
description = "banto-hub domain/service layer (docs/tag-server-design.md T0): headless axum tag server - registry (I1) + collector (I3b) lifecycle + REST read API, no Tauri shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Embeds the SvelteKit static build (`apps/banto-hub/build`, gitignored) into
# the binary via rust-embed. Off by default, same reasoning as chronogazer/
# relay-wright's `embed-ui`: the workspace must build on a fresh clone
# without requiring `pnpm --filter banto-hub build` to have run first. T0
# ships no admin-UI frontend yet (docs/tag-server-design.md T0 scope) - this
# feature flag/`assets.rs` module is only the placeholder wiring for when one
# lands.
embed-ui = ["dep:rust-embed"]

[dependencies]
banto-core = { workspace = true }
banto-storage = { workspace = true, features = ["sqlite"] }
banto-server = { workspace = true }
# I1: tag registry (PlcConnection/CollectionGroup/Tag) - hub's own SQLite
# DB doubles as the registry DB (docs/tag-server-design.md §3.2 table).
banto-tags = { path = "../../../crates/banto-tags" }
# I2: only pulled in transitively via banto-collect in production builds;
# named directly here too since `hub.rs`'s doc comments reference its
# PlcClient boundary. No `simulator` feature at the non-dev level - hub talks
# to real PLCs; the simulator is dev-only (see [dev-dependencies]).
banto-plc = { path = "../../../crates/banto-plc" }
# I3a: local tstore recording (§3.3 決定: 記録あり・既定7日保持) + prune_files
# for the retention sweep.
banto-tstore = { path = "../../../crates/banto-tstore" }
# I3b: the collection engine itself - hub.rs::CollectorManager owns its
# lifecycle (start at boot, full rebuild on registry writes).
banto-collect = { path = "../../../crates/banto-collect" }
# I6 (T2-2, docs/tag-server-design.md §6-5): the PLC access broker -
# broker_glue.rs wraps it as the SLMP-side banto_collect::PlcClient the
# ClientFactory injection seam hands out, and HubSessions owns the session
# directory outside CollectorManager.
banto-broker = { path = "../../../crates/banto-broker" }
# I5 (T2-4, docs/tag-server-design.md §6): the write primitive - rest.rs's
# POST /api/v1/values/{tag} builds a banto_plc_write::BatchWriteRequest and
# submits it through banto_broker::BrokerHandle::write (which itself depends
# on banto-plc-write internally, but the wire types cross this crate's own
# public API too, so a direct dependency is needed here as well).
banto-plc-write = { path = "../../../crates/banto-plc-write" }
# T6-2 (docs/tag-server-design.md §4.2/§4.3(a)): computed.rs's ComputedEngine
# compiles/evaluates computed-tag expressions with this crate (T6-1) - the
# expression engine itself has no registry/tokio dependency, hub wires it to
# the tag space.
banto-expr = { path = "../../../crates/banto-expr" }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
serde = { workspace = true }
serde_json = { workspace = true }
# T14-1 (docs/banto-hub-t14-design.md §3「D1」): runtime.rs の
# `HubStartError` - 既存クレート（banto-collect 等）と同じ thiserror 由来の
# 列挙型エラーに揃える。
thiserror = { workspace = true }
# T1（docs/tag-server-design.md §5.2）: `GET /api/v1/stream` の WebSocket
# アップグレード(`axum::extract::ws`)。workspace 既定の axum features に
# `ws` を足すだけで新規依存は増えない(axum が既に `dep:tokio-tungstenite`
# を optional で持っている - `ws` はそれを有効化するだけ)。
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
rust-embed = { workspace = true, optional = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
futures-util = { workspace = true }
# T0-2 (docs/tag-server-design.md §5.6): api_keys.rs のキー生成・ハッシュ照合。
getrandom = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# T0-2 / §10-6: /api/v1/openapi.json の自動生成。
utoipa = { workspace = true }
# T3（docs/tag-server-design.md §5.3）: mqtt.rs の MqttPublisher が使う MQTT
# クライアント。
rumqttc = { workspace = true }
# T4（docs/tag-server-design.md §5.4）: grpc.rs の tonic サーバー + build.rs
# が生成する型のランタイム依存（tonic-prost はコーデック、prost はメッセージ
# 型そのもの）。
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
tokio-stream = { workspace = true }

[build-dependencies]
# T4（docs/tag-server-design.md §5.4）: build.rs が proto/tagserver/v1/*.proto
# をビルド時にコード生成する（生成先は OUT_DIR、リポジトリにはコミットしない
# - 実装指示どおり）。
tonic-prost-build = { workspace = true }
# システム protoc に依存しない自己完結ビルドのため（workspace Cargo.toml の
# コメント参照）。
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
# T3（docs/tag-server-design.md §5.3）: `net`は tests/mqtt.rs のポート探索
# （空きポートへ bind → drop → その番号で rumqttd を起動）と起動確認用の
# TCP プローブ接続のため - `axum`側の推移的依存で実質的にはこれまでも
# unify されていたが、明示しておく。
tokio = { workspace = true, features = ["rt", "macros", "time", "net"] }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
# T1: `/api/v1/stream` の統合テスト用 WebSocket クライアント
# (tests/stream.rs)。サーバー側は axum 自身の `ws` feature(上の
# [dependencies] 参照)で完結するので、これは test コードのみが使う。
tokio-tungstenite = { workspace = true }
# Modbus TCP simulator for the T0 E2E integration test
# (apps/banto-hub/core/tests/integration.rs) - same reuse chain
# banto-collect's own integration tests already exercise (banto-plc's
# `simulator` feature, made public for exactly this).
banto-plc = { path = "../../../crates/banto-plc", features = ["simulator"] }
# T2-4: the read+write SLMP simulator used by tests/write.rs's E2E test
# (write through the broker, then read the value back through the same
# session - see that test's module doc).
banto-plc-write = { path = "../../../crates/banto-plc-write", features = ["simulator"] }
# T3（docs/tag-server-design.md §5.3）: tests/mqtt.rs が in-process ブローカー
# として起動する組み込み MQTT ブローカー。rumqttc と同じ bytebeamio/rumqtt
# リポジトリ・同時期リリースの系列（0.25.x クライアント / 0.20.x ブローカー）
# を選び、Cargo.lock に無関係な世代を増やさない。`banto-hub-core` のテストの
# みが使う - 本番の `bin/banto-hub.rs` は外部ブローカーへ接続するクライアント
# モードのみ（組み込みブローカーは §10-4 の判断待ち、実装しない）。
rumqttd = { version = "0.20", default-features = false }

# T5-4（docs/t5-handoff.md §3「ソークテスト」）: tests/soak.rs の RSS
# サンプリング（`GetProcessMemoryInfo`）専用。新規の依存ノードは増えない -
# tokio/mio/tempfile 等が既に windows-sys 0.61 系を依存木に持っている
# （Cargo.lock 参照）ので、同じバージョン系列を明示するだけ。テストコードの
# みが使うので dev-dependency。
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[[bin]]
name = "banto-hub"
path = "src/bin/banto-hub.rs"

# T5-1（docs/tag-server-design.md §8「常駐」・docs/t5-handoff.md §3）:
# banto-hub を Windows サービスとして常駐実行するための SCM 連携
# （service_manager でのインストール/アンインストール・
# service_dispatcher/service_control_handler での起動・停止制御）。
# banto-hub は Windows 専用前提（tstore と同じ）だが、このワークスペース
# 自体は `cargo check --workspace --all-targets` を他プラットフォーム
# （CI）でも通す必要があるため、`[target]` セクションで Windows 限定の
# 依存にする - Linux 上ではこの依存自体が存在しないので、これを使う
# コード側は必ず `#[cfg(windows)]` で追加ガードすること
# （`src/bin/win_service.rs` 参照）。
#
# T17-0（docs/banto-hub-t17-design.md §3「T17-0」）でこのパッケージの lib
# クレート（`src/service_manager.rs`の`WindowsServiceManager`）もこの依存を
# 使うようになった - このセクションは `[[bin]]`/lib 共通（Cargo.toml は
# ターゲット別に依存を分けられないため）なので新規セクションは追加せず、
# ここに1本化してある。
[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
# T17-1（docs/banto-hub-t17-design.md §3「T17-1」・P2）: `profile_lock.rs`が
# `Global\BantoHub.<profile-id>`named mutex（`CreateMutexW`/`CloseHandle`/
# `GetLastError`/`ERROR_ALREADY_EXISTS`）で Desktop/Service 間の排他を取る。
# `CreateMutexW`系 API は`Win32_Security`feature を要求する
# （`SECURITY_ATTRIBUTES`引数の型のため - null を渡すだけで実際には使わない）。
# 既に`[target.'cfg(windows)'.dev-dependencies]`が同じ 0.61 系を使っている
# （tests/soak.rs）ので新規バージョン系列は増えない。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
# T17-1（docs/banto-hub-t17-design.md §3「T17-1」・P2 (c)）: 非 Windows には
# `Global\`名前空間の mutex が無いため、`profile_lock.rs`は
# `flock(2)`（`LOCK_EX|LOCK_NB`）自体を排他の実体として使う - Linux CI で
# 二重取得失敗を検証できるようにするため。`libc`はこのワークスペースの
# 依存木に既に transitively 存在する（`Cargo.lock`参照、tokio 等経由）ため
# 新規ノードは増えない。MIT/Apache-2.0 デュアルライセンス。
libc = "0.2"
