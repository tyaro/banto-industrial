[package]
name = "banto-hub-core"
description = "banto-hub domain/service layer (docs/tag-server-design.md T0): headless axum tag server - registry (I1) + collector (I3b) lifecycle + REST read API, no Tauri shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Embeds the SvelteKit static build (`apps/banto-hub/build`, gitignored) into
# the binary via rust-embed. Off by default, same reasoning as chronogazer/
# relay-wright's `embed-ui`: the workspace must build on a fresh clone
# without requiring `pnpm --filter banto-hub build` to have run first. T0
# ships no admin-UI frontend yet (docs/tag-server-design.md T0 scope) - this
# feature flag/`assets.rs` module is only the placeholder wiring for when one
# lands. R1-7a: the `banto-hub` binary lives in `banto-hub-host`, whose own
# `embed-ui` feature forwards here (`cargo build -p banto-hub-host --bin
# banto-hub --features embed-ui`).
embed-ui = ["dep:rust-embed"]

[dependencies]
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
banto-opcua-server = { workspace = true }
banto-core = { workspace = true }
banto-storage = { workspace = true, features = ["sqlite"] }
banto-server = { workspace = true }
# I3'（2026-10-04）: users/settings/audit の 3 サービスは banto のものを使う
# （`src/lib.rs` の re-export。hub 固有の設定キー `server.*`・`data.dir`・
# `retention.days`・`mqtt.*`・`grpc.*` は `src/settings.rs` に型付きのラッパと
# して残す）。argon2/password-hash はこの crate から直接は使わなくなった
# （パスワードのハッシュは `UsersService` の中）。
banto-admin-services = { workspace = true }
# I1: tag registry (PlcConnection/CollectionGroup/Tag) - hub's own SQLite
# DB doubles as the registry DB (docs/tag-server-design.md §3.2 table).
banto-tags = { path = "../../../crates/banto-tags" }
# R2a-3a: 列→f64 の変換・列の解決・品質の梯子・PostgreSQL の接続オプションとエラー文言は
# DB ブリッジ（banto-hub-sink、R2a-3b）と共有する crate に置く（`db_source` はそれを使う）。
banto-db-source = { path = "../../../crates/banto-db-source" }
# #392 A1（2026-10-10）: `profile_lock.rs` の排他の仕組み（Windows named mutex /
# 非 Windows の flock / `profile.lock` 診断ファイル）は共有 crate に移した。
# 以前ここにあった `[target.'cfg(not(windows))'.dependencies] libc` は
# 同 crate 側へ移動（このパッケージの他のコードは使っていない）。
banto-instance-lock = { path = "../../../crates/banto-instance-lock" }
banto-service-control = { path = "../../../crates/banto-service-control" }
# #392 B3-3a: `banto-hub-elev`（`service_elevated.rs`）と`service_operators.rs`の
# Win32 の部分（ローカルグループの作成・メンバーの追加、サービス DACL への
# Operators の ACE、トークンのメンバーシップ、`LookupAccountNameW`）を
# ChronoGazer の elev と共有する crate へ移した。アクション・引数の検証・
# 手順の順序・文言は banto-hub に残る。
banto-service-elev = { path = "../../../crates/banto-service-elev" }
# #626（2026-10-16）: `grant-profile-acl`（`src/profile_grant.rs`）の書き直しを共有の
# 部品に寄せた - 辿らずに開く`pin_dir`・ハンドルへ書く`PinnedDir::reset_acl`（自動の
# 伝播を使わない自前の再帰）・`read_dacl`、書き直す前の確かめ（`acl::guard` の
# マシンの環境のルート・本当のパスの比較・所有者・引き継ぐ利用者）、`InstallUserSid`・
# `DirAccess`。以前の`src/profile_acl.rs`（パスの`SetNamedSecurityInfoW`）は消した。
# 純粋な部品（`guard`・`InstallUserSid`）は全 OS で使い、手順の偽物のテストを Linux でも
# 走らせるので、Windows 限定にしない。`banto-hub-bootstrap`・`banto-tagclient`が
# 付いてくるが、どちらもこの crate が既に持つ依存（reqwest・tungstenite 等）の上で、
# Cargo.lock に新しい crate は増えない。これらの部品は `banto-safe-root`（#623 PR-1a で
# `banto-secret-store` から分けた共有 crate）にある。`sqlite` feature（#623 PR2a）は、
# サービスが profile の設定 DB の本体・`-wal`・`-shm` を握ったまま開く口
# （`banto_safe_root::sqlite`）。sqlx・libsqlite3-sys はこの crate が既に木に持つ版。
banto-safe-root = { path = "../../../crates/banto-safe-root", features = ["sqlite"] }
# #644 PR3a: Hub の loopback TLS の置き場（`<ProgramData>\BantoHub\tls\`）の定数・読み取りの
# 操作・確かめ（`hub_tls_prepare` の手順 1〜3）。クライアント（ChronoGazer）と同じコードを使う
# ための共有 crate で、依存はこの crate が既に持つもの（新しい package は増えない）。
banto-hub-tls-trust = { path = "../../../crates/banto-hub-tls-trust" }
# #644 PR4（2026-11-14）: デスクトップシェルの Service モードの health probe
# （`src/pinned_hub_health.rs`）が、127.0.0.1:8723 の Hub の証明書を Sink・ChronoGazer と同じ
# 検証器（`banto_tagclient::PinnedHubTls`。leaf の完全一致＋rustls の通常の検証）で確かめる。
# 以前から dev-dependencies と `banto-secret-store` 経由で依存木に持っていた crate で、
# Cargo.lock に新しい package は増えない。
banto-tagclient = { path = "../../../crates/banto-tagclient" }
# R2b-1b（docs/banto-hub-connection-settings-design.md §5.1・§5.2）: `src/secrets.rs` が接続の
# 秘密値を封印する部品（`Protector`・Windows の `DpapiMachine`・`MAX_SECRET_LEN`）を使う。
# 保存先のファイル（`FileSecretStore`）は使わない - blob は DB に置く（設計 §5.1 の Q1 (c)）。
# 以前は ACL の部品のために `banto-safe-root` だけに依存していた。`banto-secret-store` に
# 付いてくる workspace の crate は `banto-hub-bootstrap`・`banto-tagclient`（KeyStore の
# アダプタ用。この crate からは使わない）で、その外の依存（reqwest・tungstenite・sha2・hex・
# zeroize・windows-sys 0.61）はこの crate が既に持つもの。Cargo.lock に新しい crate は
# 増えない（この crate の依存の行が増えるだけ）。CI の変更判定（`.github/scripts/ci-changes.mjs`
# の依存グラフ）では、`banto-secret-store`・`banto-hub-bootstrap`・`banto-tagclient` の変更で
# hub 側も走るようになる（`ci-changes.test.mjs` の G と表を合わせた）。非 Windows でも
# コンパイルは通る（`DpapiMachine` は `#[cfg(windows)]`、`secrets` は非 Windows では
# protector 無しの `plain-v1`）。
banto-secret-store = { path = "../../../crates/banto-secret-store" }
# R2b-1b: 開封した秘密値と中間のバッファを `Zeroizing` で持つ（`banto-secret-store` と同じ版）。
zeroize = { workspace = true }
# I2: only pulled in transitively via banto-collect in production builds;
# named directly here too since `hub.rs`'s doc comments reference its
# PlcClient boundary. No `simulator` feature at the non-dev level - hub talks
# to real PLCs; the simulator is dev-only (R2b-0: in `banto-hub-host`'s
# [dev-dependencies], with the integration tests that use it).
banto-plc = { path = "../../../crates/banto-plc" }
# I3a: local tstore recording (§3.3 決定: 記録あり・既定7日保持) + prune_files
# for the retention sweep.
banto-tstore = { path = "../../../crates/banto-tstore" }
# I3b: the collection engine itself - hub.rs::CollectorManager owns its
# lifecycle (start at boot, full rebuild on registry writes).
banto-collect = { path = "../../../crates/banto-collect" }
# I6 (T2-2, docs/tag-server-design.md §6-5): the PLC access broker -
# broker_glue.rs wraps it as the SLMP-side banto_collect::PlcClient the
# ClientFactory injection seam hands out, and HubSessions owns the session
# directory outside CollectorManager.
banto-broker = { path = "../../../crates/banto-broker" }
# R1-3b: `HubDrivers`（`broker_glue.rs`）が `DriverRegistry` を持つ。
# R2b-6b: `serde` は `GET /api/drivers`（`rest/drivers.rs`）が設定のスキーマとデータ型の
# 一覧をそのままの JSON で返すため。
banto-driver-api = { path = "../../../crates/banto-driver-api", version = "0.3.0", features = ["serde"] }
# I5 (T2-4, docs/tag-server-design.md §6): the write primitive - rest.rs's
# POST /api/v1/values/{tag} builds a banto_plc_write::BatchWriteRequest and
# submits it through banto_broker::BrokerHandle::write (which itself depends
# on banto-plc-write internally, but the wire types cross this crate's own
# public API too, so a direct dependency is needed here as well).
banto-plc-write = { path = "../../../crates/banto-plc-write" }
# T6-2 (docs/tag-server-design.md §4.2/§4.3(a)): computed.rs's ComputedEngine
# compiles/evaluates computed-tag expressions with this crate (T6-1) - the
# expression engine itself has no registry/tokio dependency, hub wires it to
# the tag space.
banto-expr = { path = "../../../crates/banto-expr" }
# S1 (docs/banto-hub-external-db-design.md §3.1, 2026-09-06): PostgreSQL
# driver for the DB Source/Sink. TLS は `tls-rustls-ring-native-roots` -
# `tls-rustls` の `webpki-roots`（CDLA-Permissive-2.0）は cargo-deny の
# license allow list に無く落ちる、native-tls は Linux CI に OpenSSL を
# 引き込む、aws-lc-rs は Windows で cmake/NASM を要求する、のいずれも
# 避けられる。この組み合わせは S0 で `cargo deny check licenses bans
# sources`/`advisories` が deny.toml 無改造で green と確認済み。
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "macros", "migrate", "postgres", "tls-rustls-ring-native-roots"] }
serde = { workspace = true }
# R2a-2c（docs/banto-hub-ingest-design.md §6.3）: `float_roundtrip` - 取り込み口
# `push` の値（`src/ingest/validate.rs`）の浮動小数を往復で一致させる。既定の解析は
# 最後の桁がずれうるので、DB ブリッジと Hub 内の Source の値の一致（§10.4）の前提。
# 新しい crate は増えない（serde_json の feature だけ）。
serde_json = { workspace = true, features = ["float_roundtrip"] }
# T14-1 (docs/banto-hub-t14-design.md §3「D1」): runtime.rs の
# `HubStartError` - 既存クレート（banto-collect 等）と同じ thiserror 由来の
# 列挙型エラーに揃える。
thiserror = { workspace = true }
# T1（docs/tag-server-design.md §5.2）: `GET /api/v1/stream` の WebSocket
# アップグレード(`axum::extract::ws`)。workspace 既定の axum features に
# `ws` を足すだけで新規依存は増えない(axum が既に `dep:tokio-tungstenite`
# を optional で持っている - `ws` はそれを有効化するだけ)。
axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
rust-embed = { workspace = true, optional = true }
futures-util = { workspace = true }
# T0-2 (docs/tag-server-design.md §5.6): api_keys.rs のキー生成・ハッシュ照合。
getrandom = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
# T0-2 / §10-6: /api/v1/openapi.json の自動生成。
utoipa = { workspace = true }
# ux-plan.md §5 バックログ（2026-08-12 オーナー決定）: openapi.json を
# ブラウザで閲覧・試打できる Swagger UI の同梱（rest.rs の
# `openapi_router` 参照）。
utoipa-swagger-ui = { workspace = true }
# T3（docs/tag-server-design.md §5.3）: mqtt.rs の MqttPublisher が使う MQTT
# クライアント。
rumqttc = { workspace = true }
# T4（docs/tag-server-design.md §5.4）: grpc.rs の tonic サーバー + build.rs
# が生成する型のランタイム依存（tonic-prost はコーデック、prost はメッセージ
# 型そのもの）。
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
tokio-stream = { workspace = true }
# T19 S3-b（docs/banto-hub-t19-design.md §3.9、UX-46）: system_info.rs の
# CPU/メモリサンプラー。
sysinfo = { workspace = true }
# H2（tyaro/banto-industrial#1053）: `clock_sync.rs` が PLC の時計合わせに渡す
# この PC の現地時刻（`chrono::Local`、`clock` feature）と時刻表の分の判定。
# Cargo.lock に既にある 0.4.45（`iana-time-zone` 入り）を使うので、新しい
# パッケージは増えない（この crate の依存の行が増えるだけ）。
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# #644 PR1a（2026-11-13 オーナー決定 1）: `banto-hub-elev prepare-hub-tls`
# （`src/hub_tls_prepare.rs`）が Hub の loopback TLS の鍵（ECDSA P-256）と自己署名の
# 証明書（SHA-256）を作る。バックエンドは `ring`（`tokio-rustls`・sqlx が既に使う。
# aws-lc-rs は Windows で cmake/NASM を要求する）。既定の features は切り、`pem`
# （PEM の書き出し・鍵の読み込み）だけを足す。Cargo.lock に増えるのは rcgen・pem・
# yasna の 3 つ（MIT/Apache-2.0。deny.toml の許可に入る）。0.14.8 以降は
# rust-version 1.88 なので、1.85.1 に合う 0.14.7 に留める。
rcgen = { version = "=0.14.7", default-features = false, features = ["crypto", "pem", "ring"] }
# rcgen の有効期限の型（`OffsetDateTime`）。Cargo.lock に既にある 0.3 系を使う。
time = { version = "0.3", default-features = false }
# #644 PR1a: 既にある証明書の確かめ（期限・CA:FALSE・SAN・公開鍵）。Cargo.lock に
# 既にある 0.2.5（async-opcua-crypto が使う）。既定の features（`pem`・`std`）の
# 依存も木にある。
x509-cert = { version = "0.2.5" }
# #644 PR1a（レビュー）: 既にある証明書の自己署名（ECDSA P-256・SHA-256）を、証明書の公開鍵で
# 検証する（`ring::signature::ECDSA_P256_SHA256_ASN1`）。Cargo.lock に既にある 0.17.14
# （rcgen・tokio-rustls・sqlx が使う）。
ring = { version = "0.17.14" }

[build-dependencies]
# T4（docs/tag-server-design.md §5.4）: build.rs が proto/tagserver/v1/*.proto
# をビルド時にコード生成する（生成先は OUT_DIR、リポジトリにはコミットしない
# - 実装指示どおり）。
tonic-prost-build = { workspace = true }
# システム protoc に依存しない自己完結ビルドのため（workspace Cargo.toml の
# コメント参照）。
protoc-bin-vendored = { workspace = true }
# `banto-hub-elev.exe` の `requireAdministrator` マニフェストの埋め込み
# （`embed-resource`）は R1-7a で bin と一緒に `banto-hub-host` へ移した。

[dev-dependencies]
# Decode test PostgreSQL URL passwords exactly as SQLx does (already in Cargo.lock).
percent-encoding = "2.3.2"
# banto-opcua v0.2.0 の固定と同じ rev に揃える（#1046）
async-opcua = { git = "https://github.com/tyaro/async-opcua", rev = "9daa957a0ccf425bcb61bc488e828ccf2495c302", default-features = false, features = ["client"] }
# T3（docs/tag-server-design.md §5.3）: `net`は元は tests/mqtt.rs のポート探索
# （空きポートへ bind → drop → その番号で rumqttd を起動）と起動確認用の
# TCP プローブ接続のため - `axum`側の推移的依存で実質的にはこれまでも
# unify されていたが、明示しておく。R2b-0 で tests/mqtt.rs は `banto-hub-host` へ
# 移ったが、`src/test_support.rs` の偽ドライバ（TCP の接続だけをする）が使う。
# 外部 DB 連携 S2b（docs/banto-hub-external-db-design.md §4.8・§6-17）:
# `test-util` は `#[tokio::test(start_paused = true)]` の仮想時計のため -
# `crate::db_source::supervisor` のバックオフ（1s → 30s）と「60 秒以上
# 動いたら連続回数を戻す」を実時間ゼロで検証する。**dev 限定**なので
# 配布バイナリの依存には入らない。
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util", "test-util"] }
# #644 受入条件 4 の場面試験（`src/pinned_hub_health/squat_scenarios.rs`）: 1 つのポートが Hub 停止中の
# 先取り・入れ替え・証明書の作り直しを通す。先取り役・中継・記録の部品で、公開しない dev 専用の crate。
banto-hub-squat-harness = { path = "../../../crates/banto-hub-squat-harness" }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
# #344（2026-09-15）: `broker_glue::BrokerReadClient::connect` は broker の
# `status_watch` を見て Connected/Reconnecting/Stopped を返し分けるように
# なった。その単体テストは「セッションが Reconnecting のまま」「3 秒以内に
# Connected へ戻る」といった遷移を、ソケットもバックオフのタイミングも
# 介さず決定的に作れる必要がある - `test-util` の
# `banto_broker::spawn_test_handle_with_status` がその口。**dev 限定**なので
# 配布バイナリには入らない（[dependencies] 側の banto-broker は既定features
# のまま）。
banto-broker = { path = "../../../crates/banto-broker", features = ["test-util"] }
# T1: `/api/v1/stream` のテスト用 WebSocket クライアント（`src/stream.rs` の単体
# テスト）。サーバー側は axum 自身の `ws` feature(上の [dependencies] 参照)で完結する
# ので、これは test コードのみが使う。
tokio-tungstenite = { workspace = true }
# #644 PR1a: `prepare-hub-tls` が作った証明書を Sink と同じ pin
# （`banto_tagclient::PinnedHubTls::from_pem`）で読み、`tls_listener` の読み込みと TLS の
# 握手ができることを確かめる（`src/hub_tls_prepare/tests.rs`）。#644 PR4 から通常の依存
# （[dependencies] の banto-tagclient）にも入ったので、テストもそちらを使う。
# R2a-2a（docs/banto-hub-ingest-design.md §2・§11）: `src/ingest/driver.rs` の `PushDriver` を
# 適合テストの静的な部分（`static_checks`、C1・C2）に掛ける。適合テスト一式は
# `banto-driver-api` にだけ依存する公開 crate なので、下の「`banto-drivers` には dev でも
# 依存しない」は崩れない（CI では conformance の変更で core も走るようになる。
# `.github/scripts/ci-changes.test.mjs` の G に辺を足した）。
banto-driver-conformance = { path = "../../../crates/banto-driver-conformance", version = "0.3.0" }
# R2b-0（docs/banto-driver-api-design.md §2.4）: `banto-drivers`（実ドライバ）は dev でも
# 持たない。ドライバだけの変更で core が CI に選ばれないようにするため。`src` の単体
# テストは `src/test_support.rs::test_drivers`（偽のドライバ表）、`tests/` に残った統合
# テストは `HubDrivers::none()` で動く。実ドライバとシミュレータ（`banto-plc` /
# `banto-plc-write` の `simulator` feature）・組み込み MQTT ブローカー（`rumqttd`）を
# 使う統合テストは `apps/banto-hub/host/tests/` へ移した（dev-dependency も同じく）。

# T5-4（docs/t5-handoff.md §3「ソークテスト」）: tests/soak.rs の RSS
# サンプリング（`GetProcessMemoryInfo`）専用だった（R2b-0 で tests/soak.rs は
# `banto-hub-host` へ移り、`Win32_System_ProcessStatus` は向こうでも持つ。Windows で
# 確かめるまでここからは外していない）。新規の依存ノードは増えない -
# tokio/mio/tempfile 等が既に windows-sys 0.61 系を依存木に持っている
# （Cargo.lock 参照）ので、同じバージョン系列を明示するだけ。テストコードの
# みが使うので dev-dependency。
#
# #626（2026-10-16）: `src/profile_grant/win/tests.rs`の反証（その場の
# すり替え）で、書き直しの直前にフォルダを`FSCTL_SET_REPARSE_POINT`で
# ジャンクションにする（`CreateFileW`・`DeviceIoControl`）。本番には足さない。
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# T5-1（docs/tag-server-design.md §8「常駐」・docs/t5-handoff.md §3）の
# Windows サービス化で使っていた `windows-service` クレートは、#392 B3-1 で
# 直接の依存から外した: SCM の状態操作（B2-3）・サービス本体のランナーと
# 登録・解除（B3-1）はすべて共有 crate `banto-service-control`（上の依存）が
# 持つ。banto-hub は Windows 専用前提（tstore と同じ）だが、このワーク
# スペース自体は `cargo check --workspace --all-targets` を他プラット
# フォーム（CI）でも通す必要があるため、以下の Windows 限定の依存を使う
# コード側は必ず `#[cfg(windows)]` で追加ガードすること。
[target.'cfg(windows)'.dependencies]
# T17-1（docs/banto-hub-t17-design.md §3「T17-1」・P2）: `profile_lock.rs`が
# `Global\BantoHub.<profile-id>`named mutex（`CreateMutexW`/`CloseHandle`/
# `GetLastError`/`ERROR_ALREADY_EXISTS`）で Desktop/Service 間の排他を取る。
# `CreateMutexW`系 API は`Win32_Security`feature を要求する
# （`SECURITY_ATTRIBUTES`引数の型のため - null を渡すだけで実際には使わない）。
# 既に`[target.'cfg(windows)'.dev-dependencies]`が同じ 0.61 系を使っている
# （tests/soak.rs）ので新規バージョン系列は増えない。
#
# T17-2 スライス2（docs/banto-hub-t17-design.md §3「T17-2」）: `service_elevated.rs`
# が UAC 昇格ヘルパー用に4 feature 追加した -
# `Win32_NetworkManagement_NetManagement`（`NetLocalGroupAdd`/
# `NetLocalGroupAddMembers`、ローカルグループ`BantoHub Operators`の作成・
# メンバー追加）、`Win32_Security_Authorization`（`SetEntriesInAclW`・
# `EXPLICIT_ACCESS_W`、サービス DACL への ACE 追加）、`Win32_System_Services`
# （`OpenSCManagerW`/`OpenServiceW`/`QueryServiceObjectSecurity`/
# `SetServiceObjectSecurity`、SCM 生 API）、`Win32_System_WindowsProgramming`
# （`GetUserNameW`、`setup-operators`のユーザー省略時デフォルト解決）。
# #392 B3-3a でグループ・サービス DACL の呼び出しは共有 crate
# `banto-service-elev`へ移したので、このパッケージからは
# `Win32_NetworkManagement_NetManagement`・`Win32_System_Services`を外した
# （`Win32_System_WindowsProgramming`は`GetUserNameW`がまだ使う）。
#
# profile ACL 追加スライス（docs/banto-hub-desktop-plan.md §11）で
# `src/profile_acl.rs`のために足した`Win32_Security_Authorization`・
# `Win32_Storage_FileSystem`は、#626（2026-10-16）でその実装を消して
# `banto-safe-root`に寄せたので外した（`src/profile_grant/win.rs`が使うのは
# `OpenMutexW`の`Win32_System_Threading`だけ）。同 PR の監査 B-5 で、
# `reset-password`・`revert-to-commissioning`が DB のファイルを辿らずに開いて
# 持つ（`CreateFileW`・`GetFileInformationByHandle`・`GetFinalPathNameByHandleW`）
# ために`Win32_Storage_FileSystem`を戻した。
#
# ロックダウン回復アクション追加（docs/tag-server-design.md §5.6、
# `service_elevated.rs`の`reset-password`/`revert-to-commissioning`）:
# `Win32_System_Console`を追加した - `GetStdHandle`/`GetConsoleMode`/
# `SetConsoleMode`/`ENABLE_ECHO_INPUT`（`reset-password`が新しいパスワードを
# 標準入力から読む際、コンソールのエコーを一時的に止めるため。新しい
# クレートは増えず、既存の`windows-sys`0.61系列に feature を足すだけ）。
#
# #392 B3-3b（監査 C4）で足した`Win32_System_LibraryLoader`（`banto-hub-elev`の
# `main`の`SetDefaultDllDirectories`）は、R1-7a で bin と一緒に`banto-hub-host`へ移した。
#
# #661 661-2: `Win32_System_Registry`を追加した - `profile_owners.rs`が戻す相手の記録
# （HKLM `...\Services\BantoHub\Parameters\Profiles\<id>\Owners`、REG_MULTI_SZ）を
# 読み書きする（`RegOpenKeyExW`・`RegCreateKeyExW`・`RegSetValueExW`・`RegGetValueW`）。
#
# #704 レビュー P2: `Win32_Security_Authentication_Identity`・`Win32_Security_Authorization`
# を追加した - `profile_grant::win::owner_lookup`が記録の SID を照会し
# （`ConvertStringSidToSidW`・`LookupAccountSidW`）、名前を解けなければこの PC のアカウントの
# ドメインの SID（`LsaOpenPolicy`・`LsaQueryInformationPolicy`・`ConvertSidToStringSidW`）と比べる。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
