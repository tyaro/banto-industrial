[package]
name = "relay-wright-core"
description = "RelayWright domain/service layer: shared by Tauri commands now, REST in M6"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Embeds the SvelteKit static build (`apps/relay-wright/build`, gitignored)
# into the binary via rust-embed. Off by default so the workspace builds on
# a fresh clone without requiring `pnpm --filter relay-wright build` to
# have been run first (spec §11.1).
embed-ui = ["dep:rust-embed"]

[dependencies]
banto-core = { workspace = true }
banto-storage = { workspace = true, features = ["sqlite"] }
banto-server = { workspace = true }
# banto-tags/banto-plc (plan W1, luminous-discovering-goblet.md): not wired
# into any Tauri command or REST route yet - CRUD lands in W2, PLC read/write
# wiring in W3's engine. Added now as path deps so the workspace member graph
# and Cargo.lock settle in W1 rather than shifting again on every later
# milestone. Deliberately NOT banto-tstore/banto-collect/banto-tsquery (this
# app has no historian requirement per the plan's Context section) and NOT
# banto-plc-write (does not exist yet - that crate is milestone I5).
banto-tags = { path = "../../../crates/banto-tags" }
banto-plc = { path = "../../../crates/banto-plc" }
# W3-A (luminous-discovering-goblet.md): the PLC access broker
# (`src/engine/broker.rs`) owns one bare `slmp::SLMPClient` per SLMP CPU and
# drives BOTH reads (`banto_plc::execute_slmp_reads`) and writes
# (`banto_plc_write::execute_slmp_writes`) over that single shared session, so it
# needs the write crate and the wrapped framing crate directly. The auto-write
# ENGINE (poller/rule_engine/writer, arming, rate-limiting) is W3-B; this crate
# only gains the broker infrastructure in W3-A.
banto-plc-write = { path = "../../../crates/banto-plc-write" }
slmp = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
# QR文字列画面（qr_strings.rs）: 登録された文字列をサーバー側で SVG に描画する。
# workspace 既存の依存（src-tauri の LAN アクセス QR と同じクレート/機能）で、
# 新規依存は増やさない。
qrcode = { workspace = true }
# S2 文字列タグ: 条件しきい値テキスト／文字列定数の保存時検証（Shift-JIS で
# 表現可能か・エンコード後バイト数が 2×string_length に収まるか）に使う。
# banto-plc/-write が既に使っている workspace 依存（slmp 経由で元々ツリーに
# あった版に固定）で、Cargo.lock に新規ノードは増えない — qrcode と同じ
# 理由付け。判定自体は banto-plc-write の encode_string_value と同一だが、
# あちらは pub(crate)（ワイヤ層の内部）なので、保存時のフィールドエラー用に
# support.rs::sjis_text_error で最小限を再実装する。
encoding_rs = { workspace = true }
# `fs` (spec M17): `crate::backup::BackupService` reads/writes `backups/`
# and the pending-restore file directly via `tokio::fs`. Cargo's feature
# unification already pulls this in transitively via `sqlx`'s
# `runtime-tokio` feature, but naming it explicitly here means this crate
# does not silently depend on another dependency's feature choices.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "fs", "time"] }
rust-embed = { workspace = true, optional = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util", "sync"] }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
# The broker's tests drive it against `banto-plc-write`'s in-process SLMP
# simulator, which answers BOTH bulk read (0x0401) and bulk write (0x1401) - so
# one fake-CPU endpoint proves read-after-write over the broker's single shared
# session. Enabled only for tests (it opens a real loopback listener).
banto-plc-write = { path = "../../../crates/banto-plc-write", features = ["simulator"] }

[[bin]]
name = "relay-wright-serve"
path = "src/bin/relay-wright-serve.rs"
