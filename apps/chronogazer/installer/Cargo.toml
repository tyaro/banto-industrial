[package]
name = "chronogazer-installer"
description = "ChronoGazer 用 Windows インストーラ生成ツール（#392 B3-4、docs/chronogazer-service-design.md §3.3）。banto-hub のインストーラ（apps/banto-hub/installer）と同じ方式で tauri-bundler をライブラリとして単体呼び出しし、リリースビルド済みのシェル・記録エンジン（サービス）・昇格ヘルパーの 3 exe を 1 本の NSIS インストーラに包む。`cargo tauri build` は使わない（シェル以外の 2 exe を同じ $INSTDIR に揃え、サービスの停止と再開をフックで行うため）。"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# banto-hub のインストーラ（apps/banto-hub/installer/Cargo.toml）と同じ理由で、
# このパッケージは意図的にルートの `banto-industrial` ワークスペースの member に
# しない。空の `[workspace]` を宣言してこのディレクトリ自体を独立したワークスペース
# ルートにし、`cargo check --workspace --all-targets`（CI は ubuntu-latest）が
# tauri-bundler 一式（Windows 専用のバンドル処理を含む）を巻き込まないようにする。
# 呼び出しは
# `cargo run --manifest-path apps/chronogazer/installer/Cargo.toml --release -- <exe のディレクトリ>`
# のように独立して行う（scripts/build-release-chronogazer.ps1 がこれを行う）。
[workspace]

[dependencies]
# Hub のインストーラと同じ版（apps/banto-hub/installer/Cargo.toml のコメント参照。
# NSIS テンプレートの挙動 - フックの挿入位置・MainBinaryName の扱い・
# アンインストール時に消すアプリデータの場所 - は hooks/service-hooks.nsh と
# src/main.rs がこの版のテンプレートを前提に書いてあるので、上げるときは両方の
# インストーラを一緒に上げる）。
tauri-bundler = "2.9.4"
# `WebviewInstallMode`/`NSISInstallerMode` の型は tauri-bundler から再エクスポート
# されていないため、tauri-bundler 2.9.4 が依存する tauri-utils と同じ版を直接指定する。
tauri-utils = "2.9.3"
anyhow = "1"
# tauri-bundler は `log` で進捗を出す。バックエンドが無いと何も表示されない。
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
# `missing_binaries` の単体テスト（対象ディレクトリの exe 有無判定）用。
tempfile = "3"
