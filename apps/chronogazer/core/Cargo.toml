[package]
name = "chronogazer-core"
description = "ChronoGazer domain/service layer: shared by Tauri commands now, REST in M6"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Embeds the SvelteKit static build (`apps/chronogazer/build`, gitignored)
# into the binary via rust-embed. Off by default so the workspace builds on
# a fresh clone without requiring `pnpm --filter chronogazer build` to
# have been run first (spec §11.1).
embed-ui = ["dep:rust-embed"]

[dependencies]
banto-core = { workspace = true }
banto-storage = { workspace = true, features = ["sqlite"] }
banto-server = { workspace = true }
# I-series crates (docs/r1-plan.md R1-A): not wired into any Tauri command or
# REST route yet - that lands in R1-B (registry CRUD)/R1-C (collector
# runtime)/R1-D (monitor screens). Added now as path deps so the workspace
# member graph and Cargo.lock settle in R1-A rather than shifting again on
# every later phase.
banto-tags = { path = "../../../crates/banto-tags" }
banto-plc = { path = "../../../crates/banto-plc" }
banto-tstore = { path = "../../../crates/banto-tstore" }
banto-collect = { path = "../../../crates/banto-collect" }
banto-tsquery = { path = "../../../crates/banto-tsquery" }
# #332 (Hub 接続): 自己発行 bootstrap 本体と、その接続確認に使う catalog
# クライアント。keyring は `KeyStore` trait 経由で外から渡す（デスクトップ
# は src-tauri の OS キーリング、`banto-serve` は
# `crate::hub::UnavailableKeyStore`）ので、この crate は keyring に依存
# しない - ワークスペース `Cargo.toml` の keyring への注記と同じ理由。
banto-hub-bootstrap = { path = "../../../crates/banto-hub-bootstrap" }
banto-tagclient = { path = "../../../crates/banto-tagclient" }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
# `fs` (spec M17): `crate::backup::BackupService` reads/writes `backups/`
# and the pending-restore file directly via `tokio::fs`. Cargo's feature
# unification already pulls this in transitively via `sqlx`'s
# `runtime-tokio` feature, but naming it explicitly here means this crate
# does not silently depend on another dependency's feature choices.
# `time` (#394 レビュー P1-1): `crate::hub` の見張りの `sleep` と、Hub への
# 1 往復を包む `tokio::time::timeout`（`HUB_OPERATION_TIMEOUT`）。`fs` と
# 同じ理由で、他の依存の feature 選択に黙って乗らないよう明示する。
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "signal",
    "fs",
    "time",
] }
rust-embed = { workspace = true, optional = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
futures-util = { workspace = true }
# #332: `crate::hub` の `installation_id`（UUID v4 相当の 128 ビット）。
# `uuid` を新規に足す代わりに、`apps/banto-hub/core::api_keys` が API キー
# 生成に使っているのと同じワークスペース依存を使う（Cargo.lock に新しい
# ノードを増やさない）。
getrandom = { workspace = true }

[dev-dependencies]
# `test-util` (#394 レビュー P1-1): `HUB_OPERATION_TIMEOUT` のテストを
# `tokio::time::pause()`（`#[tokio::test(start_paused = true)]`）で
# **実時間を待たずに**決定的に回すため。tokio 自身の feature なので
# Cargo.lock にノードは増えない。
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
# examples/hub_real_smoke.rs（#383段階1実機確認、#387レビュー対応）専用:
# 発行したAPIキーの後始末（`POST /api/api-keys/{id}/revoke`、
# `crates/banto-tagclient/examples/real_hub_smoke.rs` の
# `set_write_control` と同じ作法で管理RESTを直接叩く）に使う。
# `banto-hub-bootstrap`/`banto-tagclient` が通常依存として既に使っている
# workspace版と同じもので、依存ツリーには既に入っているので Cargo.lock に
# ノードは増えない。
reqwest = { workspace = true }
# #383 段階1 の購読テスト専用。**chronogazer-core 自身は WS を話さない**
# （WS を張るのは `banto-tagclient` の中で、こちらは `TagClientHandle` を
# 持つだけ）。これは `crate::hub` のテストが**モック Hub 側**で WebSocket の
# ハンドシェイクを受け、data フレームを 1 つ送るためだけの dev 依存で、
# `banto-tagclient` が通常依存として使っている workspace 版と同じもの。
# 依存ツリーには既に入っているので Cargo.lock にノードは増えない。
tokio-tungstenite = { workspace = true }

[[bin]]
name = "banto-serve"
path = "src/bin/banto-serve.rs"
