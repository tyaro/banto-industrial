[package]
name = "chronogazer-core"
description = "ChronoGazer domain/service layer: shared by Tauri commands now, REST in M6"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Embeds the SvelteKit static build (`apps/chronogazer/build`, gitignored)
# into the binary via rust-embed. Off by default so the workspace builds on
# a fresh clone without requiring `pnpm --filter chronogazer build` to
# have been run first (spec §11.1).
embed-ui = ["dep:rust-embed"]

[dependencies]
banto-core = { workspace = true }
banto-storage = { workspace = true, features = ["sqlite"] }
banto-server = { workspace = true }
# I2a（2026-10-04）: users/settings/audit/backup の 4 サービスは banto の
# ものを使う（`src/lib.rs` の re-export。ChronoGazer 固有の設定キーだけ
# `src/settings.rs` に型付きのラッパとして残す）。argon2/password-hash は
# この crate から直接は使わなくなった（ハッシュは `UsersService` の中）。
banto-admin-services = { workspace = true }
# I-series crates (docs/r1-plan.md R1-A): not wired into any Tauri command or
# REST route yet - that lands in R1-B (registry CRUD)/R1-C (collector
# runtime)/R1-D (monitor screens). Added now as path deps so the workspace
# member graph and Cargo.lock settle in R1-A rather than shifting again on
# every later phase.
banto-tags = { path = "../../../crates/banto-tags" }
banto-plc = { path = "../../../crates/banto-plc" }
banto-tstore = { path = "../../../crates/banto-tstore" }
banto-collect = { path = "../../../crates/banto-collect" }
# R2b-3a-3（docs/banto-hub-driver-io-design.md §8）: 収集も broker を通す。計画と
# セッションのダイヤルに使うドライバの登録簿（`EngineConfig::drivers`）の型と、
# それを詰める組み込みドライバ。`banto-drivers` を normal で持つのは bin
# （`banto-serve`）がこの package の中にあるため（Hub の R1-3b の一時の形と同じ、
# api-design §6.4）。`chronogazer-host` の分離は R2b-3 に含めない。
banto-driver-api = { path = "../../../crates/banto-driver-api", version = "0.3.0" }
banto-drivers = { path = "../../../crates/banto-drivers" }
banto-tsquery = { path = "../../../crates/banto-tsquery" }
# #332 (Hub 接続): 自己発行 bootstrap 本体と、その接続確認に使う catalog
# クライアント。keyring は `KeyStore` trait 経由で外から渡す（デスクトップ
# は src-tauri の OS キーリング、`banto-serve` は
# `crate::hub::UnavailableKeyStore`）ので、この crate は keyring に依存
# しない - ワークスペース `Cargo.toml` の keyring への注記と同じ理由。
banto-hub-bootstrap = { path = "../../../crates/banto-hub-bootstrap" }
# #392 A1: 同じ DB を 2 プロセスで開かないための単一インスタンス排他
# （`crate::instance_lock`）。banto-hub の profile_lock と共有の仕組み。
banto-instance-lock = { path = "../../../crates/banto-instance-lock" }
banto-tagclient = { path = "../../../crates/banto-tagclient" }
# #392 B1-5: `chronogazer-server` の Hub の API キーの保存先（DPAPI machine の
# ファイル、`server_host::open_key_store`）。非 Windows では `UnsupportedPlatform`
# で fail closed する（コンパイルは通る）。
banto-secret-store = { path = "../../../crates/banto-secret-store" }
banto-safe-root = { path = "../../../crates/banto-safe-root" }
# #392 B1-5: `chronogazer-server` の終了（Ctrl-C と CTRL_CLOSE_EVENT）を 1 回に
# する（デスクトップと同じ `ExitCleanupOnce`。std だけの crate）。
banto-exit-once = { path = "../../../crates/banto-exit-once" }
# #392 B2-4a: シェルの起動判定（`crate::shell_launch`）が SCM の状態の型
# （`ScmState`）を使う。SCM を叩く実装（`WindowsServiceManager`）はシェルの
# `src-tauri` が B2-4c で使う。banto-hub と共有の crate。
banto-service-control = { path = "../../../crates/banto-service-control" }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
# （`fs` は I2a で外した: 使っていたのは `crate::backup` だけで、バックアップ
# は banto の `BackupService` に移った。）
# `time` (#394 レビュー P1-1): `crate::hub` の見張りの `sleep` と、Hub への
# 1 往復を包む `tokio::time::timeout`（`HUB_OPERATION_TIMEOUT`）。他の依存の
# feature 選択に黙って乗らないよう明示する。
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "signal",
    "time",
] }
rust-embed = { workspace = true, optional = true }
futures-util = { workspace = true }
# #332: `crate::hub` の `installation_id`（UUID v4 相当の 128 ビット）。
# `uuid` を新規に足す代わりに、`apps/banto-hub/core::api_keys` が API キー
# 生成に使っているのと同じワークスペース依存を使う（Cargo.lock に新しい
# ノードを増やさない）。
getrandom = { workspace = true }
# #392 B2-1: LAN の公開設定の状態の表示（アクセス URL の QR コード）を
# `crate::server_admin` に移した（デスクトップの `src-tauri` と REST で共有）。
# `src-tauri` が既に使っている workspace 版なので Cargo.lock にノードは増えない。
qrcode = { workspace = true }

# #392 B1-5: `chronogazer-server`（bin）のコンソールの扱い - Ctrl の受け取り
# （`SetConsoleCtrlHandler`）と、標準出力・標準エラー出力のログファイルへの
# 向け直し（`CreatePipe`・`SetStdHandle`・`ReadFile`・`WriteConsoleW`）。既存の
# 0.61 系（banto-safe-root・banto-instance-lock と同じ版）で、feature を足す
# だけ（Cargo.lock にノードは増えない）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[dev-dependencies]
# R2b-5c: ランプ波つきのワイヤのシミュレータ（`banto_plc::ramp`。`dev_plc` とテストの「対照の実機」）。
banto-plc = { path = "../../../crates/banto-plc", features = ["simulator"] }
# `test-util` (#394 レビュー P1-1): `HUB_OPERATION_TIMEOUT` のテストを
# `tokio::time::pause()`（`#[tokio::test(start_paused = true)]`）で
# **実時間を待たずに**決定的に回すため。tokio 自身の feature なので
# Cargo.lock にノードは増えない。
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
tower = { workspace = true, features = ["util"] }
tempfile = { workspace = true }
# examples/hub_real_smoke.rs（#383段階1実機確認、#387レビュー対応）専用:
# 発行したAPIキーの後始末（`POST /api/api-keys/{id}/revoke`、
# `crates/banto-tagclient/examples/real_hub_smoke.rs` の
# `set_write_control` と同じ作法で管理RESTを直接叩く）に使う。
# `banto-hub-bootstrap`/`banto-tagclient` が通常依存として既に使っている
# workspace版と同じもので、依存ツリーには既に入っているので Cargo.lock に
# ノードは増えない。
reqwest = { workspace = true }
# #383 段階1 の購読テスト専用。**chronogazer-core 自身は WS を話さない**
# （WS を張るのは `banto-tagclient` の中で、こちらは `TagClientHandle` を
# 持つだけ）。これは `crate::hub` のテストが**モック Hub 側**で WebSocket の
# ハンドシェイクを受け、data フレームを 1 つ送るためだけの dev 依存で、
# `banto-tagclient` が通常依存として使っている workspace 版と同じもの。
# 依存ツリーには既に入っているので Cargo.lock にノードは増えない。
tokio-tungstenite = { workspace = true }

# R1-D の D-4（2026-10-09）: tests/mini_soak.rs の working set の記録
# （`GetProcessMemoryInfo`）専用。`apps/banto-hub/core` の tests/soak.rs と
# 同じもの（同じ 0.61 系・同じ feature）で、tokio/mio 等が既に依存木に持って
# いるので Cargo.lock にノードは増えない。
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[[bin]]
name = "banto-serve"
path = "src/bin/banto-serve.rs"

# #392 B1-5: 画面の無い本番用の host（コンソール。B3 で同じ exe にサービスを足す）。
[[bin]]
name = "chronogazer-server"
path = "src/bin/chronogazer-server.rs"

# R1-C C-4: 開発用 PLC（`examples/dev_plc.rs`。E2E の `webServer` と
# `pnpm dev:plc` が起動する）。`test = true` は、この example の引数解釈の
# 単体テストを `cargo test -p chronogazer-core` で回すため（example の
# `#[test]` は既定では実行されない）。依存は本体の通常依存
# （`banto-collect`・`tokio` の `signal`）と、R2b-5c で足した dev-dependency の
# `banto-plc`（`simulator`、`banto_plc::ramp`）で足りる。
[[example]]
name = "dev_plc"
test = true

# #383 P6 の実機比較ハーネス（`examples/hub_p6_compare.rs`）。実行には実機が
# 要るが、`test = true` で表の列順・ポートの空き確認・profile ID の形の単体
# テストだけを `cargo test -p chronogazer-core` で回す（#584 のレビュー）。
[[example]]
name = "hub_p6_compare"
test = true
