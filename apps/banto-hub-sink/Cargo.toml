[package]
name = "banto-hub-sink"
description = "S5 (docs/banto-hub-external-db-design.md §5): banto-hub DB Sink sidecar - subscribes to the Hub tag space through banto-tagclient and batch-INSERTs into an external PostgreSQL"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 設計 §5.1「Hub からの値の取得は banto-tagclient SDK」: サイドカーは
# REST/WS を直接叩かず、SDK の再接続・rebinding・publish gate に乗る。
# SDK の最初の本番利用者（#123 で保留した組み込み確認を兼ねる）。
banto-tagclient = { path = "../../crates/banto-tagclient" }
# 設計 §5.3 の long スキーマへの multi-row INSERT と `SELECT ... LIMIT 0` の
# テーブル検査。feature の選定理由（`tls-rustls-ring-native-roots`）は
# `apps/banto-hub/core/Cargo.toml` の同じ依存のコメント（S0 の実測）参照 -
# sqlite/migrate はサイドカーには不要なので付けない。`macros` は DB ブリッジ
# （`source/poll.rs`）の `Executor::describe` のために付ける - `describe` は
# `sqlx-core/offline` の下にだけあり、`macros` がそれを連れてくる（Hub・
# `banto-db-source` の dev と同じ）。ワークスペースでは他の crate の feature と
# 合わさって通ってしまうので、`-p banto-hub-sink` 単体のビルドで確かめる。
sqlx = { workspace = true, features = [
    "runtime-tokio",
    "postgres",
    "tls-rustls-ring-native-roots",
    "macros",
] }
# `GET /api/sink/config` / `PUT /api/sink/status`（設計 §5.2）。SDK が既に
# 同じ版を持っているので新規ノードは増えない。`json` feature は使わない
# （本文は `serde_json` で組み立てて `body()` に渡す）。
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "signal",
    "time",
] }
# `banto-hub-sink.toml`（設計 §5.6、#630 で置き場は `%ProgramData%\BantoHub\sink\`）。`deny_unknown_fields` で
# 未知キーを拒否するため serde 統合が要る。Cargo.lock には既に 1.1.2 系が
# （他の推移的依存経由で）存在するので新規バージョン系列は増えない。
toml = "1"
# サービスの共有ランナーと登録・解除の手順（#392 B3-1）、OS シャットダウンの
# 停止合図と PRESHUTDOWN 待ち時間（#589）。Hub と同じ共有 crate。設計 §5.6
# 「サービス起動順は Hub → sink」で banto-hub と同じ SCM の手順
# （`install`/`uninstall`/`run-service`）を使うが、B3-1 以降このクレートは
# `windows-service` を直接使わない。サイドカーは banto-hub-core を本番依存に
# しない。
banto-service-control = { path = "../../crates/banto-service-control" }
# サービスログ行のローカル時刻表示。`banto-tstore` が同じ理由・同じ
# feature 構成でこのクレートを使っている（`crates/banto-tstore/Cargo.toml`
# の依存コメント参照: Windows 専用製品なので `local-offset` の Unix 側の
# 制約は当たらない）。`banto-tstore` 自体を依存に足すと sqlx-sqlite が
# サイドカーの exe へ入ってしまうため、そちらは使わず `time` を直接持つ。
time = { version = "0.3", default-features = false, features = ["local-offset"] }
# 設定ファイル（Hub の API キー入り）の置き場とファイルが保護されているかを、辿らずに
# 開いたハンドルで確かめてから読む（#630。`config::place`）。unsafe な Win32 の部品は
# 共有 crate `banto-safe-root`（#623 PR-1a で `banto-secret-store` から分けた）に置き、
# サイドカーには複製しない。依存（banto-hub-bootstrap・
# windows-sys など）はどれも既にこの exe の依存木にある。
banto-safe-root = { path = "../../crates/banto-safe-root" }
# R2a-3b（docs/banto-hub-ingest-design.md §10.3）: DB ブリッジ（`source/`）。Hub 内の
# DB Source（`banto_hub_core::db_source`）と同じ「列 → f64 の変換」「列の解決」「品質の
# 梯子」「失敗の粒度の分類」「接続オプションとエラー文言」を使うための共有 crate（§12 Q12、
# 依存は `sqlx` の `postgres` だけで、上の sqlx と同じ版）。
banto-db-source = { path = "../../crates/banto-db-source" }
# R2a-3b: ブリッジの送信口 `GET /api/v1/ingest/{id}/stream`（WebSocket）のクライアント。
# `banto-tagclient` は `/api/v1/stream` の購読専用で取り込みの口を持たないので直接使う。
# workspace の 0.29 系（axum 0.8・`banto-tagclient` と同じ版）なので Cargo.lock に新しい
# 系統は増えない。`futures-util` の `sink` は WS の送信（`SinkExt`）用で、これも
# `banto-tagclient` が同じ feature で既に持つ。
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }

[dev-dependencies]
# 管理者でしか走らない確かめ（保護された置き場から読む）のゲート（#630。
# `config::place` のテスト。CI は管理者）。
banto-service-elev = { path = "../../crates/banto-service-elev" }
# 統合テスト（tests/sidecar.rs）が Hub を**プロセス内**に立てるため。
# 本番のサイドカーは Hub に HTTP で繋ぐだけで、この依存は dev 限定
# （配布バイナリには入らない）。
banto-hub-core = { path = "../banto-hub/core" }
# R1-3b: 統合テストが `HubSessions::new` に渡す `HubDrivers` を `builtin()` から
# 組み立てる。sink の本番コードは Hub に HTTP で繋ぐだけでドライバを使わないので dev 限定。
banto-drivers = { path = "../../crates/banto-drivers" }
banto-server = { workspace = true }
banto-tags = { path = "../../crates/banto-tags" }
banto-tstore = { path = "../../crates/banto-tstore" }
banto-collect = { path = "../../crates/banto-collect" }
banto-broker = { path = "../../crates/banto-broker" }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "sqlite"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tempfile = { workspace = true }
