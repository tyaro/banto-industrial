# banto-industrial workspace. Members are added milestone by milestone
# (I1: banto-tags, I2: banto-plc, I3a: banto-tstore, I3b: banto-collect,
# I4: banto-tsquery - see docs/plan.md). banto crates are
# consumed via git-tag references (banto docs/publishing.md).
[workspace]
resolver = "2"
members = [
    "crates/banto-tags",
    "crates/banto-plc",
    "crates/banto-tstore",
    "crates/banto-collect",
    "crates/banto-tsquery",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

# Shared across every crate in this workspace (I1..I4) so version choices
# are made once here rather than drifting per-crate. `banto-core`/
# `banto-storage` are consumed via git tag (not path/registry) - this
# workspace is the first real-world proof of that distribution method
# decided in banto's docs/publishing.md; see crates/banto-tags/Cargo.toml
# for the feature set actually used.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.8", default-features = false }
tokio = { version = "1" }
banto-core = { git = "https://github.com/tyaro/banto.git", tag = "v0.1.0" }
banto-storage = { git = "https://github.com/tyaro/banto.git", tag = "v0.1.0" }
