# banto-industrial workspace. Members are added milestone by milestone
# (I1: banto-tags, I2: banto-plc, I2a: SLMP read in banto-plc, I5:
# banto-plc-write (SLMP write, separate trait/crate), I3a: banto-tstore,
# I3b: banto-collect, I4: banto-tsquery, I6: banto-broker (PLC access broker,
# read/write 単一セッション、relay-wright W3-A から抽出), R1-A:
# apps/chronogazer/{core,src-tauri}, W1: apps/relay-wright/{core,src-tauri},
# T0: apps/banto-hub/core (headless タグサーバー、
# docs/tag-server-design.md), T6-1: crates/banto-expr (演算タグの式評価
# エンジン、依存ゼロの純粋クレート。hub への配線は T6-2), T16-0:
# apps/banto-hub/src-tauri (薄いデスクトップシェル `banto-hub-shell` -
# HubRuntime を埋め込み Hub 自身の localhost UI を WebView で開くだけ、
# 独自 frontendDist/invoke は持たない。docs/banto-hub-t16-design.md) -
# see docs/plan.md /
# docs/r1-plan.md /
# the relay-wright plan `luminous-discovering-goblet.md` /
# docs/tag-server-design.md, R1-B: crates/banto-rtsp (RTSP基礎値・JPEG
# parser・再接続方針、ネットワークI/Oなし). banto crates are consumed via git-tag references
# (banto docs/publishing.md).
[workspace]
resolver = "2"
members = [
    "crates/banto-tags",
    "crates/banto-plc",
    "crates/banto-plc-write",
    "crates/banto-tstore",
    "crates/banto-collect",
    "crates/banto-tsquery",
    "crates/banto-broker",
    "crates/banto-expr",
    "crates/banto-rtsp",
    "crates/banto-tagclient",
    "apps/chronogazer/core",
    "apps/chronogazer/src-tauri",
    "apps/relay-wright/core",
    "apps/relay-wright/src-tauri",
    "apps/banto-hub/core",
    "apps/banto-hub/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Shared across every crate in this workspace (I1..I4, apps/chronogazer) so
# version choices are made once here rather than drifting per-crate.
# `banto-core`/`banto-storage`/`banto-server` are consumed via git tag (not
# path/registry) - this workspace is the first real-world proof of that
# distribution method decided in banto's docs/publishing.md; see
# crates/banto-tags/Cargo.toml for the feature set actually used.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13.4", default-features = false }
zeroize = "1.9.0"
sqlx = { version = "0.9", default-features = false }
tokio = { version = "1" }
# I2a (docs/plan.md「条件付き自動書き込みアプリ」I2a): MELSEC MC protocol
# (SLMP) framing, wrapped by `banto-plc`'s `slmp` module. MIT, tokio-async,
# read + write commands - the write half stays unused until I5's separate
# `banto-plc-write` crate. Declared here (not per-crate) like every other
# shared dependency so I5 picks up the same version by construction rather
# than by remembering to match it.
#
# H9 (docs/h9-slmp-structured-error-spec.md, 2026-08-12 オーナー決定): 0.2.0
# はオーナーのフォーク(tyaro/slmp)で、構造化エラー(`SlmpError::{Device,
# Framing,Timeout,NotConnected,Io}`)を公開する - crates.io 0.1.x が
# `std::io::Error` 一本化で終了コードをメッセージ文字列でしか露出しなかった
# ため、`banto-plc`/`banto-plc-write` の SLMP エラー分類はそのメッセージ
# 文言をパースしてデバイス側拒否(非致命)とフレーミング失敗(致命)を
# 区別していた。0.2.0 移行後は `SlmpError::Device { end_code }` への
# 構造化マッチに置き換わっており、文言パースは完全削除済み(§H9 受け入れ
# 条件)。tag 参照で固定(deny.toml の `required-git-spec = "tag"` と同じ
# 再現性方針)。
slmp = { git = "https://github.com/tyaro/slmp", tag = "v0.2.0" }
# S1 (relay-wright plan, 文字列タグ): Shift-JIS encode/decode for MELSEC string
# devices - banto-plc's string read decode and banto-plc-write's string write
# encode. Pinned to the exact version the `slmp` crate above already depends on
# (0.8.35), so declaring it here adds no new node to Cargo.lock: it was already
# in the tree transitively. The `slmp` crate's own `PLCString` type is
# deliberately NOT reused for this - it hard-caps strings at 64 bytes
# (32 words), while the tag registry allows `string_length` up to 128 words -
# so banto-plc/-write do their own words<->bytes<->SJIS conversion with this
# crate directly (byte order verified against `slmp`'s wire handling; see
# banto-plc/src/decode.rs).
encoding_rs = "0.8.35"
axum = { version = "0.8", default-features = true, features = ["json"] }
tower = "0.5"
futures-util = "0.3"
rust-embed = "8"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Desktop-only (apps/chronogazer/src-tauri and apps/relay-wright/src-tauri,
# mirrors banto's own M11/M12 reasoning): OS keyring storage for auto-login
# + real window translucency. Referenced only from src-tauri crates (not
# their -core crates), same CI/build reasoning as banto's own workspace
# Cargo.toml comment on these two.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
window-vibrancy = "0.8"
# Dev-only: isolated temp dirs for filesystem-touching tests (backup
# service, etc. - mirrors banto's own reasoning for this dependency).
tempfile = "3"
# T0-2 (docs/tag-server-design.md §5.6): API キーの secret 部分(32バイト)を
# 生成する CSPRNG。0.4 系を直接指定する: `uuid`(tauri-utils 経由)や
# `rand` 0.10(tokio-tungstenite 経由)が既に `getrandom` 0.3/0.4 系を木に
# 持っており、0.2 系(`password-hash` → `rand_core` 0.6.4 経由)に揃えても
# Cargo.lock 内の getrandom バージョン集合(0.2/0.3/0.4)は変わらないため、
# 新しい方に追従する(0.3 は `getrandom()` が `fill()` に改名されているので
# 0.2 のまま留めても実利がない)。`apps/banto-hub/core::api_keys` のみが
# 使う。
getrandom = "0.4"
# T0-2: API キーの照合用ハッシュ(SHA-256)。argon2 は低エントロピーな
# パスワード用に意図的に遅く、毎リクエスト照合する高エントロピーな
# ランダムキーには不向き(理由は `apps/banto-hub/core/src/api_keys.rs` の
# モジュール doc 参照)。`sqlx-core` 等が既に 0.10 系を木に持っているので
# 新規ノードは増えない。
sha2 = "0.11"
# T0-2: SHA-256 ダイジェストの hex エンコード表示・DB 保存用。既に
# `sqlx-core` 等が同じ 0.4 系を木に持っている。
hex = "0.4"
# T0-2: API キーの prefix/secret を base64url(パディングなし)で表現するため
# の汎用エンコーダ。`sqlx-core` 等が既に 0.22 系を木に持っている。
base64 = "0.23"
# T0-2 / 設計 §5.1・§10-6: `/api/v1/openapi.json` の自動生成(utoipa 採用は
# 2026-08-04 オーナー決定 - docs/tag-server-design.md §10 の6番)。catalog が
# クライアントとの互換性契約(§4.1)であるため、コードとスキーマを単一
# ソース化する。axum 統合は使わず(パラメータは `#[utoipa::path]` に手で
# 記述する)最小構成で導入 - `apps/banto-hub/core` のみが使う。
utoipa = "5"
# ux-plan.md §5 バックログ「OpenAPI の Swagger UI 同梱」（2026-08-12 オーナー
# 決定）: `/api/v1/openapi.json`（上の utoipa 由来）をブラウザで閲覧・試打
# できる Swagger UI をバイナリに同梱する。`default-features = false` +
# `vendored` feature で `utoipa-swagger-ui-vendored`（Swagger UI 静的資産を
# crates.io 経由でそのまま同梱、ビルド時ネットワーク取得なし）を使う -
# 既定の `url` feature（`dep:url` のみ、未使用なので落とす）や、既定の
# build-dependencies が引く `zip`/`regex` は vendored 経路でも Cargo.toml
# 上は無条件の build-dependency として残る - 実測(2026-08-12、`cargo deny
# --all-features check`)では新規に増えたクレート（zip・zlib-rs・zopfli・
# arbitrary・derive_arbitrary・utoipa-swagger-ui[-vendored]）はいずれも
# 既存 allow 済みライセンス（MIT/Apache-2.0/Zlib）の範囲内で、deny.toml の
# 変更は不要だった。実行時ネットワーク依存はゼロ（オフラインで動く要件を
# 満たす）。`apps/banto-hub/core` のみが使う。
utoipa-swagger-ui = { version = "9", default-features = false, features = [
    "axum",
    "vendored",
] }
# T1（docs/tag-server-design.md §5.2）: `GET /api/v1/stream` の WS 統合テスト
# 用クライアント（dev-dependency のみ - サーバー側は axum 自身の `ws`
# feature で足りる）。axum 0.8.9 が内部で使っているのと同じ 0.29 系を選び、
# Cargo.lock に無関係な第2系統を増やさない。
tokio-tungstenite = "0.29"
banto-core = { git = "https://github.com/tyaro/banto.git", tag = "v1.4.0" }
banto-storage = { git = "https://github.com/tyaro/banto.git", tag = "v1.4.0" }
banto-server = { git = "https://github.com/tyaro/banto.git", tag = "v1.4.0" }
# T3（docs/tag-server-design.md §5.3）: banto-hub の MQTT publish（外部ブロー
# カーへ接続するクライアントモードのみ - 組み込みブローカーは §10-4 の判断
# 待ち）。plan.md §3 で保留になっていた「MQTT クライアント（rumqttc +
# タグバインド）」行をここで回収する。`apps/banto-hub/core` のみが使う。
# 既定 feature `use-rustls`（TLS）は落とす - 設計 §5.6「v1 では平文 +
# 閉域 LAN 前提」（TLS 終端はリバースプロキシに委譲）で TLS 接続はスコープ外
# のため、rustls 一式を Cargo.lock の依存木に増やさない。
rumqttc = { version = "0.25", default-features = false }
# T4（docs/tag-server-design.md §5.4）: gRPC タグ空間 API。tonic 0.13 以降は
# prost 統合が本体から `tonic-prost`（実行時コーデック）/
# `tonic-prost-build`（ビルド時コード生成）へ分離されたため、この2つと
# `prost`（メッセージ型のランタイム）を個別に宣言する。既定 feature
# （`router`/`transport`/`codegen` - `transport` は `server`/`channel` を含む）
# のまま使う: サーバー（`grpc.rs`）とテスト用クライアント（`tonic` 本体の
# `Channel` - dev-dependency は増やさない、実装指示「tonic クライアントで
# （dev-dep 不要）」）の両方に必要。`apps/banto-hub/core` のみが使う。
tonic = { version = "0.14" }
tonic-prost = "0.14"
prost = "0.14"
# ビルド時コード生成専用（`apps/banto-hub/core/build.rs` の
# build-dependencies）。
tonic-prost-build = "0.14"
# `protoc` バイナリをこのクレートにベンダリングする - このコンテナ・CI
# （GitHub Actions ubuntu）のどちらにもシステム `protoc` が入っている保証が
# ないため、`tonic-prost-build`（内部は `prost-build`）に
# `Config::protoc_executable` で渡す自己完結パスとして使う（`build.rs` の
# doc comment参照）。ビルド時にネットワークへ問い合わせない（クレート内に
# 各 OS/アーキテクチャ向けの protoc 実行体を静的に同梱している）ため、
# オフラインの CI ランナーでも再現性がある。
protoc-bin-vendored = "3"
# `crate::grpc` の StreamValues/StreamEvents ハンドラが `tokio::sync::mpsc`
# の受信端を `futures_core::Stream` へ橋渡しするための薄いラッパー
# （`ReceiverStream`）。tonic 自身が `server`/`transport` feature 経由で
# 既に木に持っている 0.1 系と同じバージョンを明示する。
tokio-stream = "0.1"
