# banto-industrial workspace. Members are added milestone by milestone
# (I1: banto-tags, I2: banto-plc, I2a: SLMP read in banto-plc, I5:
# banto-plc-write (SLMP write, separate trait/crate), I3a: banto-tstore,
# I3b: banto-collect, I4: banto-tsquery, R1-A: apps/chronogazer/{core,src-tauri}, W1:
# apps/relay-wright/{core,src-tauri} - see docs/plan.md / docs/r1-plan.md /
# the relay-wright plan `luminous-discovering-goblet.md`). banto crates are
# consumed via git-tag references (banto docs/publishing.md).
[workspace]
resolver = "2"
members = [
    "crates/banto-tags",
    "crates/banto-plc",
    "crates/banto-plc-write",
    "crates/banto-tstore",
    "crates/banto-collect",
    "crates/banto-tsquery",
    "apps/chronogazer/core",
    "apps/chronogazer/src-tauri",
    "apps/relay-wright/core",
    "apps/relay-wright/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Shared across every crate in this workspace (I1..I4, apps/chronogazer) so
# version choices are made once here rather than drifting per-crate.
# `banto-core`/`banto-storage`/`banto-server` are consumed via git tag (not
# path/registry) - this workspace is the first real-world proof of that
# distribution method decided in banto's docs/publishing.md; see
# crates/banto-tags/Cargo.toml for the feature set actually used.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.8", default-features = false }
tokio = { version = "1" }
# I2a (docs/plan.md「条件付き自動書き込みアプリ」I2a): MELSEC MC protocol
# (SLMP) framing, wrapped by `banto-plc`'s `slmp` module. MIT, tokio-async,
# read + write commands - the write half stays unused until I5's separate
# `banto-plc-write` crate. Declared here (not per-crate) like every other
# shared dependency so I5 picks up the same version by construction rather
# than by remembering to match it.
#
# Caveat worth knowing before bumping: `banto-plc`'s SLMP error
# classification reads this crate's `std::io::Error` *message text* to tell a
# device-side end-code response (per-tag `Bad`) from a framing failure
# (connection-fatal) - the crate does not expose the end code any other way.
# `slmp_end_code_is_bad_not_fatal` in `banto-plc/src/slmp/integration_tests.rs`
# is the tripwire for that coupling: it drives a real end-code response
# through the real crate, so a message-format change in a future 0.1.x fails
# that test loudly instead of silently reclassifying device errors as fatal.
slmp = "0.1.23"
axum = { version = "0.8", default-features = true, features = ["json"] }
tower = "0.5"
futures-util = "0.3"
rust-embed = "8"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Desktop-only (apps/chronogazer/src-tauri and apps/relay-wright/src-tauri,
# mirrors banto's own M11/M12 reasoning): OS keyring storage for auto-login
# + real window translucency. Referenced only from src-tauri crates (not
# their -core crates), same CI/build reasoning as banto's own workspace
# Cargo.toml comment on these two.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
window-vibrancy = "0.6"
# Dev-only: isolated temp dirs for filesystem-touching tests (backup
# service, etc. - mirrors banto's own reasoning for this dependency).
tempfile = "3"
banto-core = { git = "https://github.com/tyaro/banto.git", tag = "v0.1.1" }
banto-storage = { git = "https://github.com/tyaro/banto.git", tag = "v0.1.1" }
banto-server = { git = "https://github.com/tyaro/banto.git", tag = "v0.1.1" }
