[package]
name = "banto-secret-store"
description = "File-backed secret store protected by DPAPI (machine scope) under a protected directory DACL, usable as banto-hub-bootstrap's KeyStore (#392 B1-3)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `PlainProtector`（暗号化しない、テスト専用の Protector）と
# `FileSecretStore::open_without_acl`（ディレクトリの ACL を確かめない）を
# 公開する。下流のテスト（B1-5 の `chronogazer-server` 等）が dev-dependency
# で有効にする想定。製品のビルドでは有効にしない。
test-support = []

[dependencies]
# `impl KeyStore for FileSecretStore` のアダプタ（src/keystore.rs）。
banto-hub-bootstrap = { path = "../banto-hub-bootstrap" }
# ディレクトリの DACL・辿らない確かめ（#623 PR-1a で `acl` をここから移した）。
banto-safe-root = { path = "../banto-safe-root" }
thiserror = { workspace = true }
# 復号した平文を `Zeroizing` に入れて返し、中間のバッファも drop で消す。
zeroize = { workspace = true }
# ファイル名 = sha256(account) の hex（アカウント文字列をファイル名に出さない）。
# どちらも既に workspace の依存木にあり、Cargo.lock に新しい版は増えない。
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(windows)'.dependencies]
# 既存の 0.61 系（banto-hub-core・banto-instance-lock と同じ版）。feature は DPAPI と
# 原子的な置換だけ（ACL・ハンドルまわりの feature は #623 PR-1a で banto-safe-root へ移した）:
# - Win32_Security_Cryptography: CryptProtectData / CryptUnprotectData（DPAPI）
# - Win32_Storage_FileSystem: MoveFileExW（原子的な置換）
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = { workspace = true }
