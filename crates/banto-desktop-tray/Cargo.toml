[package]
name = "banto-desktop-tray"
description = "Tray-resident window behaviour shared by the banto-hub shell and ChronoGazer (#392 A2): restore the window, hide it on close with a one-time hint, the quit confirmation dialog and the quit gate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# トレイ自体（`TrayIconBuilder`・メニュー）はアプリごとに中身が違うので
# この crate では組み立てない。ここで扱うのは窓・ダイアログ・通知だけなので
# `tray-icon` feature は要らない（使う側のアプリが自分で有効にする）。
tauri = { version = "2", features = [] }
# 終了の確認ダイアログ（Rust 側の `DialogExt` から直接呼ぶ。JS 側の
# バインディングは使わないので capabilities への権限追加は不要）。
tauri-plugin-dialog = "2"
# × でトレイへ格納した初回だけの OS 通知（同じく Rust 側の `NotificationExt`）。
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = { workspace = true }
