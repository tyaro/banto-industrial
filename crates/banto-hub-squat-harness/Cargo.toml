[package]
name = "banto-hub-squat-harness"
description = "Dev-only harness: one loopback port that lives through Hub-down / squatted / swapped / recovered, for the #644 acceptance scenarios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 待受・中継・記録のための非同期 I/O。banto-tagclient と同じ workspace の版で、
# 新しい package は Cargo.lock に増えない。呼び出し側の `#[tokio::test]` の実行環境に乗る。
tokio = { workspace = true, features = ["net", "time", "sync", "macros", "rt", "io-util"] }
# 偽の相手（先取りした側）が TLS を最後まで済ませるための待受側の設定。
# banto-tagclient の dev-dependency と同じ版・feature。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# 試験用の自己署名証明書を作る（banto-hub-tls-trust の dev-dependency と同じ版・feature。
# OpenSSL の CLI には頼らない）。
rcgen = { version = "=0.14.7", default-features = false, features = ["crypto", "pem", "ring"] }
