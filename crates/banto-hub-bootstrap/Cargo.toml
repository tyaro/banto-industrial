[package]
name = "banto-hub-bootstrap"
description = "Zero-config banto-hub client bootstrap: commissioning probe, self-issued API key, keyring hand-off"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The catalog check (`GET /api/v1/tags`) is delegated to this crate's
# `RestClient::fetch_catalog` rather than re-implemented here - see the
# `lib.rs` module doc's "境界" section.
banto-tagclient = { path = "../banto-tagclient" }
# The two admin endpoints (`GET /api/commissioning/status`,
# `POST /api/api-keys[/{id}/revoke]`) plus the 401/403 disambiguation probe.
# Same `default-features = false` choice as `banto-tagclient`. A plain-HTTP
# Hub on a closed LAN stays the default (tag-server-design.md §5.6); the
# loopback Hub is reached over https with a pinned certificate (#644), whose
# rustls config comes from `banto_tagclient::PinnedHubTls`.
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Safe, secret-free diagnostics, same redaction invariant as
# `banto-tagclient::error` (never log the key, never log the path prefix).
tracing = { workspace = true }
# The plaintext key only ever exists inside a `Zeroizing<String>` between
# the issue response and the `KeyStore`; it is never returned to callers.
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }
tempfile = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# #644 受入条件 4 の場面試験（1 つのポートが Hub 停止中の先取り・入れ替え・復帰を通す）。
# 公開しない dev 専用の crate。
banto-hub-squat-harness = { path = "../banto-hub-squat-harness" }
