[package]
name = "banto-tagclient"
description = "Read-only banto-hub tag contracts, snapshots, and streaming client core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = { workspace = true, features = ["sink"] }
reqwest = { workspace = true, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "sync", "macros", "rt"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
# Issue #209: connection-failure diagnostics (host/port, safe error
# classification) without exposing API keys or endpoint paths in logs. See
# `error.rs` module doc for the redaction invariant this must preserve.
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }
tempfile = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# #644 受入条件 4 の場面試験（1 つのポートが Hub 停止中の先取り・入れ替え・復帰を通す）。
# 先取り役・中継・記録の部品で、公開しない dev 専用の crate。
banto-hub-squat-harness = { path = "../banto-hub-squat-harness" }
