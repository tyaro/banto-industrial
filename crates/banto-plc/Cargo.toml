[package]
name = "banto-plc"
description = "I2/I2a: PLC通信クライアント - 読み取り専用trait + Modbus TCP実装 + MELSEC MC (SLMP) 実装 (docs/plan.md I2, docs/recorder-requirements.md §1/§3.1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
# T19 S1-b0: `AddressArea`'s definition (including `is_writable()`) now lives
# in this dependency-free sibling crate, shared with `banto-tags`/
# `banto-plc-write` - see its module doc. `src/address.rs` re-exports it so
# `banto_plc::AddressArea` is unchanged for every existing caller.
banto-plc-address = { path = "../banto-plc-address" }
# Only the pieces this crate actually touches: TCP I/O (net), connect/response
# timeouts (time), frame read/write (io-util). No "rt"/"macros" here - this
# crate never spawns tasks or defines its own #[tokio::main]/#[tokio::test];
# the async runtime is the consuming app's (or, for this crate's own tests,
# [dev-dependencies] below).
tokio = { workspace = true, features = ["net", "time", "io-util"] }
# MELSEC MC protocol (SLMP) wire framing for the `slmp` module (I2a). Unlike
# `modbus/`, which is hand-implemented, the SLMP side wraps this
# already-audited crate: MELSEC's frame layout (4E binary subheader, per-CPU
# 3-vs-4-byte device addressing, bit-unit response nibble packing) is exactly
# the kind of detail there is no upside in re-deriving from the spec.
#
# Note on tokio features: this crate's own `tokio` line above is deliberately
# minimal ("no rt - we never spawn"), but `slmp` depends on `tokio` with
# `features = ["full"]`, so Cargo's feature unification hands this crate (and
# everything downstream of it) the full tokio anyway. The narrow list above is
# kept as a statement of what *this crate's own code* uses, which is what
# makes it reviewable - it is no longer a build-level guarantee.
slmp = { workspace = true }
# S1 (relay-wright plan, 文字列タグ): Shift-JIS decode for MELSEC string-device
# reads (`decode.rs::decode_string_value`) and SJIS seeding in the SLMP
# simulator's `set_string`. Same version the `slmp` crate uses - see the
# workspace Cargo.toml note on why its PLCString type is not reused.
encoding_rs = { workspace = true }

# Exposes `simulator` (in-process Modbus TCP and SLMP test doubles, §6) beyond
# this crate's own tests - so I3's integration tests and R1/R4's soak-test
# harness can depend on `banto-plc` with `features = ["simulator"]` too, rather
# than each reinventing one. Not enabled by default: the simulators open a real
# (loopback) TCP listener, which a normal consumer never needs. Pulls in
# tokio's "rt" feature (the simulators spawn their accept-loop/per-connection
# tasks via `tokio::spawn`, which the base dependency above deliberately
# omits) - a consumer enabling `simulator` is expected to already have a
# runtime running (it is, after all, opening a socket to talk to it).
[features]
simulator = ["tokio/rt"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
