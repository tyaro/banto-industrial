[package]
name = "banto-service-elev"
description = "Win32 parts shared by the products' elevated helpers (local Operators group, service DACL ACE, token membership, runas launch); the privilege boundary itself stays in each product's elev exe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
# 既存の 0.61 系（banto-hub-core・banto-hub-shell・banto-service-control と
# 同じ版）。新しい crate は増えず、feature を足すだけ（どれも banto-hub-core と
# banto-hub-shell が #392 B3-3a まで持っていたもの）:
# - Win32_NetworkManagement_NetManagement: NetLocalGroupAdd /
#   NetLocalGroupAddMembers（ローカルグループの作成・メンバーの追加）
# - Win32_Security / Win32_Security_Authorization: LookupAccountNameW・
#   CheckTokenMembership・SetEntriesInAclW・ConvertStringSidToSidW・
#   セキュリティ記述子の組み立て
# - Win32_System_Services: QueryServiceObjectSecurity / SetServiceObjectSecurity
# - Win32_System_Threading: WaitForSingleObject / GetExitCodeProcess（runas の
#   終わりを待つ）
# - Win32_UI_Shell / Win32_UI_WindowsAndMessaging / Win32_System_Registry:
#   ShellExecuteExW（verb "runas"）。`SHELLEXECUTEINFOW` は `hkeyClass: HKEY`
#   を持つので Win32_System_Registry が要る
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
