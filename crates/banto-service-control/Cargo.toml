[package]
name = "banto-service-control"
description = "Windows SCM state / transition control (query, start, stop, restart, auto-start) with a mock for tests, shared by banto-hub, banto-hub-sink and ChronoGazer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
# サービス本体の非同期の待ち（`ServiceContext::stopped`、#392 B3-1）。
# `Notify` だけを使うので `sync` だけ（ランタイムは製品が持つ）。
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# banto-hub-core が `service_manager.rs` で使っていたのと同じ版（SCM の
# open / query / start / stop / change_config）。
windows-service = "0.8.1"
# PRESHUTDOWN 待ち時間の読み戻し（`QueryServiceConfig2W`）。
# `windows-service` 0.8 は設定だけを公開していて、読み戻しは無い。
# 同じ 0.61 系（`windows-service` が既に依存している）に feature を足す。
# `Win32_System_Registry` はサービスごとの設定値（`Parameters` の REG_SZ、
# `parameters`、#392 B3-2a）。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Services",
] }

[dev-dependencies]
# ランナーのテストで、非同期の本体を current_thread のランタイムで動かす。
tokio = { workspace = true, features = ["rt", "sync"] }
