# R1-4a（docs/banto-driver-api-design.md §2.3・§4.4・§10）: MELSEC SLMP の R1 の
# 薄いアダプター。`banto-broker` の `src/slmp_driver.rs` と `slmp_config_for` を
# `git mv` で移したもの（中身は不変）。broker の `DriverTable` の 1 行
# （`("slmp", banto_driver_slmp::dial)`）として、組み立て役 `banto-drivers` が注入する。
# 依存の向きはドライバ → broker だけ（broker はこの crate に dev-dependency でも
# 依存しない。循環と二重コンパイルを避ける）。内部 crate（`publish = false`）。
# R1-4b: `DriverBase` の実装（`src/base.rs`）と `classify_read` / `classify_write`
# （`src/classify.rs`）を足した（`banto-driver-api` は通常の依存）。
# R2b-3a-2（docs/banto-hub-driver-io-design.md §4.2）: broker の表の行（`dial`）と
# `BrokerSession` の実装を消し、`banto-drivers` が `DriverEntry::frame` で登録する（R2b-3d-join）。
[package]
name = "banto-driver-slmp"
description = "SLMP ドライバ（banto-driver-api の FrameDriver。R2b-3d から broker がレジストリ経由でエンジンに載せて使う）(docs/banto-hub-driver-io-design.md §6.2)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# R1-4b: `DriverBase` の実装・`ItemError` / `FatalError`（`src/base.rs`・`src/classify.rs`）。
# R2b-3d: `FrameDriver` / `FrameConnection` の実装（`src/frame_conn.rs`）。
banto-driver-api = { path = "../banto-driver-api", version = "0.2.0" }
# R2b-3a-2: broker の表（`DriverDial`）と `BrokerSession` の実装は無くなった。使うのは
# 両ドライバで共有する `parse_word_order` だけ（依存の向きはドライバ → broker のまま）。
banto-broker = { path = "../banto-broker" }
# 読み取りの計画（`plan_slmp_batch`）・アドレス・`WordOrder`。
banto-plc = { path = "../banto-plc" }
# 書き込みの計画（`plan_slmp_write_batch`）と書き込みのエラー型。
banto-plc-write = { path = "../banto-plc-write" }
# 設定の検証の許可リスト（`ALLOWED_WORD_ORDERS` ほか、`src/base.rs`）。
banto-tags = { path = "../banto-tags" }

[dev-dependencies]
# tests/broker.rs: 接続の `settings`（JSON のオブジェクト、R2b-3a-2）。
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# tests/broker.rs: broker 経由の読み書きを in-process の SLMP シミュレータで確かめる
# （broker の単体テストから移したもの。§4.4 の表）。
banto-plc-write = { path = "../banto-plc-write", features = ["simulator"] }
# R1-5（§7.3）: tests/conformance.rs。適合テスト一式と、そのピアになる banto-plc の
# SLMP シミュレータ（`slmp/simulator.rs`）。
banto-driver-conformance = { path = "../banto-driver-conformance" }
# R2b-3d-2: tests/conformance.rs と tests/p0_3.rs が、フレーム型のドライバを本物の
# エンジン（`FrameSession`）で包んで走らせる。
banto-driver-engine = { path = "../banto-driver-engine" }
banto-plc = { path = "../banto-plc", features = ["simulator"] }
# R2b-3d-join: `src/slmp_parity.rs`（テスト）が、`frame.rs` の組むバイト列を `slmp` crate の
# 出力とバイト単位で突き合わせる。本体のコードはもう使わない。
slmp = { workspace = true }
