# R1-3b（docs/banto-driver-api-design.md §2・§6.3・§6.4・§10）: ホスト（banto-hub の
# bin・shell・sink のテスト）が組み立てるドライバ一式 `Builtin`。ドライバを増やす・
# 差し替えるときに触る場所を、この crate 1 つにする。内部 crate（`publish = false`）。
# R1-4a でドライバ本体が別 crate（banto-driver-slmp / -modbus）へ出た。ホストは
# 今もここだけを見る。
[package]
name = "banto-drivers"
description = "R1-3b: ホストが注入する組み込みドライバ一式（DriverRegistry）(docs/banto-driver-api-design.md §6)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
banto-driver-api = { path = "../banto-driver-api", version = "0.2.0" }
# `builtin().registry` の 2 つ（R2b-3c / 3d から `DriverEntry::frame`。broker の表は無くなった）。
banto-driver-slmp = { path = "../banto-driver-slmp" }
banto-driver-modbus = { path = "../banto-driver-modbus" }
# R1-4b: トリップワイヤ（`ALLOWED_PROTOCOLS`）。R2b-1c: `settings_to_api(settings_from_flat(..))`
# （R1 の `settings_from_connection` の後継）のテスト。
banto-tags = { path = "../banto-tags" }

[dev-dependencies]
# R2b-3a-2: トリップワイヤ（`is_broker_managed`）と examples/real_plc_verify.rs の broker。
banto-broker = { path = "../banto-broker" }
# examples/real_plc_verify.rs: broker の接続の `settings`（R2b-3a-2）。
serde_json = { workspace = true }
banto-plc = { path = "../banto-plc" }
# examples/real_plc_verify.rs（R1-4a で banto-broker から移した実機検証ツール。R2b-3d-join でエンジン経由に書き直し）。
banto-driver-engine = { path = "../banto-driver-engine" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# tests/tag_canonical.rs（R2b-2b）: 本物の Modbus / SLMP のドライバで `TagService::with_registry` が
# 正規形を保存することの確認。banto-tags はドライバ crate に依存されている側なので、
# ドライバを使うテストはここ（両方に依存できる crate）に置く。
banto-core = { workspace = true }
banto-storage = { workspace = true, features = ["sqlite"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
