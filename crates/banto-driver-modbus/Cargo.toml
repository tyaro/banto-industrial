# R1-4a（docs/banto-driver-api-design.md §2.3・§4.4・§10）: Modbus TCP の R1 の
# 薄いアダプター。`banto-broker` の `src/modbus_driver.rs` と `modbus_config_for` を
# `git mv` で移したもの（中身は不変）。broker の `DriverTable` の 1 行
# （`("modbus-tcp", banto_driver_modbus::dial)`）として、組み立て役 `banto-drivers` が
# 注入する。依存の向きはドライバ → broker だけ（broker はこの crate に dev-dependency
# でも依存しない。循環と二重コンパイルを避ける）。内部 crate（`publish = false`）。
# R1-4b: `DriverBase` の実装（`src/base.rs`）と `classify_read` / `classify_write`
# （`src/classify.rs`）を足した（`banto-driver-api` は通常の依存）。
# R2b-3a-2（docs/banto-hub-driver-io-design.md §4.2）: broker の表の行（`dial`）と
# `BrokerSession` の実装を消し、`banto-drivers` が `DriverEntry::session` で登録する。
[package]
name = "banto-driver-modbus"
description = "Modbus TCP ドライバ（banto-driver-api の SessionDriver。R2b-3a-2 から broker がレジストリ経由でダイヤルする）(docs/banto-hub-driver-io-design.md §4)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# R1-4b: `DriverBase` の実装・`ItemError` / `FatalError`（`src/base.rs`・`src/classify.rs`）。
# R2b-3a-1/2: `SessionDriver` / `Session` の実装（`src/api_session.rs`）。
banto-driver-api = { path = "../banto-driver-api", version = "0.1.0" }
# R2b-3a-2: broker の表（`DriverDial`）と `BrokerSession` の実装は無くなった。使うのは
# SLMP ドライバと共有する `parse_word_order` だけ（依存の向きはドライバ → broker のまま）。
banto-broker = { path = "../banto-broker" }
# 読み取りの計画・実行（`plan_batch_requests` / `execute_modbus_reads`）と
# `dial_modbus`・`ModbusTcpConfig`。
banto-plc = { path = "../banto-plc" }
# 書き込みの計画・実行（`plan_modbus_writes` / `execute_modbus_writes`）。
banto-plc-write = { path = "../banto-plc-write" }
# 設定の検証の許可リスト（`ALLOWED_WORD_ORDERS` ほか、`src/base.rs`）。
banto-tags = { path = "../banto-tags" }
# セッションが持つ `TcpStream`（`net`）と、切断時の `shutdown`（`io-util`）。
tokio = { workspace = true, features = ["net", "io-util"] }

[dev-dependencies]
# tests/broker.rs: 接続の `settings`（JSON のオブジェクト、R2b-3a-2）。
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
# src/session.rs の単体テストと tests/broker.rs: in-process の Modbus TCP シミュレータ
# （broker の単体テストから移したもの。§4.4 の表）。
banto-plc-write = { path = "../banto-plc-write", features = ["simulator"] }
# R1-5（§7.3）: tests/conformance.rs。適合テスト一式と、そのピアになる banto-plc の
# Modbus TCP シミュレータ（`modbus/simulator.rs`）。
banto-driver-conformance = { path = "../banto-driver-conformance" }
# R2b-3c: tests/p0_3.rs drives the frame-type driver through the real engine.
banto-driver-engine = { path = "../banto-driver-engine" }
banto-plc = { path = "../banto-plc", features = ["simulator"] }
