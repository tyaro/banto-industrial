# I6 (docs/tag-server-design.md §6-5「読み書き単一セッション」、2026-08-04/
# 2026-08-05 決定): relay-wright W3-A の PLC access broker
# (`apps/relay-wright/core/src/engine/broker.rs`) を共有クレートへ抽出した
# もの。relay-wright とタグサーバー(banto-hub、T2-2 で配線)の両方が、同じ
# 「読み書きは同一 PLC セッションを通す」構造保証を使う。挙動は抽出前と
# 不変 - relay-wright 側の既存テストが回帰網（詳細は src/lib.rs 冒頭 doc）。
[package]
name = "banto-broker"
description = "I6: PLC access broker（read/write 単一セッション、レジストリの Session 型ドライバでダイヤル）- relay-wright W3-A から抽出、banto-hub T2-2 と共用 (docs/tag-server-design.md §6-5)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `test-util`: フェイクブローカー `spawn_test_handle_answering_ok`（ネットワーク
# なし・即時応答）をこのクレート外にも公開するゲート。もとは relay-wright の
# engine 側テスト（writer.rs のレート制限テスト等）が W3-A から引き続き使う
# ため設けたが、relay-wright は 2026-09-24 に main から外した（docs/plan.md）。
# 現在は banto-hub 側のテストが同種のフェイクとして使っている
# （apps/banto-hub/core/Cargo.toml の dev-dependencies 参照）。既定オフ
# （本番ビルドでは公開しない）。
[features]
test-util = []

[dependencies]
# 唯一の relay-wright 固有ではない共通依存: 接続定義の型
# (`banto_tags::PlcConnection`) と、その `settings` を API の `Settings` に直す
# `settings_to_api`（R2b-3a-2）。banto-tags は共通クレートなのでここから
# 依存してよい（DB・ログ・監査・エンジン設定への依存はゼロ）。
banto-tags = { path = "../banto-tags" }
# R2b-3a-2 (docs/banto-hub-driver-io-design.md §4.2): 要求・応答の型
# (`TagSpec` / `WriteItem` → `Value` / `ItemError`、致命は `FatalError`)、
# セッションの trait (`Session` / `SessionDriver`)、ダイヤルに使うレジストリ
# (`DriverRegistry` の `DriverKind::Session`)。broker の要求の型が API の型に
# なったので、`banto-plc` / `banto-plc-write` への依存は無くなった。
banto-driver-api = { path = "../banto-driver-api", version = "0.1.0" }
# 秘密値の平文は 1 回のダイヤルの間だけ持ち、終わったら消す（設計 §4.2）。
zeroize = { workspace = true }
thiserror = { workspace = true }
# 接続毎に1タスク(`spawn`)、mpsc でジョブを直列化(`sync`)、バックオフの
# タイマ・接続/応答タイムアウト(`time`)。banto-collect の task.rs と同じ
# 最小構成（"rt-multi-thread"/"macros" はここでは不要 - 実行環境は呼び出し側
# アプリが用意する）。
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util", "sync"] }
# ユニットテストの並行書き込みバーストで `join_all` を使う（旧 broker.rs の
# テストと同じ理由）。
futures-util = { workspace = true }
# R2b-3a-2: テストの接続（`PlcConnection::settings` は JSON のオブジェクト）。
serde_json = { workspace = true }
# R1-4a: ブローカーの単体テストは in-memory の偽セッション（src/fake.rs）を相手に
# する。SLMP / Modbus のシミュレータで broker 越しの振る舞いを見るテストは、
# 各ドライバ crate の tests/broker.rs へ移した（docs/banto-driver-api-design.md §4.4）。
