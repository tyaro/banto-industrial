[package]
name = "banto-plc-sim"
description = "筋書きで動く模擬 PLC の実行ファイル（SLMP・Modbus TCP）(docs/crates/banto-plc-sim-design.md、#1335)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "banto-plc-sim"
path = "src/main.rs"

[dependencies]
# シミュレータ本体（`Simulator::start_on`・`set_*`・`hang`）。実 TCP で待ち受ける。
banto-plc = { path = "../banto-plc", features = ["simulator"] }
# 筋書き（形 版 1）の読込と評価。
banto-scenario = { path = "../banto-scenario" }
# `DataType`（割付の型の綴りとワード数）。
banto-driver-api = { path = "../banto-driver-api", version = "0.3.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "net"] }

[dev-dependencies]
tempfile = { workspace = true }
# 符号化が `decode_*` と往復で合うことの確認用。
banto-register-codec = { path = "../banto-register-codec" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
