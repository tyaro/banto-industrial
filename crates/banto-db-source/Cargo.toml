# R2a-3a（docs/banto-hub-ingest-design.md §10.1・§11、2026-10-21）: Hub 内の
# DB Source（`apps/banto-hub/core/src/db_source`）が持っていた「列 → f64 の
# 変換」「品質の梯子」「PostgreSQL の接続オプションとエラー文言」を、DB ブリッジ
# （R2a-3b、`apps/banto-hub-sink`）と共有するために切り出した内部 crate。
# 依存は `sqlx`（`postgres`）だけ - Hub も sink も既に持つ版を使い、
# ランタイム・TLS の feature は載せる側（Hub・sink）が選ぶ。
[package]
name = "banto-db-source"
description = "DB Source の共有部品 - 列→f64 の変換 SQL・列の解決・品質の梯子・PostgreSQL の接続オプションとエラー文言 (R2a-3a)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sqlx = { workspace = true, features = ["postgres"] }

# `tests/statement_timeout.rs`（実 PostgreSQL。`BANTO_TEST_PG_URL` が無ければ skip）。
# 本体の依存は `sqlx`（`postgres`）だけのまま、ランタイム・TLS の feature は
# テストだけが選ぶ（Hub・sink と同じ組み合わせで、Cargo.lock に新しい crate は増えない）。
[dev-dependencies]
# `macros` は `sqlx-core/offline` を連れてきて `Executor::describe` が使えるようになる（Hub と同じ）。
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "macros"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
