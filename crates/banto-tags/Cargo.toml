[package]
name = "banto-tags"
description = "I1: タグレジストリ - PLC接続/収集グループ/タグの定義・型・スケーリング (docs/plan.md I1, docs/recorder-requirements.md §2/§3.1/§3.2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
banto-core = { workspace = true }
banto-storage = { workspace = true, features = ["sqlite"] }
# T19 S1-b0: `AddressArea::is_writable()`, the single definition of "which
# Modbus areas are writable" - used by `tag.rs::modbus_read_only_area`
# instead of hand-duplicating the rule. Dependency-free (see its module doc),
# so this does NOT reintroduce the `banto-plc` dependency this crate
# deliberately avoids (tokio/slmp/encoding_rs - see `tag.rs`'s
# `modbus_read_only_area` doc comment).
banto-plc-address = { path = "../banto-plc-address" }
serde = { workspace = true }
serde_json = { workspace = true }
# `migrate`: this crate embeds its own schema (`migrations/`) via
# `sqlx::migrate!` and exposes `banto_tags::migrate` for the consuming app to
# run at startup - see `src/lib.rs`.
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
