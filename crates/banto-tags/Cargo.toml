[package]
name = "banto-tags"
description = "I1: タグレジストリ - PLC接続/収集グループ/タグの定義・型・スケーリング (docs/plan.md I1, docs/recorder-requirements.md §2/§3.1/§3.2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
banto-core = { workspace = true }
banto-storage = { workspace = true, features = ["sqlite"] }
# T19 S1-b0: `AddressArea::is_writable()`, the single definition of "which
# Modbus areas are writable" - used by `tag.rs::modbus_read_only_area`
# instead of hand-duplicating the rule. Dependency-free (see its module doc),
# so this does NOT reintroduce the `banto-plc` dependency this crate
# deliberately avoids (tokio/slmp/encoding_rs - see `tag.rs`'s
# `modbus_read_only_area` doc comment).
banto-plc-address = { path = "../banto-plc-address" }
# R2b-1c (docs/banto-hub-connection-settings-design.md §4.2): `settings_json.rs` turns a
# connection's JSON `settings` into `banto_driver_api::Settings` and validates it through a
# `DriverRegistry` (`PlcConnectionService::with_registry`). Dependency-free, and it does not
# depend on this crate, so there is no cycle.
banto-driver-api = { path = "../banto-driver-api", version = "0.3.0", features = ["serde"] }
serde = { workspace = true }
# `upgrade.rs`: the error type of the pre-0025 backup (shared by banto-hub and ChronoGazer).
thiserror = { workspace = true }
serde_json = { workspace = true }
# R2b-1d (docs/banto-hub-connection-settings-design.md §5.2・§5.3): the sealed secret rows
# (`plc_connection_secrets.blob`) are carried in `Zeroizing` - a `plain-v1` blob is the
# plaintext itself. Already in the workspace (banto-secret-store, banto-hub-core), so
# Cargo.lock gains no new package.
zeroize = { workspace = true }
# `migrate`: this crate embeds its own schema (`migrations/`) via
# `sqlx::migrate!` and exposes `banto_tags::migrate` for the consuming app to
# run at startup - see `src/lib.rs`.
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
