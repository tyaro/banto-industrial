name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt / clippy / check / test)
    runs-on: windows-latest
    # banto-tags (and every later I-series crate) depends on banto-core /
    # banto-storage via a git tag reference into tyaro/banto (see
    # crates/banto-tags/Cargo.toml, banto's docs/publishing.md). banto went
    # PUBLIC on 2026-07-12, so Cargo's default git fetcher resolves it with
    # no credentials - no token or insteadOf rewrite is needed here.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
