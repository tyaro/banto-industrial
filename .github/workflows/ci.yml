# CI（#468 で「変更したパスに応じて選んで実行する」構成に分けた）。
#
# 構成:
#   changes ──┬─ lint-format            （必ず。repo 全体の ESLint + Prettier）
#             ├─ frontend-hub           （条件付き）
#             ├─ frontend-chronogazer   （条件付き）
#             ├─ rust                   （条件付き。fmt / clippy。対象は workspace 全体か -p に絞る）
#             ├─ rust-doctest           （条件付き。並列で `cargo test --doc`。対象は rust と同じ）
#             ├─ rust-test-build        （条件付き。テストを 1 回だけビルドして nextest archive にする。対象は rust と同じ）
#             │    ├─ rust-test         （rust-test-build の後。アーカイブを 3 台にシャーディングして実行）
#             │    └─ rust-wasm         （条件付き。WASM Hub components の ignored テスト。workspace 全体・WASM に関わる host のソース/試験・
#             │                           banto-driver-wasm / banto-drivers に届く crate の変更のとき。main への push は常に走る（2026-11-22）。
#             │                           rust-test-build の後で、アーカイブを再利用しテストはビルドしない。ゲストの wasm だけビルドする）
#             ├─ rust-db-source         （条件付き。PostgreSQL）
#             ├─ linux-clippy           （条件付き。昇格まわりの 2 crate を ubuntu で）
#             ├─ driver-api             （条件付き。公開する banto-driver-api・conformance の MSRV・features・semver）
#             ├─ e2e-chronogazer        （条件付き）
#             ├─ e2e-hub                （条件付き）
#             └─ e2e-demo-pages         （条件付き。Rust なし。ブラウザで触れるデモを組み立て、静的な配信の上で E2E。
#                                        デモの経路（模擬・入口・設定）・root の依存に触れたときと、フル CI のとき）
#   ci-gate（必ず。if: always()）: 上の全ジョブを見て、failure / cancelled、または
#   「走るべきなのに skipped」があれば fail。条件で skipped になったものは成功扱い。
#   **ブランチ保護の Required Check は `ci-gate` 1 つに集約する**（ジョブを増減しても
#   保護の設定を触らずに済む）。
#
# 判定は `.github/scripts/ci-changes.mjs`（純関数 + 判定表テスト
# `ci-changes.test.mjs`。ローカルでは `node --test .github/scripts/ci-changes.test.mjs`）。
# - push（main）と PR 以外の起動はフル CI（安全側）。
# - `.github/**`・`scripts/**`・どの規則にも当たらないパスはフル CI。
# - `crates/<name>/**` は、そのパッケージと、それに（推移的に）依存する workspace の
#   パッケージだけを `-p` で clippy / test する（依存グラフは changes ジョブで
#   `cargo metadata --no-deps --offline` から組む。normal・dev・build の path 依存）。
#   E2E・PostgreSQL・linux-clippy は、届いたパッケージがそのジョブの build する
#   パッケージ（ci-changes.mjs の JOB_PACKAGES）に当たるときだけ。グラフが読めない・
#   どのパッケージにも属さない `crates/` のパス・workspace の 8 割以上に届くときは
#   全体に倒す。
#   依存グラフに出ない結び付きのうち、`include_str!` / `include_bytes!` の走査は
#   リテラルのパスだけを見る（`concat!(env!("CARGO_MANIFEST_DIR"), ..)` や実行時の
#   `fs::read` は見ない）。そういう読み方を足すときは RUST_PACKAGES に手で足す。
# - root の Cargo.toml / Cargo.lock・toolchain・proto・.cargo・.config は Rust workspace
#   全体 + 両アプリの E2E。root の package.json / pnpm-lock.yaml / lint・format・TS
#   設定は全 frontend + 両 E2E。
# - 画面だけの変更（`apps/banto-hub/src/**`・`apps/chronogazer/src/**` と、アプリ直下の
#   package.json・vite/vitest/svelte の設定・tsconfig）は、frontend-<app> と e2e-<app> だけ走らせ、
#   Rust 系のジョブ（rust・rust-test-build・rust-doctest・rust-test・rust-wasm・rust-db-source・linux-clippy・
#   driver-api）は走らせない（2026-11-22 オーナー決定）。Rust が読む `static/`・`src-tauri/`・
#   `core/`・`host/`・`installer/` と、Rust の試験が読む `bridgeLoad.fixtures.json` は今までどおり。
# - rust-wasm は、host の WASM に関わるソース/試験（`wasm_plugins.rs`・`banto-hub.rs`・`win_service.rs`・tests/t12_*・*wasm*・
#   tests/common・host の Cargo.toml）と、依存グラフで banto-driver-wasm / banto-drivers に届く
#   共有 crate の変更のときだけ（PR）。host のほかの場所を壊した変更は PR では気づかず、main の
#   push で初めて落ちうる。オーナーが受け入れた（2026-11-22）。
# - `packages/**`（共通のフロントの部品。いまは packages/trend）は frontend-chronogazer
#   （その中で部品の check・test も回す）。`packages/demo-backend`（デモの模擬）は両アプリが
#   import するので frontend-hub も走る。
# - e2e-demo-pages（デモの組み立て + E2E）は、ci-changes.mjs の `DEMO_PATHS`（RULES とは独立に
#   変更ファイルの全部へ当てる）に触れたときと、root の依存・設定（frontend_all）を変えたとき。
#   ほかの画面だけの変更では走らない。
#
# テストは cargo-nextest（`--profile ci`、設定は `.config/nextest.toml`）で走らせる
# （#ci-speed、2026-10-19。それまでは rust ジョブ 1 本で fmt / clippy / nextest /
# doctest を直列に回し、CI 全体 17〜25 分の大半がここだった）。rust-test-build が
# テストバイナリを 1 回だけビルドして nextest archive（artifact `nextest-archive`、
# 保持 1 日）にし、rust-test が 3 台のシャードでそれを展開して走らせる（ビルドしない。
# 目的は Windows ランナーの使用時間の削減で、待ち時間は縮まらない）。doctest は nextest
# で走らないので `cargo test --doc` を別に回す。以前は rust-test-build が archive 作成後に
# 回していた（コンパイル済みの lib を再利用でき、rust ジョブで test プロファイルを
# もう 1 回フルビルドするより速い）が、シャードが doctest の 47〜65 秒を待つので、
# 2026-11-23 に並列の `rust-doctest` ジョブへ分けた（依存のキャッシュは読むだけ。
# lib はもう 1 回ビルドするので Windows ランナーの時間は増える。オーナーが受け入れた）。
# rust・rust-test-build・rust-doctest はいずれも `run_rust` と `rust_args`（ci-changes.mjs の出力）を使う。
# デバッグ情報は `CARGO_PROFILE_DEV_DEBUG=line-tables-only` で軽くしている。
# `--timings` は rust ジョブの clippy と rust-test-build の archive ビルドに付け、crate
# ごとのビルド時間の HTML を artifact（`cargo-timings-clippy`・`cargo-timings-test`、
# 14 日）に残す。遅いテストは nextest の junit.xml（artifact
# `nextest-junit-<シャード番号>`）と SLOW 表示で見る。
#
# 将来 `apps/banto-scada` を足すとき:
#   1. ci-changes.mjs の RULES に `^apps/banto-scada/` → `scada`（E2E を足すなら
#      `e2e/tests-banto-scada/` 等 → `e2e_scada`）を足し、AREAS・derive()
#      （`run_frontend_scada` / `run_e2e_scada`）・RUST_PACKAGES.scada・
#      JOB_PACKAGES.run_e2e_scada を足す（`crates/scada-*` は依存グラフで拾われる）。
#   2. ci-changes.test.mjs に「scada だけの変更」の行を足す。
#   3. 下の `changes.outputs` に新しい出力を足す。
#   4. frontend-hub / e2e-hub を写して frontend-scada / e2e-scada ジョブを足す
#      （`if:` は新しい出力を見る。Swatinem/rust-cache のキーはジョブ ID ごとに
#      分かれるので、ジョブ ID を既存と重ねない）。
#   5. ci-gate の `needs` と、ステップ内の `check` 行に新しいジョブを足す。
#   Required Check は ci-gate のままなので、保護の設定は変えなくてよい。
name: CI

# リリース（タグの push: v* / trend-v*）と手動の実行（workflow_dispatch）では、
# 変更パスの絞り込みをせず全部走らせる（2026-11-22 オーナー決定）。
on:
  push:
    branches: [main]
    tags: ['v*', 'trend-v*']
  pull_request:
  workflow_dispatch:

# #ci-speed（2026-10-19）: 取り消すのは PR の古い実行だけ。main の実行は最後まで走らせる。
# main を取り消すとジョブ末尾の rust-cache 保存に届かず、main のキャッシュが
# 作り直されないまま全 PR がキャッシュ無しでビルドする（run 39319407775 で実際に起きた）。
# タグの push と手動の実行は run_id で独立した group にする。ref で束ねると、同じ ref の別の実行に
# 取り消されたり、待機中の run が 1 本だけの仕様で次の run に置き換えられたりする(2026-11-22 レビュー)。
# PR・branch の push は今まで通り ref で束ねる。
concurrency:
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes (変更パス判定)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      docs: ${{ steps.classify.outputs.docs }}
      rust_all: ${{ steps.classify.outputs.rust_all }}
      crates: ${{ steps.classify.outputs.crates }}
      frontend_all: ${{ steps.classify.outputs.frontend_all }}
      hub: ${{ steps.classify.outputs.hub }}
      chronogazer: ${{ steps.classify.outputs.chronogazer }}
      hub_sink: ${{ steps.classify.outputs.hub_sink }}
      e2e_hub: ${{ steps.classify.outputs.e2e_hub }}
      e2e_chronogazer: ${{ steps.classify.outputs.e2e_chronogazer }}
      run_lint_format: ${{ steps.classify.outputs.run_lint_format }}
      run_frontend_hub: ${{ steps.classify.outputs.run_frontend_hub }}
      run_frontend_chronogazer: ${{ steps.classify.outputs.run_frontend_chronogazer }}
      run_rust: ${{ steps.classify.outputs.run_rust }}
      rust_args: ${{ steps.classify.outputs.rust_args }}
      run_wasm: ${{ steps.classify.outputs.run_wasm }}
      run_driver_api: ${{ steps.classify.outputs.run_driver_api }}
      run_rust_db_source: ${{ steps.classify.outputs.run_rust_db_source }}
      run_linux_clippy: ${{ steps.classify.outputs.run_linux_clippy }}
      run_e2e_hub: ${{ steps.classify.outputs.run_e2e_hub }}
      run_e2e_chronogazer: ${{ steps.classify.outputs.run_e2e_chronogazer }}
      run_e2e_demo_pages: ${{ steps.classify.outputs.run_e2e_demo_pages }}
    steps:
      # pull_request では checkout は PR のマージコミット（refs/pull/N/merge）。
      # fetch-depth: 2 でその 2 つの親（1 本目 = ベースの先端、2 本目 = PR の先端）
      # まで取れるので、shallow clone のままでも「1 本目の親 → マージコミット」の
      # 差分 = この PR がベースに持ち込む変更（CI が実際に検証する内容）を正しく
      # 取れる。merge-base を探す `base...head` の三点差分は shallow では
      # 失敗・誤判定しうるので使わない。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 共有 crate の依存グラフ（`cargo metadata --no-deps --offline`、ネットワーク不要）と
      # 判定表のテスト（実グラフで逆依存を確かめる）に cargo が要る。版はリポジトリの
      # rust-toolchain.toml に従う（rustup 1.28 以降の引数なしの `rustup toolchain install`
      # はそのファイルの toolchain を入れる）。ubuntu-latest に入っている rustup をそのまま
      # 使い、dtolnay/rust-toolchain で stable を別に入れることはしない。判定の本番
      # （Classify）で `cargo metadata` が失敗したときは、crates/ の変更を全体に倒す
      # （本番は止めずに安全側へ倒す）。一方、次の Test classifier は実グラフを直接
      # 読むので、cargo が無い・metadata が失敗するとこの段でジョブごと落ちて ci-gate が
      # 赤になる。これは意図: 「判定を検証できないなら落とす」ほうが、黙って全体に倒す
      # より異常に気づける。テスト側を cargo 無しで skip させたり通したりしない。
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal --no-self-update
          cargo --version

      # 判定表のテスト（判定の漏れは「必要なテストが走らない」側の失敗なので、
      # 判定そのものを毎回検証してから使う）。実グラフを読むテストは cargo が使えない
      # と失敗する（上の Install Rust toolchain のコメント参照。Classify と役割が違い、
      # こちらは検証できなければ落とす、Classify は動かし続けるために全体へ倒す）。
      - name: Test classifier
        run: node --test .github/scripts/ci-changes.test.mjs

      - name: List changed files
        id: diff
        if: github.event_name == 'pull_request'
        run: |
          out="$RUNNER_TEMP/changed.txt"
          # HEAD^2 が無い = マージコミットではない（想定外の checkout）。
          # そのときは ok=false にして判定側でフル CI に倒す。
          if git rev-parse --verify -q 'HEAD^2' >/dev/null \
            && git -c core.quotePath=false diff --name-only --no-renames 'HEAD^1' HEAD > "$out"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "changed files: $(wc -l < "$out")"
            cat "$out"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PR の差分を取得できなかったのでフル CI にする"
          fi

      - name: Classify
        id: classify
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DIFF_OK: ${{ steps.diff.outputs.ok }}
          CI_CHANGED_FILES: ${{ runner.temp }}/changed.txt
        run: node .github/scripts/ci-changes.mjs

  # 旧 frontend ジョブのうち repo 全体に掛かる ESLint / Prettier をここへ分けた。
  # docs だけの変更でも Markdown の整形はここで検査する。
  lint-format:
    name: Lint / Format (repo 全体)
    needs: changes
    if: needs.changes.outputs.run_lint_format == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # apps/*/package.json の @banto/* は tyaro/banto への git subdirectory 参照。
    # banto は 2026-07-12 に PUBLIC になったので、pnpm の既定の git fetcher が
    # 資格情報なしで解決する（rust ジョブの banto-core 等の git タグ依存と同じ）。
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version is intentionally omitted: pnpm/action-setup resolves it from
      # the "packageManager" field in the root package.json (pnpm@10.33.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

  frontend-hub:
    name: Frontend banto-hub (check / test / build)
    needs: changes
    if: needs.changes.outputs.run_frontend_hub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @banto/* のうち .svelte.ts を持つものが vite.config.ts の optimizeDeps.exclude から
      # 漏れていないか（漏れると pnpm dev だけが壊れ、build・E2E では見つからない。#478）。
      - name: Check optimizeDeps.exclude (banto)
        run: node scripts/check-banto-optimize-deps.mjs apps/banto-hub

      - name: Test scripts
        run: node --test scripts/check-banto-optimize-deps.test.mjs

      - name: Type check (svelte-check + tsc)
        run: pnpm --filter banto-hub check

      - name: Test
        run: pnpm --filter banto-hub test

      - name: Build
        run: pnpm --filter banto-hub build

  frontend-chronogazer:
    name: Frontend chronogazer (check / test / build)
    needs: changes
    if: needs.changes.outputs.run_frontend_chronogazer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @banto/* のうち .svelte.ts を持つものが vite.config.ts の optimizeDeps.exclude から
      # 漏れていないか（漏れると pnpm dev だけが壊れ、build・E2E では見つからない。#478）。
      - name: Check optimizeDeps.exclude (banto)
        run: node scripts/check-banto-optimize-deps.mjs apps/chronogazer

      - name: Type check (svelte-check + tsc)
        run: pnpm --filter chronogazer check

      - name: Test
        run: pnpm --filter chronogazer test

      # 共通のトレンドの部品（packages/trend）。ChronoGazer が使い、将来は SCADA も使う。
      # ci-changes.mjs は packages/** の変更でこのジョブを走らせる。
      - name: Type check (packages/trend)
        run: pnpm --filter @banto-industrial/trend check

      - name: Test (packages/trend)
        run: pnpm --filter @banto-industrial/trend test

      - name: Build
        run: pnpm --filter chronogazer build

  rust:
    name: Rust (fmt / clippy)
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # CI のビルドは実行ファイルの大きさとリンク時間が効く。デバッグ情報は行番号表
      # （panic の場所・バックトレース）だけ残して軽くする。`test` プロファイルは
      # `dev` を継承するので CARGO_PROFILE_TEST_DEBUG は要らない。Swatinem/rust-cache の
      # キーは CARGO_* の env を含むので、この行を足した最初の 1 回はキャッシュが外れる。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    # banto-tags (and every later I-series crate) depends on banto-core /
    # banto-storage via a git tag reference into tyaro/banto (see
    # crates/banto-tags/Cargo.toml, banto's docs/publishing.md). banto went
    # PUBLIC on 2026-07-12, so Cargo's default git fetcher resolves it with
    # no credentials - no token or insteadOf rewrite is needed here.
    #
    # #468: the job id stays `rust` so Swatinem/rust-cache keeps its existing
    # key. main pushes always run the full workspace, so the cache main
    # saves (and PRs restore) stays a full-workspace cache.
    #
    # #ci-speed（2026-10-19）: nextest は下の `rust-test` ジョブへ分けた。このジョブは
    # fmt / clippy だけを回す（doctest は rust-doctest）。
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # rustfmt only parses/reformats - no compilation, so it always covers
      # every workspace member (cheap), whatever the clippy/test scope below.
      # #ci-speed（2026-11-23）: fmt はコンパイルせずキャッシュも使わないので、rust-cache の復元（約 80 秒）より前に回し、整形の誤りを早く知らせる。
      - name: fmt
        run: cargo fmt --all --check
      # `cache-workspace-crates` は見送った（#638 レビュー: rust-cache のキーにソースの中身が入らず、完全一致の復元では保存されない。checkout で更新時刻も新しくなり、自前の crate は結局ビルドし直しになる）。
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Scope (`rust_args`, from the changes job): `--workspace` when the root
      # Cargo.toml/Cargo.lock, toolchain, proto, .cargo, .config or .github
      # changed (and on every push to main); otherwise `-p` for the touched
      # app's packages plus their consumers (RUST_PACKAGES in
      # .github/scripts/ci-changes.mjs) and, for crates/<name>/**, that package
      # plus every workspace package that depends on it, transitively, through
      # normal/dev/build path dependencies (`cargo metadata` in the changes job).
      # The workspace scope has no --exclude: the Tauri src-tauri crate
      # (`chronogazer`) has real tests of its own - PR #39 fixed a compile
      # error in relay-wright's src-tauri tests (relay-wright has since been
      # archived, see docs/plan.md) that a prior narrower CI scope had let
      # through undetected (a stale field reference left behind by T2-3). So
      # it stays in scope rather than being excluded for build-time reasons:
      # this job runs on windows-latest with Swatinem/rust-cache, where the
      # Tauri/WebView2 dependency build time is acceptable.
      - name: clippy
        run: cargo clippy ${{ needs.changes.outputs.rust_args }} --all-targets --timings -- -D warnings
      # crate ごとのビルド時間（clippy の check ビルド）。`--timings` は追加のビルドを
      # しない（ビルドの二重化なし）。失敗しても残す。
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-clippy
          path: target/cargo-timings/cargo-timing-*.html
          if-no-files-found: ignore
          retention-days: 14

  # #ci-speed（2026-10-19）: 旧 `rust` ジョブから nextest を分けた。ビルドは
  # `rust-test-build` が 1 回だけ行い（nextest archive）、`rust-test`（3 シャード）は
  # そのアーカイブを展開してテストを走らせるだけにする。対象（`rust_args`）と実行条件
  # （`run_rust`）は `rust` ジョブと同じ。
  # - 目的は Windows ランナーの使用時間の削減。それまでは 3 シャードが同じテスト
  #   バイナリを各自ビルドしていた（各 3〜4 分 x 3 台）。待ち時間は縮まらない
  #   （ビルド → テストが直列になる）ことは承知の上で、ビルドの 3 重化をやめる。
  # - 新しく足した最初の 1 回はキャッシュが外れて、ビルドが長くなる。
  rust-test-build:
    name: Rust test build (nextest archive)
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # rust ジョブと同じ（理由はそちらのコメント）。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # #ci-speed（2026-10-19）: キャッシュの保存は main だけ（全 rust-cache 共通）。
      # PR も保存すると 1 本約 1GB の Windows キャッシュでリポジトリの上限 10GB に
      # すぐ届き、main のキャッシュが消されて PR がキャッシュ無しになった
      # （19:22 に完全一致したキーが 20:04 には消えていた）。PR は main のキャッシュを読む。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # テストバイナリ一式を 1 つのアーカイブにまとめる（実行はしない）。
      - name: build (nextest archive)
        run: cargo nextest archive ${{ needs.changes.outputs.rust_args }} --archive-file nextest-archive.tar.zst --timings
      - name: Upload nextest archive
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1
      # crate ごとのビルド時間（nextest のテストビルド）。失敗しても残す。
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test
          path: target/cargo-timings/cargo-timing-*.html
          if-no-files-found: ignore
          retention-days: 14

  # #ci-speed（2026-11-23）: doctest を `rust-test-build` から別ジョブに切り出した。
  # rust-test-build の末尾に直列で付けると、シャード（rust-test）と rust-wasm が
  # doctest の分（47〜65 秒）だけ待たされてクリティカルパスに乗る。別ジョブなら
  # archive → シャードの流れと並列に走る。
  # - 依存のキャッシュは rust-test-build が main で保存したものを読むだけ
  #   （save-if: false。リポジトリのキャッシュ上限 10GB のため、理由は上の
  #   rust-test-build のコメント）。env もキーに入るので rust-test-build と揃える。
  # - workspace の lib はこのジョブでもう 1 回ビルドする。Windows ランナーの使用時間は
  #   増えるが、待ち時間を縮める代わりとしてオーナーが受け入れた。
  rust-doctest:
    name: Rust doctest
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # rust-test-build と同じ（rust-cache のキーに CARGO_* の env が入るので揃える）。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          save-if: false
      # nextest は doctest を走らせないので、ここで回す。
      - name: test (doctest)
        run: cargo test --doc ${{ needs.changes.outputs.rust_args }}

  # #ci-speed（2026-10-28）: WASM Hub components の ignored テスト（約 17 分）を
  # `rust-test-build` から別ジョブに切り出した。rust-test-build の末尾に直列で付けると、
  # シャード（rust-test）が WASM の分だけ待たされてクリティカルパスに乗る。別ジョブなら
  # archive → シャードの流れと並列に走る。
  # - 実行条件は旧ステップの `if:` と同じ（workspace 全体か `-p banto-hub-host` を含む）。
  #   ci-changes.mjs の `run_wasm` に移した。
  # - #ci-speed（2026-11-20）: テストは自分でビルドせず、rust-test-build の nextest
  #   archive（artifact `nextest-archive`）を展開して走らせる。それまでは rust-cache が
  #   workspace の crate を戻さないので、毎回 `cargo test` でテストのバイナリを
  #   ビルドし直していた（t12_connection_test で約 7 分、--bin banto-hub で約 3.7 分）。
  #   `#[ignore]` のテストも archive のバイナリには入っている。ci-changes.mjs は
  #   run_wasm のとき rust_args に banto-driver-wasm も足すので、両パッケージが入る。
  # - rust-cache は使わない: ここでビルドするのは RUNNER_TEMP に clone したゲストと
  #   fixture（いずれも別 workspace で、rust-cache の対象の target の外）だけで、
  #   workspace のキャッシュを戻しても使わない（archive の展開で target を上書きする）。
  #   dtolnay/rust-toolchain も外し、ゲスト用の 1.98.1 と wasm32 は rustup で入れる。
  # - archive は rust-test と同じくワークスペース直下へ展開する（`env!("CARGO_BIN_EXE_*")`
  #   の絶対パスを合わせるため。理由は rust-test のコメント）。展開は 1 回だけで、
  #   各テストは archive 内の binaries-metadata / cargo-metadata を使って走らせる。
  rust-wasm:
    name: Rust WASM Hub components
    needs: [changes, rust-test-build]
    if: needs.changes.outputs.run_wasm == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # rust-wasm のゲストのビルドとキャッシュキーの元。ピン・toolchain・wasm-tools・cargo の
      # 引数は、ここだけに書く（キーは WASM_GUEST_PIN_* を名前で全部拾ってハッシュする）。
      # ピンを足したら、キー計算の「13 本」の検査の数も合わせる。
      WASM_GUEST_REPO: https://github.com/tyaro/banto-driver-wasm.git
      WASM_GUEST_TOOLCHAIN: '1.98.1'
      WASM_TOOLS_VERSION: '1.262.0'
      WASM_GUEST_CARGO_ARGS: '--target wasm32-unknown-unknown --locked'
      WASM_GUEST_PIN_WIT_MAIN: '3b7f0f6120af689fdd7a807cff7837657242c6b2'
      WASM_GUEST_PIN_MODBUS_BASE: '5233d55a4d1c278c473e9c44df608c1423c1a629'
      WASM_GUEST_PIN_SLMP_READ: '3df89fdb0ed16b08897076495ab7cb29ac2c1b77'
      WASM_GUEST_PIN_SLMP_WRITE: 'fdb161520019b81a22bc2fec2bc9bf3d837f5bd3'
      WASM_GUEST_PIN_SLMP_RANGE_WRITE: 'c95e7f84e0a3b275298901882a9f6b2512c4f41a'
      WASM_GUEST_PIN_Q_TEST_WRITE: '33171bbb990859c5a46df44cfafc233e58ba5317'
      WASM_GUEST_PIN_SLMP_NORMAL_WRITE: 'ce6513a127d956ca00508f8d47480567c73e4a49'
      WASM_GUEST_PIN_SLMP_COMMON_DW: '532e0ba1f0b91a67422e33dac72e9edbb7c3fe0e'
      WASM_GUEST_PIN_SLMP_DIAGNOSTIC: 'f20766041ed75de1f6102c01dc94151d48785d5e'
      WASM_GUEST_PIN_SLMP_NEW: '5281578d79fb2055a7af86c96691d15bf95dab65'
      WASM_GUEST_PIN_MODBUS_NUMERIC: '9ffa939ffc3551325551b28e4993ec62b8ddc34d'
      WASM_GUEST_PIN_FC4_W: '290648da33895a707abcaaafeb23bd0f05d5b828'
      WASM_GUEST_PIN_MODBUS_JOIN: 'f6c8781bab6f85a6c866e4d552039b547c4390ac'
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
      # `cargo-nextest nextest` と直接呼ぶ理由は rust-test と同じ。list で 1 回だけ
      # 展開し、以降は展開した target/nextest/*.json を使う（各テストで展開し直さない）。
      - name: Extract nextest archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo-nextest nextest list --archive-file nextest-archive.tar.zst --workspace-remap . --extract-to . --extract-overwrite --run-ignored all -E 'package(banto-hub-host) | package(banto-driver-wasm)' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'nextest archive extraction failed' }
          foreach ($f in @('target/nextest/binaries-metadata.json', 'target/nextest/cargo-metadata.json')) {
            if (-not (Test-Path $f)) { throw "nextest archive metadata missing: $f" }
          }
      - name: Install wasm-tools (verified binary)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@${{ env.WASM_TOOLS_VERSION }}
          checksum: true
          fallback: none
      # ゲストの成果物（component 化した後の .wasm）のキャッシュ。
      # キーは「成果物を決めるもの」を全部ハッシュする: ゲストのリポジトリ URL・13 本のピン
      # （job env の WASM_GUEST_PIN_* を名前で全部拾う。足し忘れは 13 本の数の検査で落ちる）・
      # ゲストの toolchain・wasm-tools の版・cargo の引数・fixture（device-address）の中身と
      # それが読む WIT・OS とアーキテクチャ。ビルドの手順の形（debug、どの crate をどの名前で
      # component 化するか）を変えたら、下の接頭辞 `wasm-guests-v1-` を上げる。
      # ピンの SHA・WIT の突き合わせ・manifest の突き合わせ・`wasm-tools validate` と
      # `component targets` は、キャッシュに当たっても毎回走らせる（ホストの WIT は PR で
      # 変わるのでキーに頼らない）。キャッシュが省くのは rustup の導入・cargo build・
      # `wasm-tools component new` だけ。
      - name: Compute WASM guest cache key
        id: guest-key
        shell: pwsh
        env:
          FIXTURE_HASH: ${{ hashFiles('crates/banto-driver-wasm/tests/fixtures/device-address/**', 'crates/banto-driver-wasm/wit/**', '.cargo/config.toml') }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:FIXTURE_HASH) { throw 'fixture hash is empty' }
          $parts = [System.Collections.Generic.List[string]]::new()
          foreach ($name in @('WASM_GUEST_REPO', 'WASM_GUEST_TOOLCHAIN', 'WASM_TOOLS_VERSION', 'WASM_GUEST_CARGO_ARGS')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if (-not $value) { throw "$name is empty" }
            $parts.Add("$name=$value")
          }
          $pins = @(Get-ChildItem env: | Where-Object { $_.Name -like 'WASM_GUEST_PIN_*' } | Sort-Object Name)
          if ($pins.Count -ne 13) { throw "expected 13 guest pins in the job env, found $($pins.Count)" }
          foreach ($pin in $pins) {
            if ($pin.Value -notmatch '^[0-9a-f]{40}$') { throw "$($pin.Name) is not a full SHA" }
            $parts.Add("$($pin.Name)=$($pin.Value)")
          }
          $parts.Add("fixture=$($env:FIXTURE_HASH)")
          $parts.Add("os=$($env:RUNNER_OS)-$($env:RUNNER_ARCH)")
          $text = $parts -join "`n"
          Write-Host $text
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($text)
          $hash = [System.BitConverter]::ToString([System.Security.Cryptography.SHA256]::HashData($bytes)).Replace('-', '').ToLowerInvariant()
          $key = "wasm-guests-v1-$($env:RUNNER_OS)-$($env:RUNNER_ARCH)-$hash"
          Write-Host "cache key: $key"
          "key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Restore WASM guest components
        id: guest-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\wasm-guests
          key: ${{ steps.guest-key.outputs.key }}
      # Canonical guest source is a public, separate repository. Pin 検査と
      # ゲストのビルド・component 化・検証をここでまとめて行い、テストは次のステップで
      # 走らせる（成果物は RUNNER_TEMP\wasm-guests、manifest は RUNNER_TEMP\wasm-guest-manifests）。
      - name: Build and verify WASM guests
        shell: pwsh
        env:
          GUESTS_CACHED: ${{ steps.guest-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $guestsCached = $env:GUESTS_CACHED -eq 'true'
          Write-Host "guest component cache hit: $guestsCached"
          $out = Join-Path $env:RUNNER_TEMP 'wasm-guests'
          $manifests = Join-Path $env:RUNNER_TEMP 'wasm-guest-manifests'
          New-Item -ItemType Directory -Force $out, $manifests | Out-Null
          $cargoArgs = $env:WASM_GUEST_CARGO_ARGS -split ' '
          # キャッシュに当たったら、cargo build と `wasm-tools component new` を飛ばして
          # 成果物があることだけ確かめる（validate と targets は呼び出し側が毎回通す）。
          function Build-GuestComponent([string]$Label, [string]$ManifestDir, [string]$Module, [string]$Out) {
            if ($guestsCached) {
              if (-not (Test-Path -LiteralPath $Out -PathType Leaf) -or (Get-Item -LiteralPath $Out).Length -eq 0) {
                throw "$Label cached component is missing or empty: $Out"
              }
              return
            }
            cargo "+$($env:WASM_GUEST_TOOLCHAIN)" build --manifest-path (Join-Path $ManifestDir 'Cargo.toml') @cargoArgs
            if ($LASTEXITCODE -ne 0) { throw "$Label build failed" }
            $moduleFile = Join-Path $ManifestDir "target/wasm32-unknown-unknown/debug/$Module.wasm"
            wasm-tools component new $moduleFile -o $Out
            if ($LASTEXITCODE -ne 0) { throw "$Label component creation failed" }
          }
          function Test-GuestComponent([string]$Label, [string]$File, [string]$Wit, [string[]]$Worlds) {
            wasm-tools validate $File
            if ($LASTEXITCODE -ne 0) { throw "$Label component validation failed" }
            foreach ($world in $Worlds) {
              wasm-tools component targets $Wit $File --world $world
              if ($LASTEXITCODE -ne 0) { throw "$Label component world mismatch ($world)" }
            }
          }
          # Guest main: its wit/driver.wit is the host WIT (#902 added
          # item-error.verification-failed in guest #47).
          $canonicalSha = $env:WASM_GUEST_PIN_WIT_MAIN
          # Regression pins below predate #47. Their driver.wit (this blob)
          # lacks that one item-error case, and Wasmtime's component type
          # check needs the exact variant cases, so they are built with the
          # guest main driver.wit swapped in. That blob pair differs only in
          # the item-error line; each pin's code and other WIT files are kept.
          $legacyDriverWit = '313a79ed545a366c938c9bc2d8f86f7c3ca0141e'
          $sha = $env:WASM_GUEST_PIN_MODBUS_BASE
          $guest = Join-Path $env:RUNNER_TEMP 'banto-driver-wasm'
          git clone --quiet $env:WASM_GUEST_REPO $guest
          if ($LASTEXITCODE -ne 0) { throw 'canonical guest clone failed' }
          # Compare committed blobs: Windows may check out either worktree with CRLF.
          $canonicalWit = git -C $guest rev-parse --verify "${canonicalSha}:wit/driver.wit"
          if ($LASTEXITCODE -ne 0) { throw 'canonical WIT blob lookup failed' }
          $hostWit = git rev-parse --verify 'HEAD:crates/banto-driver-wasm/wit/driver.wit'
          if ($LASTEXITCODE -ne 0) { throw 'host WIT blob lookup failed' }
          if ($canonicalWit -ne $hostWit) { throw 'canonical WIT and host WIT differ' }
          function Enter-GuestPin([string]$pin, [string]$label) {
            # --force drops the previous pin's swapped driver.wit.
            git -C $guest checkout --quiet --force --detach $pin
            if ($LASTEXITCODE -ne 0 -or (git -C $guest rev-parse HEAD).Trim() -ne $pin) {
              throw "$label SHA mismatch"
            }
            $pinWit = git -C $guest rev-parse --verify "${pin}:wit/driver.wit"
            if ($LASTEXITCODE -ne 0) { throw "$label WIT blob lookup failed" }
            if ($pinWit -eq $hostWit) { return }
            if ($pinWit -ne $legacyDriverWit) { throw "$label read WIT mismatch" }
            git -C $guest checkout --quiet $canonicalSha -- wit/driver.wit
            if ($LASTEXITCODE -ne 0) { throw "$label WIT swap failed" }
            $swapped = git -C $guest rev-parse --verify ':wit/driver.wit'
            if ($LASTEXITCODE -ne 0 -or $swapped -ne $hostWit) { throw "$label swapped WIT mismatch" }
          }
          Enter-GuestPin $sha 'canonical guest'
          $canonicalManifest = git -C $guest rev-parse --verify "${sha}:component/manifest.json"
          if ($LASTEXITCODE -ne 0) { throw 'canonical manifest blob lookup failed' }
          $hostManifest = git rev-parse --verify 'HEAD:crates/banto-driver-wasm/tests/manifest.json'
          if ($LASTEXITCODE -ne 0) { throw 'host manifest blob lookup failed' }
          if ($canonicalManifest -ne $hostManifest) { throw 'canonical manifest and host manifest differ' }
          # ゲストのビルドだけに使う（ホスト側は archive を走らせるのでビルドしない）。
          # キャッシュに当たったときは cargo を使わないので、導入も省く。
          if (-not $guestsCached) {
            rustup toolchain install $env:WASM_GUEST_TOOLCHAIN --profile minimal
            if ($LASTEXITCODE -ne 0) { throw "Rust $($env:WASM_GUEST_TOOLCHAIN) installation failed" }
            rustup target add wasm32-unknown-unknown --toolchain $env:WASM_GUEST_TOOLCHAIN
            if ($LASTEXITCODE -ne 0) { throw 'wasm32 target installation failed' }
          }
          $wasmToolsVersion = wasm-tools --version
          Write-Host "wasm-tools version: $wasmToolsVersion"
          $wasmToolsPattern = '^wasm-tools ' + [regex]::Escape($env:WASM_TOOLS_VERSION) + '(?: \([0-9a-f]{9} \d{4}-\d{2}-\d{2}\))?$'
          if ($LASTEXITCODE -ne 0 -or $wasmToolsVersion -notmatch $wasmToolsPattern) {
            throw 'wasm-tools version mismatch'
          }
          $driverWit = 'crates/banto-driver-wasm/wit/driver.wit'
          $witDir = 'crates/banto-driver-wasm/wit'
          $modbusModule = 'banto_modbus_tcp_component'
          $slmpModule = 'banto_slmp_read_component'
          $modbusDir = Join-Path $guest 'component'
          $slmpDir = Join-Path $guest 'slmp-component'
          # Modbus base pin: canonical guest.
          $canonicalWasm = Join-Path $out 'banto-modbus-tcp-component.wasm'
          Build-GuestComponent 'canonical guest' $modbusDir $modbusModule $canonicalWasm
          Test-GuestComponent 'canonical' $canonicalWasm (Join-Path $guest 'wit/driver.wit') @('driver')
          $fixture = 'crates/banto-driver-wasm/tests/fixtures/device-address'
          $deviceWasm = Join-Path $out 'device-address-component.wasm'
          Build-GuestComponent 'device-address test guest' $fixture 'banto_device_address_test_component' $deviceWasm
          Test-GuestComponent 'device-address' $deviceWasm $driverWit @('driver')
          # The SLMP guest is reviewed separately. Pin it, and keep this Hub
          # acceptance test on the existing WIT and test-only registry path.
          Enter-GuestPin $env:WASM_GUEST_PIN_SLMP_READ 'SLMP guest'
          $slmpReadWasm = Join-Path $out 'slmp-read-component.wasm'
          Build-GuestComponent 'SLMP guest' $slmpDir $slmpModule $slmpReadWasm
          Test-GuestComponent 'SLMP' $slmpReadWasm $driverWit @('driver')
          # The optional write world is accepted only by the controlled test
          # loader. Keep the read-only guest pinned above for regression tests.
          $slmpWriteSha = $env:WASM_GUEST_PIN_SLMP_WRITE
          Enter-GuestPin $slmpWriteSha 'SLMP write guest'
          $hostWriteWit = git rev-parse --verify 'HEAD:crates/banto-driver-wasm/wit/write-v1.wit'
          if ($LASTEXITCODE -ne 0) { throw 'host SLMP write WIT is missing' }
          $slmpWriteWit = git -C $guest rev-parse --verify "${slmpWriteSha}:wit/write-v1.wit"
          if ($LASTEXITCODE -ne 0 -or $slmpWriteWit -ne $hostWriteWit) {
            throw 'SLMP write guest WIT mismatch'
          }
          $slmpWriteWasm = Join-Path $out 'slmp-write-component.wasm'
          Build-GuestComponent 'SLMP write guest' $slmpDir $slmpModule $slmpWriteWasm
          Test-GuestComponent 'SLMP write' $slmpWriteWasm $witDir @('driver-with-write-v1')
          # The range-write guest is pinned separately. Keep the earlier
          # write-v1 component above for single-word compatibility tests.
          $slmpRangeWriteSha = $env:WASM_GUEST_PIN_SLMP_RANGE_WRITE
          Enter-GuestPin $slmpRangeWriteSha 'SLMP range-write guest'
          $slmpRangeWriteWit = git -C $guest rev-parse --verify "${slmpRangeWriteSha}:wit/write-v1.wit"
          if ($LASTEXITCODE -ne 0 -or $slmpRangeWriteWit -ne $hostWriteWit) {
            throw 'SLMP range-write guest WIT mismatch'
          }
          $slmpRangeWriteWasm = Join-Path $out 'slmp-range-write-component.wasm'
          Build-GuestComponent 'SLMP range-write guest' $slmpDir $slmpModule $slmpRangeWriteWasm
          Test-GuestComponent 'SLMP range-write' $slmpRangeWriteWasm $witDir @('driver-with-write-v1')
          # Q25PRH write remains a separate, default-disabled test fixture.
          # Pin the separately published guest and exercise settings persistence and broker
          # routing with a mock Q endpoint. Never run the ignored live Q test.
          $qTestWriteSha = $env:WASM_GUEST_PIN_Q_TEST_WRITE
          Enter-GuestPin $qTestWriteSha 'Q25PRH test-write guest'
          $qTestWriteWit = git -C $guest rev-parse --verify "${qTestWriteSha}:wit/write-v1.wit"
          if ($LASTEXITCODE -ne 0 -or $qTestWriteWit -ne $hostWriteWit) {
            throw 'Q25PRH test-write guest WIT mismatch'
          }
          $qTestWasm = Join-Path $out 'slmp-q25prh-test-write-component.wasm'
          Build-GuestComponent 'Q25PRH test-write guest' $slmpDir $slmpModule $qTestWasm
          Test-GuestComponent 'Q25PRH test-write' $qTestWasm $witDir @('driver-with-write-v1')
          # Normal Q/R D/u16 writes use a separately selected, signed plugin.
          # This job exercises only loopback PLCs and temporary TestApp state;
          # its ignored live-PLC fixtures are not selected.
          $normalWriteSha = $env:WASM_GUEST_PIN_SLMP_NORMAL_WRITE
          Enter-GuestPin $normalWriteSha 'normal SLMP write guest'
          $normalWriteWit = git -C $guest rev-parse --verify "${normalWriteSha}:wit/write-v1.wit"
          if ($LASTEXITCODE -ne 0 -or $normalWriteWit -ne $hostWriteWit) {
            throw 'normal SLMP write guest WIT mismatch'
          }
          $normalWriteWasm = Join-Path $out 'slmp-normal-write-component.wasm'
          Build-GuestComponent 'normal SLMP write guest' $slmpDir $slmpModule $normalWriteWasm
          Test-GuestComponent 'normal SLMP write' $normalWriteWasm $witDir @('driver-with-write-v1')
          # The merged common D/W guest also advertises bit reads. Keep the
          # earlier D-only guest regression above, then build this revision
          # independently instead of relying on a developer's local component.
          $commonDwSha = $env:WASM_GUEST_PIN_SLMP_COMMON_DW
          Enter-GuestPin $commonDwSha 'common D/W SLMP guest'
          $commonDwWriteWit = git -C $guest rev-parse --verify "${commonDwSha}:wit/write-v1.wit"
          if ($LASTEXITCODE -ne 0 -or $commonDwWriteWit -ne $hostWriteWit) {
            throw 'common D/W SLMP guest write WIT mismatch'
          }
          $commonDwWasm = Join-Path $out 'slmp-common-dw-component.wasm'
          Build-GuestComponent 'common D/W SLMP guest' $slmpDir $slmpModule $commonDwWasm
          Test-GuestComponent 'common D/W SLMP' $commonDwWasm $witDir @('driver-with-write-v1')
          # Optional diagnostics use a new world. The existing read/write
          # worlds and their pinned regression guests above remain unchanged.
          $diagnosticSha = $env:WASM_GUEST_PIN_SLMP_DIAGNOSTIC
          Enter-GuestPin $diagnosticSha 'diagnostic SLMP guest'
          foreach ($wit in @('write-v1.wit', 'diagnostics-v1.wit')) {
            $guestBlob = git -C $guest rev-parse --verify "${diagnosticSha}:wit/$wit"
            $hostBlob = git rev-parse --verify "HEAD:crates/banto-driver-wasm/wit/$wit"
            if ($LASTEXITCODE -ne 0 -or $guestBlob -ne $hostBlob) {
              throw "diagnostic SLMP $wit mismatch"
            }
          }
          $diagnosticWasm = Join-Path $out 'slmp-diagnostics-component.wasm'
          Build-GuestComponent 'diagnostic SLMP guest' $slmpDir $slmpModule $diagnosticWasm
          Test-GuestComponent 'diagnostic SLMP' $diagnosticWasm $witDir @('driver-with-write-and-diagnostics-v1')
          # Keep the earlier diagnostic and read/write guests above for
          # compatibility. Build guest main (SLMP code as of #61, WIT as of #47)
          # separately for Hub acceptance. Its own pin: $canonicalSha stays at #47.
          # #43 leaves bit tags proven Outside out of the read plan; the earlier
          # guests above still read them one by one. #51 reads W word bits
          # (W1A.0), #55 and #56 read S/Z/RD and the Q ZR as read-only
          # range-Unknown tags (E1 3E frame and E2 routed access are accepted here).
          # #60 (D3) reads QnU extended W below the SD310-311 total and W10000H;
          # #61 (F) writes D/W word bits by read-modify-write, authorized only by
          # word-bit intervals of the same allowlist (Hub gate in banto-driver-wasm).
          # #62 (E4) accepts the setting transport=udp (frames unchanged; the
          # Host owns the UDP transport, #933). #63 (C1) reads D/W strings of
          # 1-128 words as bytes low byte first per word and writes one string
          # item as one 1401 (Hub gate #934). #65 (G1) reads U\G buffer memory
          # (U<h>\G<n>, numeric, word-bit and string, read-only, one request per
          # tag; Q 0080 / R 0082 with FAH for the R CPU buffer U3E0-U3E3) and
          # reports area U<h>\G per module (Hub string gate #917). #69 (G2a)
          # identifies the Q process CPU QnPH, QnUDPV (like QnUDV), MELSEC-L
          # (like standard Q) and Q12PRH (like Q25PRH) by the exact 0101
          # name/code pair. #71 reads ZR addresses as decimal on Q and R (ZR10
          # is device 10; letters are rejected). #72 (G2b) identifies the iQ-R
          # process CPU (RnPCPU, reads S like R), SIL2 process CPU (RnPSFCPU),
          # safety CPU (RnSFCPU) and MX-R (these three have no S) as standard R
          # by the exact 0101 name/code pair. #73 (G2c) identifies the FX5
          # (iQ-F: a code in the FX5 table and a name starting with FX5); it
          # is read and written over 3E to the own station only (4E or another
          # station is treated like an unknown model), with monitoring timer
          # 0000H after 0101, and adds the read-only file register R (FX5
          # only). WIT and Hub are unchanged. #74 (G3) reads GX Works3 global
          # labels (@Name, area @, no index) with 041C and writes them with a
          # 041C type check and one 141B on standard R only, under the new
          # label_write_allowlist (Hub gate: same grammar in banto-driver-wasm,
          # string area @). WIT is unchanged. #76 (H) adds the optional
          # clock-v1 (wit/clock-v1.wit): on a 0101-confirmed iQ-R, own station
          # only, it writes SD210-SD216 and turns SM210 ON (guest gate
          # clock_set); the Hub binds driver-with-clock-v1 and offers it only
          # through the operational write loader. #78 (H3) adds the optional
          # clock-read-v1 (wit/clock-read-v1.wit): on a 0101-confirmed iQ-R or
          # standard Q, own station only, it reads SM210-SM213 and then
          # SD210-SD216 (BIN) or SD210-SD213 (BCD), writing nothing (SM213 OFF
          # is rejected); the Hub binds driver-with-clock-read-v1 and offers it
          # whatever the loader.
          $newSlmpSha = $env:WASM_GUEST_PIN_SLMP_NEW
          Enter-GuestPin $newSlmpSha 'new SLMP guest'
          foreach ($wit in @('write-v1.wit', 'diagnostics-v1.wit', 'clock-v1.wit', 'clock-read-v1.wit')) {
            $guestBlob = git -C $guest rev-parse --verify "${newSlmpSha}:wit/$wit"
            $hostBlob = git rev-parse --verify "HEAD:crates/banto-driver-wasm/wit/$wit"
            if ($LASTEXITCODE -ne 0 -or $guestBlob -ne $hostBlob) {
              throw "new SLMP guest $wit mismatch"
            }
          }
          # The guest repository does not publish an SLMP manifest. The
          # checked-in Host operational-write manifest is the current loader
          # fixture; never substitute the guest's Modbus manifest.
          $slmpManifest = Get-Content 'apps/banto-hub/host/tests/t12_slmp_wasm_operational_write/manifest.json' -Raw | ConvertFrom-Json
          if ($slmpManifest.id -ne 'slmp-wasm-operational-write' -or $slmpManifest.writeApi -ne '1' -or
              -not ($slmpManifest.capabilities -contains 'read') -or -not ($slmpManifest.capabilities -contains 'write') -or
              -not ($slmpManifest.transports -contains 'tcp') -or -not ($slmpManifest.transports -contains 'udp')) {
            throw 'SLMP Hub fixture manifest mismatch'
          }
          $newSlmpWasm = Join-Path $out 'slmp-44-component.wasm'
          Build-GuestComponent 'new SLMP guest' $slmpDir $slmpModule $newSlmpWasm
          Test-GuestComponent 'new SLMP' $newSlmpWasm $witDir @(
            'driver-with-write-and-diagnostics-v1',
            'driver-with-write-diagnostics-and-clock-v1',
            'driver-with-clock-v1',
            'driver-with-write-diagnostics-clock-and-clock-read-v1',
            'driver-with-clock-read-v1')
          # Stage-2 numeric reads use the separately reviewed guest revision.
          # Keep the older guest revisions above for read and write regressions.
          Enter-GuestPin $env:WASM_GUEST_PIN_MODBUS_NUMERIC 'numeric guest'
          Copy-Item -LiteralPath (Join-Path $guest 'component/manifest.json') -Destination (Join-Path $manifests 'numeric-modbus-manifest.json')
          $numericModbusWasm = Join-Path $out 'numeric-modbus-component.wasm'
          Build-GuestComponent 'numeric Modbus guest' $modbusDir $modbusModule $numericModbusWasm
          Test-GuestComponent 'numeric Modbus' $numericModbusWasm $driverWit @('driver')
          $numericSlmpWasm = Join-Path $out 'numeric-slmp-component.wasm'
          Build-GuestComponent 'numeric SLMP guest' $slmpDir $slmpModule $numericSlmpWasm
          Test-GuestComponent 'numeric SLMP' $numericSlmpWasm $driverWit @('driver')
          # FC4 and SLMP W use a separately reviewed read-only guest revision.
          # Keep the stage-2 and write revisions above pinned for regressions.
          Enter-GuestPin $env:WASM_GUEST_PIN_FC4_W 'FC4/W guest'
          Copy-Item -LiteralPath (Join-Path $guest 'component/manifest.json') -Destination (Join-Path $manifests 'fc4-modbus-manifest.json')
          $fc4Wasm = Join-Path $out 'fc4-modbus-component.wasm'
          Build-GuestComponent 'FC4 Modbus guest' $modbusDir $modbusModule $fc4Wasm
          Test-GuestComponent 'FC4 Modbus' $fc4Wasm $driverWit @('driver')
          $slmpWWasm = Join-Path $out 'slmp-w-component.wasm'
          Build-GuestComponent 'SLMP W guest' $slmpDir $slmpModule $slmpWWasm
          Test-GuestComponent 'SLMP W' $slmpWWasm $driverWit @('driver')
          # Modbus FC1/2/3/4 and gated FC5/6/15/16/22 join uses the exact reviewed
          # guest package manifest and the optional write world (guest main:
          # Modbus code as of #58 (A1 coil/discrete probe, B1 register_bit_write,
          # B2 FC15 coil runs and register_write=fc6 from #53) and #63 (C1:
          # 3xxxxx/4xxxxx strings of 1-123 words, high byte first per register,
          # one holding string written as one FC16; manifest 0.9.0);
          # its WIT is still the #47 one, so Enter-GuestPin keeps the WIT checkout).
          $modbusJoinSha = $env:WASM_GUEST_PIN_MODBUS_JOIN
          Enter-GuestPin $modbusJoinSha 'Modbus join guest'
          $modbusWriteWit = git -C $guest rev-parse --verify "${modbusJoinSha}:wit/write-v1.wit"
          if ($LASTEXITCODE -ne 0 -or $modbusWriteWit -ne $hostWriteWit) { throw 'Modbus join write WIT mismatch' }
          Copy-Item -LiteralPath (Join-Path $guest 'component/manifest.json') -Destination (Join-Path $manifests 'modbus-join-manifest.json')
          $modbusJoinWasm = Join-Path $out 'modbus-join-component.wasm'
          Build-GuestComponent 'Modbus join guest' $modbusDir $modbusModule $modbusJoinWasm
          Test-GuestComponent 'Modbus join' $modbusJoinWasm $witDir @('driver-with-write-v1')
          # 成果物がちょうど 15 個そろっていること（キャッシュに入るのもこの 15 個）。
          $built = @(Get-ChildItem -LiteralPath $out -File)
          if ($built.Count -ne 15) { throw "expected 15 guest components, found $($built.Count)" }
      # main だけが保存する（repo の rust-cache と同じ方針）。PR の実行は main の
      # キャッシュを読めるが、PR の ref に閉じた保存は他の PR から見えず、main の
      # 保存だけが全員に配られる。PR で保存しても同じ内容の別コピーが増えるだけなので省く。
      # 上のビルド・検証が成功したときだけ（暗黙の success()）保存する。
      - name: Save WASM guest components
        if: github.ref == 'refs/heads/main' && steps.guest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\wasm-guests
          key: ${{ steps.guest-key.outputs.key }}
      - name: test (WASM Hub components)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # テストは rust-test-build の nextest archive（前のステップで展開済み）から
          # 走らせる。ここではホスト側をビルドしない。--no-tests=fail で一致 0 件を
          # 失敗にし、nextest の Summary 行の「N tests run: N passed」で件数を確かめる
          # （旧 `test result: ok. N passed` の検査と同じ強さ）。-Expected 0 は 1 件以上。
          # -RunIgnored は既定 only（旧 `-- --ignored` と同じ）。default は旧の無指定。
          # nextest の起動は 1 回ごとに全バイナリの一覧を作り直すので、環境変数と引数が
          # 同じ試験は Invoke-ArchivedTestGroup で 1 回にまとめる。まとめた中の各部分は、
          # PASS の行をバイナリ・試験名で数え、部分ごとの件数と「合計が全 PASS と一致」
          # （どの部分にも属さない試験が走らない）も確かめる。
          # 環境変数が違うもの（ゲストの .wasm の差し替え）や --run-ignored が違うものは、
          # 別々の起動のままにしてある。環境変数は元のステップと同じ順序・同じ値で設定する。
          $binariesMetadata = 'target/nextest/binaries-metadata.json'
          $cargoMetadata = 'target/nextest/cargo-metadata.json'
          $guestDir = Join-Path $env:RUNNER_TEMP 'wasm-guests'
          $manifestDir = Join-Path $env:RUNNER_TEMP 'wasm-guest-manifests'
          function Get-GuestFile([string]$Dir, [string]$Name) {
            $p = Join-Path $Dir $Name
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "guest file is missing: $p" }
            return $p
          }
          function Invoke-ArchivedTest([string]$Label, [int]$Expected, [string]$Filter, [string]$RunIgnored = 'only', [string]$Log) {
            if (-not $Log) { $Log = Join-Path $env:RUNNER_TEMP ('nextest-' + [guid]::NewGuid() + '.txt') }
            Write-Host "nextest filterset: $Filter"
            cargo-nextest nextest run --binaries-metadata $binariesMetadata --cargo-metadata $cargoMetadata --workspace-remap . --run-ignored $RunIgnored --no-tests=fail --no-fail-fast --color never -E $Filter 2>&1 | Tee-Object -FilePath $Log
            if ($LASTEXITCODE -ne 0) { throw "$Label failed" }
            $summary = Select-String -Path $Log -Pattern '^\s*Summary \[[^\]]*\]\s+(\d+) tests? run: (\d+) passed' | Select-Object -Last 1
            if (-not $summary) { throw "${Label}: nextest summary not found" }
            $run = [int]$summary.Matches[0].Groups[1].Value
            $passed = [int]$summary.Matches[0].Groups[2].Value
            if ($run -lt 1 -or $passed -ne $run -or ($Expected -gt 0 -and $run -ne $Expected)) {
              throw "$Label did not run as expected (expected: $Expected, run: $run, passed: $passed)"
            }
          }
          # 部分 = @{ Id; Binary; Name（完全一致）; Like（部分一致のどれか）; Not（部分一致で除く）; Expected（0 は 1 件以上） }
          function New-PartFilter($Part) {
            $f = "binary_id($($Part.Binary))"
            if ($Part.Name) { $f += " & test(=$($Part.Name))" }
            if ($Part.Like) { $f += ' & (' + ((@($Part.Like) | ForEach-Object { "test(~$_)" }) -join ' | ') + ')' }
            foreach ($n in @($Part.Not)) { if ($n) { $f += " - test(~$n)" } }
            return $f
          }
          function Test-PartMatch($Passed, $Part) {
            if ($Passed.Binary -ne $Part.Binary) { return $false }
            if ($Part.Name -and $Passed.Name -ne $Part.Name) { return $false }
            if ($Part.Like -and -not (@($Part.Like) | Where-Object { $Passed.Name.Contains($_) })) { return $false }
            foreach ($n in @($Part.Not)) { if ($n -and $Passed.Name.Contains($n)) { return $false } }
            return $true
          }
          function Invoke-ArchivedTestGroup([string]$Label, [object[]]$Parts) {
            $filter = (@($Parts | ForEach-Object { '(' + (New-PartFilter $_) + ')' })) -join ' | '
            $expected = 0
            $open = $false
            foreach ($p in $Parts) { if ($p.Expected -gt 0) { $expected += $p.Expected } else { $open = $true } }
            if ($open) { $expected = 0 }
            $log = Join-Path $env:RUNNER_TEMP ('nextest-group-' + [guid]::NewGuid() + '.txt')
            Invoke-ArchivedTest -Label $Label -Expected $expected -Filter $filter -Log $log
            $passLines = @(Get-Content -LiteralPath $log | ForEach-Object {
              # LEAK は合格だがハンドルを残した試験（nextest は passed に数える）。
              if ($_ -match '^\s*(?:PASS|LEAK)\s+\[[^\]]*\]\s+(?:\(\s*\d+/\s*\d+\)\s+)?(\S+)\s+(\S+)\s*$') {
                [pscustomobject]@{ Binary = $Matches[1]; Name = $Matches[2] }
              }
            })
            $accounted = 0
            foreach ($p in $Parts) {
              $n = @($passLines | Where-Object { Test-PartMatch $_ $p }).Count
              if ($p.Expected -gt 0 -and $n -ne $p.Expected) { throw "${Label}: part '$($p.Id)' expected $($p.Expected), passed $n" }
              if ($p.Expected -le 0 -and $n -lt 1) { throw "${Label}: part '$($p.Id)' ran no test" }
              $accounted += $n
            }
            if ($accounted -ne $passLines.Count) {
              throw "${Label}: $($passLines.Count) tests passed but the parts account for $accounted"
            }
          }
          $hubConn = 'banto-hub-host::t12_connection_test'
          # 1 回目: canonical guest の接続試験・署名付き起動・device-address・adapter・epoch。
          # device-address の .wasm の環境変数は、元は接続試験の後に設定していた。それを
          # 読むのは device-address の試験と banto-hub の起動の試験だけなので、接続試験の
          # 起動にも付けて、5 件を 1 回で走らせる。
          $env:BANTO_COMPONENT_WASM = Get-GuestFile $guestDir 'banto-modbus-tcp-component.wasm'
          $env:BANTO_DEVICE_COMPONENT_WASM = Get-GuestFile $guestDir 'device-address-component.wasm'
          Invoke-ArchivedTestGroup -Label 'WASM Hub connection, signed startup, device-address and component tests' -Parts @(
            @{ Id = 'WASM Hub connection test'; Binary = $hubConn; Name = 'wasm_fc3_connection_test_direct_reuse_and_changed_settings'; Expected = 1 },
            @{ Id = 'signed startup registration test'; Binary = 'banto-hub-host::bin/banto-hub'; Name = 'wasm_plugins::tests::real_component_registers_on_restart_and_rejects_tampering'; Expected = 1 },
            @{ Id = 'device-address Hub test'; Binary = $hubConn; Name = 'device_address_test::saves_collects_reads_now_and_reuses_broker'; Expected = 1 },
            @{ Id = 'WASM component adapter tests'; Binary = 'banto-driver-wasm::component'; Expected = 3 },
            @{ Id = 'WASM component epoch test'; Binary = 'banto-driver-wasm'; Name = 'runtime::tests::real_component_export_expires_at_epoch_deadline'; Expected = 1 }
          )
          $env:BANTO_SLMP_COMPONENT_WASM = Get-GuestFile $guestDir 'slmp-read-component.wasm'
          $slmpTestLog = Join-Path $env:RUNNER_TEMP 'wasm-slmp-hub-test.txt'
          Invoke-ArchivedTest -Label 'SLMP WASM Hub tests' -Expected 16 -Filter 'binary_id(banto-hub-host::t12_connection_test) & test(~slmp_wasm_test::) - test(~slmp_wasm_test::r_eight_numeric_kinds_collect_and_serve_rest) - test(~slmp_wasm_test::r_w_eight_numeric_kinds_collect_and_serve_rest)' -Log $slmpTestLog
          $env:BANTO_SLMP_WRITE_COMPONENT_WASM = Get-GuestFile $guestDir 'slmp-write-component.wasm'
          $env:BANTO_SLMP_RANGE_WRITE_COMPONENT_WASM = Get-GuestFile $guestDir 'slmp-range-write-component.wasm'
          $slmpWriteTestLog = Join-Path $env:RUNNER_TEMP 'wasm-slmp-write-hub-test.txt'
          Invoke-ArchivedTest -Label 'SLMP WASM controlled write Hub tests' -Expected 13 -Filter 'binary_id(banto-hub-host::t12_connection_test) & test(~slmp_wasm_write_test::)' -Log $slmpWriteTestLog
          $env:BANTO_SLMP_Q_WRITE_COMPONENT_WASM = Get-GuestFile $guestDir 'slmp-q25prh-test-write-component.wasm'
          $qTestLog = Join-Path $env:RUNNER_TEMP 'wasm-q25prh-test-write-hub-test.txt'
          Invoke-ArchivedTest -Label 'Q25PRH test-write Hub tests' -Expected 4 -Filter 'binary_id(banto-hub-host::t12_connection_test) & test(~slmp_wasm_q_write_test::)' -Log $qTestLog
          $qGuardLog = Join-Path $env:RUNNER_TEMP 'wasm-q25prh-test-write-guard-test.txt'
          Invoke-ArchivedTest -Label 'Q25PRH test-write guard tests' -Expected 2 -Filter 'binary_id(banto-hub-host::slmp_wasm_live_q_range_write)' -RunIgnored default -Log $qGuardLog
          $env:BANTO_SLMP_OPERATIONAL_WRITE_COMPONENT_WASM = Get-GuestFile $guestDir 'slmp-normal-write-component.wasm'
          $normalWriteLog = Join-Path $env:RUNNER_TEMP 'wasm-slmp-normal-write-hub-test.txt'
          Invoke-ArchivedTest -Label 'normal SLMP write Hub tests' -Expected 6 -Filter 'binary_id(banto-hub-host::t12_connection_test) & test(~slmp_wasm_operational_write_test::) - test(~new_guest_) - test(~bit_bool_values_and_device_error_survive_the_host_read_boundary) - test(~saved_bit_tags_keep_values_and_quality_after_collection) - test(~explicit_w_range_uses_the_same_q_and_r_gate_without_broadening_d) - test(~diagnostic_guest_uses_existing_connection_and_preserves_read) - test(~saved_tags_are_diagnosed_through_the_authenticated_rest_and_broker_path) - test(~high_low_word_order_is_preserved_through_host_and_guest) - test(~typed_words_are_one_complete_frame_and_bad_items_send_nothing) - test(~standard_q_and_r_bit_areas_use_bool_and_one_frame_per_allowed_run) - test(~malformed_allowlist_notation_is_rejected_and_sends_no_write_frame) - test(~w_write_with_unknown_ack_or_plc_error_never_succeeds_or_replays)' -Log $normalWriteLog
          $env:BANTO_SLMP_OPERATIONAL_WRITE_COMPONENT_WASM = Get-GuestFile $guestDir 'slmp-common-dw-component.wasm'
          $commonDwLog = Join-Path $env:RUNNER_TEMP 'wasm-slmp-common-dw-hub-test.txt'
          Invoke-ArchivedTest -Label 'common D/W SLMP Hub tests' -Expected 11 -Filter 'binary_id(banto-hub-host::t12_connection_test) & test(~slmp_wasm_operational_write_test::) - test(~new_guest_) - test(~diagnostic_guest_uses_existing_connection_and_preserves_read) - test(~saved_tags_are_diagnosed_through_the_authenticated_rest_and_broker_path) - test(~high_low_word_order_is_preserved_through_host_and_guest) - test(~typed_words_are_one_complete_frame_and_bad_items_send_nothing) - test(~standard_q_and_r_bit_areas_use_bool_and_one_frame_per_allowed_run)' -Log $commonDwLog
          $env:BANTO_SLMP_LEGACY_COMPONENT_WASM = $env:BANTO_SLMP_OPERATIONAL_WRITE_COMPONENT_WASM
          $env:BANTO_STAGE2_SLMP_WASM = $env:BANTO_SLMP_OPERATIONAL_WRITE_COMPONENT_WASM
          $env:BANTO_LOCAL_W_WASM = $env:BANTO_SLMP_OPERATIONAL_WRITE_COMPONENT_WASM
          # 数値 2 種の回帰（元は 2 回の起動）。環境変数は同じなので 1 回にまとめる。
          Invoke-ArchivedTestGroup -Label 'common D/W SLMP numeric regression' -Parts @(
            @{ Id = 'r_eight_numeric_kinds_collect_and_serve_rest'; Binary = $hubConn; Like = @('slmp_wasm_test::r_eight_numeric_kinds_collect_and_serve_rest'); Expected = 0 },
            @{ Id = 'r_w_eight_numeric_kinds_collect_and_serve_rest'; Binary = $hubConn; Like = @('slmp_wasm_test::r_w_eight_numeric_kinds_collect_and_serve_rest'); Expected = 0 }
          )
          $env:BANTO_SLMP_DIAGNOSTICS_COMPONENT_WASM = Get-GuestFile $guestDir 'slmp-diagnostics-component.wasm'
          Invoke-ArchivedTest -Label 'optional diagnostics world compatibility' -Expected 0 -Filter 'binary_id(banto-driver-wasm::diagnostics_v1)'
          $env:BANTO_SLMP_OPERATIONAL_WRITE_COMPONENT_WASM = $env:BANTO_SLMP_DIAGNOSTICS_COMPONENT_WASM
          $diagnosticLog = Join-Path $env:RUNNER_TEMP 'wasm-slmp-diagnostics-hub-test.txt'
          Invoke-ArchivedTest -Label 'diagnostic SLMP Hub tests' -Expected 16 -Filter 'binary_id(banto-hub-host::t12_connection_test) & test(~slmp_wasm_operational_write_test::) - test(~new_guest_)' -Log $diagnosticLog
          # 新しい SLMP ゲスト（#43〜#78）: component 単位の試験 9 本と Hub の受け入れ・時計同期を
          # 同じ環境変数で 1 回にまとめる。
          $env:BANTO_SLMP_NEW_COMPONENT_WASM = Get-GuestFile $guestDir 'slmp-44-component.wasm'
          $env:BANTO_SLMP_OPERATIONAL_WRITE_COMPONENT_WASM = $env:BANTO_SLMP_NEW_COMPONENT_WASM
          $env:BANTO_SLMP_DIAGNOSTICS_COMPONENT_WASM = $env:BANTO_SLMP_NEW_COMPONENT_WASM
          # Component-level word-bit RMW: a confirm-read mismatch is
          # verification-failed for that item only (#906).
          # Component-level E4 (UDP over a loopback peer, 4E and 3E) and C1
          # (D/W string bytes and the one-1401 write) for the same guest.
          # Component-level G1 (U\G reads on Q and R, byte-exact frames, one
          # request per tag, per-item Unsupported, end codes, no writes).
          # Component-level G2a (QnPH, QnUDPV, MELSEC-L, Q12PRH recognized by the
          # exact 0101 pair; mismatched pairs stay Unknown).
          # Component-level G2b (iQ-R process, SIL2 process, safety CPU and MX-R
          # recognized by the exact 0101 pair; S only on the process CPU).
          # Component-level G2c (FX5 recognized by code table plus FX5 name on
          # 3E own station; R<n> read-only and FX5 only; X/Y/ZR/U\G per-item
          # Unsupported; 4E or another station is Unknown; D/M writes only).
          # Component-level G3 (labels read by one 041C byte for byte incl. a
          # UTF-16 non-ASCII name, per-item type mismatch, 041C check + 141B
          # write, Hub label gate sends nothing, standard Q sends no label).
          # Component-level H (clock-v1 on iQ-R over 4E and 3E: the four exact
          # requests, SM210/SM211 outcomes, end code, guest gate, standard Q
          # and the read-only loader send nothing, a short response is fatal).
          # Component-level H3 (clock-read-v1 on iQ-R and standard Q over 4E
          # and 3E: the two exact requests, BIN and BCD, SM213 OFF / SM210 ON
          # rejected, verification-failed, end codes, Q25PRH and FX5 send
          # nothing, a short response is fatal, the read-only loader offers
          # the read but not the clock set).
          # H2 (Hub clock sync, #1053): the scheduler, manual REST, the two
          # gates, each result's audit and the timeout without a resend,
          # through the operational loader and a loopback SLMP peer.
          # H3 (Hub clock read): GET /clock on R and Q, the 5 s reuse, SM213
          # OFF, the read-only loader and the reads before/after a clock sync
          # in its audit (5 more tests in the same module).
          Invoke-ArchivedTestGroup -Label 'new SLMP guest component and Hub tests' -Parts @(
            @{ Id = 'SLMP word-bit component test'; Binary = 'banto-driver-wasm::slmp_word_bit_write'; Expected = 1 },
            @{ Id = 'SLMP UDP/string component tests'; Binary = 'banto-driver-wasm::slmp_udp_strings'; Expected = 4 },
            @{ Id = 'SLMP U\G component tests'; Binary = 'banto-driver-wasm::slmp_unit_buffer'; Expected = 6 },
            @{ Id = 'SLMP G2a component tests'; Binary = 'banto-driver-wasm::slmp_g2a_models'; Expected = 5 },
            @{ Id = 'SLMP G2b component tests'; Binary = 'banto-driver-wasm::slmp_g2b_models'; Expected = 4 },
            @{ Id = 'SLMP G2c component tests'; Binary = 'banto-driver-wasm::slmp_g2c_models'; Expected = 7 },
            @{ Id = 'SLMP G3 component tests'; Binary = 'banto-driver-wasm::slmp_g3_labels'; Expected = 6 },
            @{ Id = 'SLMP H component tests'; Binary = 'banto-driver-wasm::slmp_h_clock'; Expected = 6 },
            @{ Id = 'SLMP H3 component tests'; Binary = 'banto-driver-wasm::slmp_h3_clock_read'; Expected = 8 },
            @{ Id = 'new SLMP Hub acceptance tests'; Binary = $hubConn; Like = @('slmp_wasm_operational_write_test::'); Expected = 57 },
            @{ Id = 'H2 clock sync Hub acceptance tests'; Binary = $hubConn; Like = @('slmp_wasm_clock_test::'); Expected = 11 }
          )
          # Stage-2 numeric reads use the separately reviewed guest revision.
          # Keep the older guest revisions above for read and write regressions.
          $env:BANTO_STAGE2_MODBUS_MANIFEST = Get-GuestFile $manifestDir 'numeric-modbus-manifest.json'
          $env:BANTO_STAGE2_MODBUS_WASM = Get-GuestFile $guestDir 'numeric-modbus-component.wasm'
          $env:BANTO_STAGE2_SLMP_WASM = Get-GuestFile $guestDir 'numeric-slmp-component.wasm'
          Invoke-ArchivedTestGroup -Label 'WASM numeric stage-2 host and Hub tests' -Parts @(
            @{ Id = 'WASM numeric stage-2 host tests'; Binary = 'banto-driver-wasm::numeric_stage2'; Not = @('local_fc4_eight_kinds_use_input_registers_without_write_capability', 'local_r_w_eight_kinds_use_hex_addresses_without_write_capability'); Expected = 6 },
            @{ Id = 'WASM numeric stage-2 Hub tests'; Binary = $hubConn; Like = @('eight_numeric_kinds_collect_and_serve_rest'); Not = @('wasm_fc4_eight_numeric_kinds_collect_and_serve_rest', 'slmp_wasm_test::r_w_eight_numeric_kinds_collect_and_serve_rest'); Expected = 2 }
          )
          # FC4 and SLMP W use a separately reviewed read-only guest revision.
          # Keep the stage-2 and write revisions above pinned for regressions.
          $env:BANTO_LOCAL_FC4_MANIFEST = Get-GuestFile $manifestDir 'fc4-modbus-manifest.json'
          $env:BANTO_LOCAL_FC4_WASM = Get-GuestFile $guestDir 'fc4-modbus-component.wasm'
          $env:BANTO_LOCAL_W_WASM = Get-GuestFile $guestDir 'slmp-w-component.wasm'
          Invoke-ArchivedTestGroup -Label 'FC4/W host and Hub tests' -Parts @(
            @{ Id = 'FC4/W host tests'; Binary = 'banto-driver-wasm::numeric_stage2'; Like = @('local_'); Expected = 2 },
            @{ Id = 'FC4/W Hub tests'; Binary = $hubConn; Like = @('eight_numeric_kinds_collect_and_serve_rest'); Not = @('wasm_fc3_eight_numeric_kinds_collect_and_serve_rest', 'slmp_wasm_test::r_eight_numeric_kinds_collect_and_serve_rest'); Expected = 2 }
          )
          # Modbus FC1/2/3/4 and gated FC5/6/15/16/22 join uses the exact reviewed
          # guest package manifest and the optional write world.
          # #695: WASM の接続はシミュレーションのとき実ホストへ一度も接続・送信しない
          # （t12_wasm_all_simulation。同じ Modbus component を使う）。同じ環境変数なので 1 回にまとめる。
          $env:BANTO_MODBUS_MANIFEST = Get-GuestFile $manifestDir 'modbus-join-manifest.json'
          $env:BANTO_MODBUS_COMPONENT_WASM = Get-GuestFile $guestDir 'modbus-join-component.wasm'
          Invoke-ArchivedTestGroup -Label 'Modbus join adapter, Hub join and all-simulation tests' -Parts @(
            @{ Id = 'Modbus join adapter tests'; Binary = 'banto-driver-wasm::modbus_join'; Expected = 11 },
            @{ Id = 'Modbus Hub join tests'; Binary = $hubConn; Like = @('modbus_wasm_join_test::'); Expected = 10 },
            @{ Id = 'WASM all-simulation Hub tests'; Binary = $hubConn; Like = @('wasm_all_simulation_test::'); Expected = 4 }
          )

  # #ci-speed（2026-10-19）: `rust-test-build` のアーカイブを 3 台にシャーディングして
  # 走らせる。ビルドはしない（Rust ツールチェーンも rust-cache も使わない）。
  # - `--partition count:N/3` はテストを 1 件ずつ順に各シャードへ配る。`hash:` と違い
  #   件数が均等に近く、バイナリ単位の分け方と違い重い統合テストの偏りが出にくい
  #   （3735 テスト / 78 バイナリ）。
  # - test-groups（.config/nextest.toml の hub-default-mutex・heavy-runtime の直列化）は
  #   シャードの中でだけ効く。シャードは別のランナー（別のマシン）なので、
  #   シャードをまたいでぶつかる共有物（名前付き mutex・固定ポート）はそもそも無い。
  rust-test:
    name: Rust test (nextest ${{ matrix.shard }}/3)
    needs: [changes, rust-test-build]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # checkout は `--workspace-remap`（ワークスペースの場所）のために要る。
      - uses: actions/checkout@v7
      # テストは cargo-nextest（テスト 1 件 = 1 プロセスで、バイナリをまたいで並列に
      # 走る）。同時に走るとぶつかるテストは .config/nextest.toml の test-groups で
      # 直列にしてある（理由もそこ）。ローカルでも `cargo nextest run` が使える。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
      # `cargo nextest` ではなく `cargo-nextest nextest` と直接呼ぶ: リポジトリに
      # rust-toolchain.toml があり、cargo を経由すると toolchain のダウンロードが走りうる
      # （アーカイブの実行に Rust は要らない）。
      # アーカイブは一時ディレクトリでなくワークスペース直下（`--extract-to .`）へ
      # 展開する。chronogazer_server.rs などが `env!("CARGO_BIN_EXE_<bin>")`（コンパイル時
      # の絶対パス。例 D:\a\banto-industrial\banto-industrial\target\debug\xxx.exe）で
      # バイナリを起動するので、展開先の `target/` がビルドした台と同じ絶対パスに
      # 無いと壊れる。GitHub のランナーは checkout 先が同じパスなので、ワークスペース
      # 直下へ展開すれば一致する。`--extract-overwrite` は展開先に既存ファイルが
      # あっても失敗させないため。
      - name: test (nextest)
        run: cargo-nextest nextest run --archive-file nextest-archive.tar.zst --workspace-remap . --extract-to . --extract-overwrite --profile ci --partition count:${{ matrix.shard }}/3
      # テストごとの所要時間（遅いテスト探し用）。失敗しても残す。
      - name: Upload nextest junit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # 外部 DB 連携 S2（docs/hub/banto-hub-external-db-design.md §7「S2 / S5 の統合
  # テストは CI で PostgreSQL のサービスコンテナを使う」）。上の `rust` ジョブ
  # は windows-latest で、GitHub Actions のサービスコンテナは Linux ランナー
  # でしか使えないため、DB Source（S2）と DB Sink サイドカー（S5、
  # `apps/banto-hub-sink`）の実 PostgreSQL テストを ubuntu-latest の別ジョブへ
  # 切り出す。`BANTO_TEST_PG_URL` が無いときは各テストが
  # `eprintln!("skipped: ...")` で素通りするので、このジョブが無くても
  # `rust` ジョブは緑のまま（ゲートの意味は
  # apps/banto-hub/core/tests/db_source.rs のモジュール doc 参照）。
  #
  # #468: banto-hub・banto-hub-sink・Cargo の共通設定を変えたとき、共有 crate の変更が
  # banto-hub-core か banto-hub-sink に届くとき（ci-changes.mjs の JOB_PACKAGES）、
  # とフル CI のときだけ走る。
  #
  # nextest にしない理由: 3 ステップとも実 PostgreSQL 1 つを共有し、小さいので並列化の
  # 利得が薄い一方、プロセスが別になると DB 上の状態の取り合いが増える。
  #
  # apt でのシステムパッケージ導入は不要: banto-hub-core は Tauri/WebKitGTK に
  # 依存しない（`e2e-hub` ジョブが同じ ubuntu-latest で
  # `cargo build -p banto-hub-host --bin banto-hub`（core を含む）を素で通しているのが実証）。
  #
  # 2026-11-23: banto-hub-host の統合試験 mcp の 1 件（実 PostgreSQL の接続テスト）と、
  # banto-hub-core の rest の同名の 1 件も、ここで走らせる。ci-changes.mjs の
  # JOB_PACKAGES には host を足さない（足すとほぼ全部の共有 crate の変更でこのジョブが走る。
  # host の試験ファイルは apps/banto-hub/** なので、今の規則でもこのジョブは走る）。
  rust-db-source:
    name: Rust (db-source / PostgreSQL)
    needs: changes
    if: needs.changes.outputs.run_rust_db_source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BANTO_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # 統合テスト（実 PostgreSQL に対する正常/NULL/未対応型/0行/クエリ
      # エラー/接続断/構成変更/状態API/書き込み拒否）。
      - name: test (db_source integration)
        run: cargo test -p banto-hub-core --test db_source
      # `db_source` モジュール自身のユニットテスト（S1a の接続テストを
      # 含む - こちらも BANTO_TEST_PG_URL があるときだけ実 DB を触る）。
      - name: test (db_source unit)
        run: cargo test -p banto-hub-core --lib db_source
      # `BANTO_TEST_PG_URL` が無いと skip する試験で、これまで CI のどこでも実 DB で走って
      # いなかった（2026-11-23 に足した）。`--exact` は 0 件一致でも緑になるので、1 件走った
      # ことと skip の分岐を通っていないことを出力で確かめる。
      - name: test (rest postgres_connections, real PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p banto-hub-core --lib -- --exact rest::tests::postgres_connections::test_saved_connection_against_a_real_postgresql_returns_the_server_version --nocapture 2>&1 | tee "$RUNNER_TEMP/pg-one.log"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/pg-one.log" || { echo "::error::the test did not run exactly once (renamed?)"; exit 1; }
          if grep -q 'skipped: BANTO_TEST_PG_URL unset' "$RUNNER_TEMP/pg-one.log"; then echo "::error::the test skipped (BANTO_TEST_PG_URL unset)"; exit 1; fi
      # 同じ試験の host 版。`banto-hub-host` の統合試験 mcp をこのジョブでビルドする
      # （e2e-hub が同じ ubuntu で `cargo build -p banto-hub-host --bin banto-hub` を通して
      # いるので apt は要らない）。上と同じく、これまで CI のどこでも実 DB で走っていなかった。
      - name: test (host mcp test_saved_connection, real PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          cargo test -p banto-hub-host --test mcp -- --exact test_saved_connection_against_a_real_postgresql_returns_the_server_version --nocapture 2>&1 | tee "$RUNNER_TEMP/pg-one.log"
          grep -q 'test result: ok. 1 passed' "$RUNNER_TEMP/pg-one.log" || { echo "::error::the test did not run exactly once (renamed?)"; exit 1; }
          if grep -q 'skipped: BANTO_TEST_PG_URL unset' "$RUNNER_TEMP/pg-one.log"; then echo "::error::the test skipped (BANTO_TEST_PG_URL unset)"; exit 1; fi
      # R2a-3a: db_source と DB ブリッジ（R2a-3b）が共有する crate（列→f64 の変換・
      # 列の解決・品質の梯子・接続オプション）。単体テストは PostgreSQL なしで走る
      # が、この crate を触ったときに確実にこのジョブも走るよう（ci-changes.mjs の
      # JOB_PACKAGES）、ここで明示的に流す。
      - name: test (banto-db-source)
        run: cargo test -p banto-db-source
      # 外部 DB 連携 S5（サイドカー `banto-hub-sink`）: 単体テストと、
      # プロセス内の Hub + 実 PostgreSQL に対する統合テスト
      # （tests/sidecar.rs - interval/on_change・テーブル消失からの復帰・
      # 停止時の最終 status push）。banto-hub-core を dev-dependency として
      # ビルドするので、上の2ステップとキャッシュを共有できるこの位置に置く。
      # R2a-3b: DB ブリッジの統合テスト（tests/bridge.rs - 値が Hub に届く・収集の停止と
      # 開始・WS の切断と再接続・DB の停止・スコープの無い接続）も同じ
      # `cargo test -p banto-hub-sink` で走る。
      # R2a-3c（R2a の完了条件）: Hub 内の Source との突き合わせ（tests/bridge_parity.rs -
      # §10.4 の 11 場面 1〜9・7b・7c。9 は 60 秒の上限ちょうどの 3 クエリ）も同じ。
      # 9 は #948 で下の段に分けた（上の段から外し、ここで 1 本だけ走らせる）。
      - name: test (banto-hub-sink)
        run: cargo test -p banto-hub-sink -- --skip parity_9_three_queries_at_the_registration_limit
      # #948: parity_9（上限ちょうどの負荷を 60 秒）は CPU を奪われると周期に間に合わず
      # `superseded_cycles` が出る（製品どおり）。ほかの場面と同じプロセスで並ばないよう、
      # 上の段で外して、ここで 1 本だけ走らせる。
      - name: test (banto-hub-sink parity_9 alone)
        run: cargo test -p banto-hub-sink --test bridge_parity -- --exact parity_9_three_queries_at_the_registration_limit
      # #1019: 試験用コマンドの入口（main.rs）も dev-dependency を混ぜずにビルドする。
      - name: build (banto-hub-sink D-5 trace)
        run: cargo build -p banto-hub-sink --locked --features d5-trace
      - name: test (banto-hub-sink D-5 trace)
        run: cargo test -p banto-hub-sink --locked --features d5-trace --lib -- d5_trace begin_insert_and_commit_timeouts_keep_rows_for_retry
      # 配布物と同じく sink を単体で（dev-dependency の feature を混ぜずに）確かめる。
      # `cargo test` は dev 側（banto-hub-core など）の sqlx の feature と合わさって
      # 通ってしまい、#764 から `cargo build --release -p banto-hub-sink` が
      # `Executor::describe` の未定義で落ちるのを見逃していた（alpha.35 のリリースビルドで発覚）。
      - name: check (banto-hub-sink 単体)
        run: cargo check -p banto-hub-sink

  # #392 B3-3b の監査 Nit 1: メインの Rust ジョブは windows-latest なので、Windows 以外
  # だけで出る `dead_code` など（例: `banto-hub-core` の `resolve_service_acl_target`、
  # `chronogazer-elev` の Windows 専用の再公開の cfg 漏れ）を CI で捕まえられない。昇格
  # まわりの 2 crate の lib を ubuntu で clippy する軽いジョブ。Rust の対象（`rust_args`）に
  # この 2 つのどちらかが入るとき（workspace 全体を含む）だけ走る（`run_linux_clippy`。
  # 判定は ci-changes.mjs の JOB_PACKAGES）。#623 PR-2 から、`banto-instance-lock` が
  # 対象に入るときはその clippy・テストもここで走らせる（下の段）。`banto-safe-root`
  # （#623 PR-1b のレビュー S-2）も同じ。
  linux-clippy:
    name: Rust (linux clippy / 昇格まわり)
    needs: changes
    if: needs.changes.outputs.run_linux_clippy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy (chronogazer-elev / banto-hub-core の lib)
        run: cargo clippy -p chronogazer-elev -p banto-hub-core --lib -- -D warnings
      # R1-7a（docs/hub/driver/banto-driver-api-design.md §2.4）: banto-hub の bin（`banto-hub`・
      # `banto-hub-elev`）は `banto-hub-host` へ移った。bin は lib を持たないので `--lib`
      # とは別の段にする。Windows 専用の `win_service` は `cfg(windows)` で外れ、非 Windows の
      # 分岐（`banto-hub-elev` の案内だけの `main` など）とマニフェストのテストを見る。
      - name: clippy (banto-hub-host の bin)
        run: cargo clippy -p banto-hub-host --all-targets -- -D warnings
      # #623 PR-2 のレビュー P2-1: `banto-instance-lock` は非 Windows に別の実装
      # （flock・`O_NOFOLLOW` の診断ファイル）とテストの分岐を持つが、メインの Rust
      # ジョブは windows-latest なので、ここで走らせないと一度もコンパイル・実行されない。
      # Rust の対象（`rust_args`）にこの crate が入るとき（workspace 全体を含む）だけ。
      - name: clippy + test (banto-instance-lock、非 Windows の実装)
        if: needs.changes.outputs.rust_args == '--workspace' || contains(format(' {0} ', needs.changes.outputs.rust_args), ' -p banto-instance-lock ')
        run: |
          cargo clippy -p banto-instance-lock --all-targets -- -D warnings
          cargo test -p banto-instance-lock
      # #623 PR-1b のレビュー S-2: `banto-safe-root` にも非 Windows の分岐（`Mode::Plain`、
      # `guarded_is_unsupported_off_windows`、`nofollow` の `non_windows_is_unsupported`）が
      # あるが、依存としてコンパイルされるだけで `-D warnings` もテストも走っていなかった。
      # dev-dependency の `banto-service-elev` は Windows 専用の依存を `cfg(windows)` に
      # 閉じていて、Linux でもビルドできる（上の `chronogazer-elev` の clippy が既に通している）。
      - name: clippy + test (banto-safe-root、非 Windows の実装)
        if: needs.changes.outputs.rust_args == '--workspace' || contains(format(' {0} ', needs.changes.outputs.rust_args), ' -p banto-safe-root ')
        run: |
          cargo clippy -p banto-safe-root --all-targets -- -D warnings
          cargo test -p banto-safe-root

  # R1-1 / R1-2（docs/hub/driver/banto-driver-api-design.md §2.2・§9.1）: crates.io へ公開する
  # `banto-driver-api`・`banto-driver-engine`・`banto-driver-conformance`（API の適合テスト一式。API に
  # path + version で依存）の互換性を守る軽いジョブ（ubuntu）。いずれかが Rust の対象に
  # 入るとき（= いずれか自身の変更か、workspace 全体のとき。API の変更は逆依存の
  # conformance も対象に入れる）だけ走る（`run_driver_api`。判定は ci-changes.mjs の
  # JOB_PACKAGES）。
  # - MSRV: `Cargo.toml` の `rust-version`（1.85、3 つとも同じ）で check する。リポジトリの
  #   rust-toolchain.toml（1.98.1）が `rustup default` より優先されるので、
  #   `RUSTUP_TOOLCHAIN` で上書きする。`rust-version` を上げるときは、この版と
  #   `dtolnay/rust-toolchain@<版>` も同じ PR で上げる（minor を上げ CHANGELOG に書く）。
  # - `--all-features`（API の feature `serde`）の clippy / test: workspace の中にこの
  #   feature を有効にする crate は無いので、rust / rust-test ジョブでは一度もコンパイル
  #   されない。
  # - cargo-semver-checks: crate ごとに、基準は `<crate 名>-v*` の最も新しいタグ
  #   （各 crate の CHANGELOG.md の「タグの名前」。`banto-driver-api-v*` /
  #   `banto-driver-conformance-v*`）。その crate の最初のタグができるまでは飛ばす。
  #   minor を上げる PR（破壊を意図する）では `check-release` が破壊を報告しないことを
  #   確かめる（0.x の minor は破壊を許す）。
  driver-api:
    name: Rust (banto-driver-api・engine・conformance / MSRV・features・semver)
    needs: changes
    if: needs.changes.outputs.run_driver_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # semver-checks の基準（タグとその履歴）を読むため全履歴・全タグを取る。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: MSRV check (Rust 1.85)
        env:
          RUSTUP_TOOLCHAIN: '1.85'
        run: |
          cargo --version
          cargo check -p banto-driver-api -p banto-driver-engine -p banto-driver-conformance
          cargo check -p banto-driver-api -p banto-driver-engine -p banto-driver-conformance --all-features
      # ここからはリポジトリのピン（rust-toolchain.toml）で回す。
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal --no-self-update
          cargo --version
      - name: clippy + test (--all-features)
        run: |
          cargo clippy -p banto-driver-api -p banto-driver-engine -p banto-driver-conformance --all-targets --all-features -- -D warnings
          cargo test -p banto-driver-api -p banto-driver-engine -p banto-driver-conformance --all-features
      - name: cargo-semver-checks
        run: |
          set -euo pipefail
          installed=false
          for pkg in banto-driver-api banto-driver-engine banto-driver-conformance; do
            base=$(git tag --list "${pkg}-v*" --sort=-v:refname | head -n 1)
            if [ -z "$base" ]; then
              echo "::notice::${pkg}-v* のタグがまだ無いので ${pkg} の cargo-semver-checks を飛ばす（最初の公開まで）"
              continue
            fi
            echo "${pkg} baseline: $base"
            if [ "$installed" = false ]; then
              cargo install cargo-semver-checks --locked
              installed=true
            fi
            cargo semver-checks check-release -p "$pkg" --baseline-rev "$base"
          done

  # #468: 旧 `e2e` ジョブ（chronogazer と banto-hub を 1 ジョブで）を 2 つに
  # 分けた。hub だけの変更で chronogazer の build / Playwright を走らせない。
  # ジョブ ID が変わったので Swatinem/rust-cache のキーも e2e-chronogazer /
  # e2e-hub に分かれる（main の最初の push で作られる。互いのビルドで上書き
  # し合わない）。
  e2e-chronogazer:
    name: E2E chronogazer (Playwright smoke)
    needs: changes
    if: needs.changes.outputs.run_e2e_chronogazer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The static SvelteKit output the `--features embed-ui` binary below
      # embeds (apps/chronogazer/core/src/assets.rs).
      - name: Build frontend (chronogazer)
        run: pnpm --filter chronogazer build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # e2e/playwright.config.ts's webServer launches this binary directly
      # (not `cargo run`) - it must already exist before `pnpm e2e` below.
      - name: Build banto-serve (embed-ui)
        run: cargo build -p chronogazer-core --bin banto-serve --features embed-ui

      # R1-C C-4: e2e/playwright.config.ts's second webServer is the dev PLC
      # (apps/chronogazer/core/examples/dev_plc.rs, a Modbus TCP simulator)
      # that user-simulator-roundtrip.spec.ts collects from. Prebuilt for the
      # same reason as banto-serve above.
      - name: Build dev PLC example
        run: cargo build -p chronogazer-core --example dev_plc

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke suite (chronogazer)
        run: pnpm e2e

      # #507: 閲覧公開（grant publicViewer）の E2E。banto-serve は
      # BANTO_VIEWER_PUBLIC を起動時にしか読まないので、別の config（ポート 8804、
      # 閲覧公開 ON の 2 台目の banto-serve）。同じ banto-serve バイナリを使う。
      - name: Run E2E public-viewer suite (chronogazer)
        run: pnpm e2e:public-viewer

      # #392 B2-2: サービス接続モード（grant localDesktop）の E2E。banto-serve は
      # localDesktop を常に閉じるので、本番の headless host chronogazer-server を
      # スペックが子プロセスとして起動・再起動・停止する（ポート 8807。テスト用の
      # ポートの注入と --control-stdin はデバッグビルドだけ）。UI は上の
      # frontend のビルドを embed-ui で埋め込む。
      - name: Build chronogazer-server (embed-ui)
        run: cargo build -p chronogazer-core --bin chronogazer-server --features embed-ui

      - name: Run E2E service-connection suite (chronogazer)
        run: pnpm e2e:server

      - name: Upload Playwright report (chronogazer)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/playwright-report-public-viewer/
            e2e/playwright-report-chronogazer-server/
          retention-days: 7

  # T18-1 (docs/hub/banto-hub-desktop-plan.md §16.3): apps/banto-hub has its own
  # Playwright config (e2e/banto-hub.playwright.config.ts,
  # `pnpm e2e:banto-hub`) covering first-run setup/login/logout and the
  # TAG-P0-1 continuous-registration DOM behavior.
  e2e-hub:
    name: E2E banto-hub (Playwright)
    needs: changes
    if: needs.changes.outputs.run_e2e_hub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The static SvelteKit output the `--features embed-ui` binary below
      # embeds (apps/banto-hub/core/src/assets.rs).
      - name: Build frontend (banto-hub)
        run: pnpm --filter banto-hub build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # e2e/banto-hub.playwright.config.ts's webServer launches this binary
      # directly - must exist before `pnpm e2e:banto-hub` below. banto-hub
      # itself is Windows-service-oriented (§8「常駐」) but the console-mode
      # binary this config runs is cross-platform (the Windows-only SCM code
      # is `#[cfg(windows)]`-gated - see apps/banto-hub/host/src/bin/banto-hub.rs's
      # doc comment), so it builds and runs fine here on ubuntu-latest.
      - name: Build banto-hub (embed-ui)
        run: cargo build -p banto-hub-host --bin banto-hub --features embed-ui

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite (banto-hub)
        run: pnpm e2e:banto-hub

      - name: Upload Playwright report (banto-hub)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-banto-hub
          path: e2e/playwright-report-banto-hub/
          retention-days: 7

  # ブラウザで触れるデモ（GitHub Pages）の組み立てと E2E（docs/demo-pages-design.md §3.6）。
  # 模擬の経路を変えた PR で、組み立て（`pnpm demo:build`）が通り、fallback の無い静的な
  # 配信の上で直に開く・読み直す・送信 0 件が保てていることを確かめる。配信はしない
  # （配信は deploy-demo.yml を手で）。Rust は使わない。
  e2e-demo-pages:
    name: E2E demo-pages (Playwright)
    needs: changes
    if: needs.changes.outputs.run_e2e_demo_pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck demo-backend
        run: pnpm --filter @banto-industrial/demo-backend check

      - name: Unit tests demo-backend
        run: pnpm --filter @banto-industrial/demo-backend test

      - name: Build demo pages
        run: pnpm demo:build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite (demo-pages)
        run: pnpm e2e:demo-pages

      - name: Upload Playwright report (demo-pages)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-demo-pages
          path: e2e/playwright-report-demo-pages/
          retention-days: 7

  # Required Check 用の最終ゲート（#468）。必ず走り、
  # - changes が success でなければ fail（判定できていない = 何も保証できない）
  # - どのジョブでも failure / cancelled があれば fail
  # - changes が「走らせる」と判定したのに skipped なら fail
  # - 条件で skipped になったものは成功扱い
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - changes
      - lint-format
      - frontend-hub
      - frontend-chronogazer
      - rust
      - rust-test-build
      - rust-doctest
      - rust-wasm
      - rust-test
      - rust-db-source
      - linux-clippy
      - driver-api
      - e2e-chronogazer
      - e2e-hub
      - e2e-demo-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          if [ "$changes" != "success" ]; then
            echo "::error::changes が $changes（判定できていないので通さない）"
            exit 1
          fi

          fail=0
          # どのジョブでも failure / cancelled は fail。
          while IFS=$'\t' read -r job result; do
            case "$result" in
              failure|cancelled)
                echo "::error::$job が $result"
                fail=1
                ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<<"$NEEDS")

          # 走るべきジョブが skipped になっていないか（changes の判定と突き合わせる）。
          check() {
            local job=$1 key=$2 result want
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            want=$(jq -r --arg k "$key" '.changes.outputs[$k]' <<<"$NEEDS")
            if [ "$want" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::$job は実行が必要（$key=true）なのに $result"
              fail=1
            fi
          }
          check lint-format run_lint_format
          check frontend-hub run_frontend_hub
          check frontend-chronogazer run_frontend_chronogazer
          check rust run_rust
          check rust-test-build run_rust
          check rust-doctest run_rust
          check rust-wasm run_wasm
          check rust-test run_rust
          check rust-db-source run_rust_db_source
          check linux-clippy run_linux_clippy
          check driver-api run_driver_api
          check e2e-chronogazer run_e2e_chronogazer
          check e2e-hub run_e2e_hub
          check e2e-demo-pages run_e2e_demo_pages

          exit "$fail"
