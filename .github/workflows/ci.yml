# CI（#468 で「変更したパスに応じて選んで実行する」構成に分けた）。
#
# 構成:
#   changes ──┬─ lint-format            （必ず。repo 全体の ESLint + Prettier）
#             ├─ frontend-hub           （条件付き）
#             ├─ frontend-chronogazer   （条件付き）
#             ├─ rust                   （条件付き。fmt / clippy。対象は workspace 全体か -p に絞る）
#             ├─ rust-test-build        （条件付き。テストを 1 回だけビルドして nextest archive にし、doctest も回す。対象は rust と同じ）
#             │    └─ rust-test         （rust-test-build の後。アーカイブを 3 台にシャーディングして実行）
#             ├─ rust-db-source         （条件付き。PostgreSQL）
#             ├─ linux-clippy           （条件付き。昇格まわりの 2 crate を ubuntu で）
#             ├─ driver-api             （条件付き。公開する banto-driver-api・conformance の MSRV・features・semver）
#             ├─ e2e-chronogazer        （条件付き）
#             └─ e2e-hub                （条件付き）
#   ci-gate（必ず。if: always()）: 上の全ジョブを見て、failure / cancelled、または
#   「走るべきなのに skipped」があれば fail。条件で skipped になったものは成功扱い。
#   **ブランチ保護の Required Check は `ci-gate` 1 つに集約する**（ジョブを増減しても
#   保護の設定を触らずに済む）。
#
# 判定は `.github/scripts/ci-changes.mjs`（純関数 + 判定表テスト
# `ci-changes.test.mjs`。ローカルでは `node --test .github/scripts/ci-changes.test.mjs`）。
# - push（main）と PR 以外の起動はフル CI（安全側）。
# - `.github/**`・`scripts/**`・どの規則にも当たらないパスはフル CI。
# - `crates/<name>/**` は、そのパッケージと、それに（推移的に）依存する workspace の
#   パッケージだけを `-p` で clippy / test する（依存グラフは changes ジョブで
#   `cargo metadata --no-deps --offline` から組む。normal・dev・build の path 依存）。
#   E2E・PostgreSQL・linux-clippy は、届いたパッケージがそのジョブの build する
#   パッケージ（ci-changes.mjs の JOB_PACKAGES）に当たるときだけ。グラフが読めない・
#   どのパッケージにも属さない `crates/` のパス・workspace の 8 割以上に届くときは
#   全体に倒す。
#   依存グラフに出ない結び付きのうち、`include_str!` / `include_bytes!` の走査は
#   リテラルのパスだけを見る（`concat!(env!("CARGO_MANIFEST_DIR"), ..)` や実行時の
#   `fs::read` は見ない）。そういう読み方を足すときは RUST_PACKAGES に手で足す。
# - root の Cargo.toml / Cargo.lock・toolchain・proto・.cargo・.config は Rust workspace
#   全体 + 両アプリの E2E。root の package.json / pnpm-lock.yaml / lint・format・TS
#   設定は全 frontend + 両 E2E。
#
# テストは cargo-nextest（`--profile ci`、設定は `.config/nextest.toml`）で走らせる
# （#ci-speed、2026-10-19。それまでは rust ジョブ 1 本で fmt / clippy / nextest /
# doctest を直列に回し、CI 全体 17〜25 分の大半がここだった）。rust-test-build が
# テストバイナリを 1 回だけビルドして nextest archive（artifact `nextest-archive`、
# 保持 1 日）にし、rust-test が 3 台のシャードでそれを展開して走らせる（ビルドしない。
# 目的は Windows ランナーの使用時間の削減で、待ち時間は縮まらない）。doctest は nextest
# で走らないので、rust-test-build が archive 作成後に `cargo test --doc` を回す
# （archive ビルドでコンパイル済みの lib を再利用でき、rust ジョブで test プロファイルを
# もう 1 回フルビルドするより速い。rust ジョブの所要時間が最長だった）。rust・
# rust-test-build はどちらも `run_rust` と `rust_args`（ci-changes.mjs の出力）を使う。
# デバッグ情報は `CARGO_PROFILE_DEV_DEBUG=line-tables-only` で軽くしている。
# `--timings` は rust ジョブの clippy と rust-test-build の archive ビルドに付け、crate
# ごとのビルド時間の HTML を artifact（`cargo-timings-clippy`・`cargo-timings-test`、
# 14 日）に残す。遅いテストは nextest の junit.xml（artifact
# `nextest-junit-<シャード番号>`）と SLOW 表示で見る。
#
# 将来 `apps/banto-scada` を足すとき:
#   1. ci-changes.mjs の RULES に `^apps/banto-scada/` → `scada`（E2E を足すなら
#      `e2e/tests-banto-scada/` 等 → `e2e_scada`）を足し、AREAS・derive()
#      （`run_frontend_scada` / `run_e2e_scada`）・RUST_PACKAGES.scada・
#      JOB_PACKAGES.run_e2e_scada を足す（`crates/scada-*` は依存グラフで拾われる）。
#   2. ci-changes.test.mjs に「scada だけの変更」の行を足す。
#   3. 下の `changes.outputs` に新しい出力を足す。
#   4. frontend-hub / e2e-hub を写して frontend-scada / e2e-scada ジョブを足す
#      （`if:` は新しい出力を見る。Swatinem/rust-cache のキーはジョブ ID ごとに
#      分かれるので、ジョブ ID を既存と重ねない）。
#   5. ci-gate の `needs` と、ステップ内の `check` 行に新しいジョブを足す。
#   Required Check は ci-gate のままなので、保護の設定は変えなくてよい。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# #ci-speed（2026-10-19）: 取り消すのは PR の古い実行だけ。main の実行は最後まで走らせる。
# main を取り消すとジョブ末尾の rust-cache 保存に届かず、main のキャッシュが
# 作り直されないまま全 PR がキャッシュ無しでビルドする（run 39319407775 で実際に起きた）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes (変更パス判定)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      docs: ${{ steps.classify.outputs.docs }}
      rust_all: ${{ steps.classify.outputs.rust_all }}
      crates: ${{ steps.classify.outputs.crates }}
      frontend_all: ${{ steps.classify.outputs.frontend_all }}
      hub: ${{ steps.classify.outputs.hub }}
      chronogazer: ${{ steps.classify.outputs.chronogazer }}
      hub_sink: ${{ steps.classify.outputs.hub_sink }}
      e2e_hub: ${{ steps.classify.outputs.e2e_hub }}
      e2e_chronogazer: ${{ steps.classify.outputs.e2e_chronogazer }}
      run_lint_format: ${{ steps.classify.outputs.run_lint_format }}
      run_frontend_hub: ${{ steps.classify.outputs.run_frontend_hub }}
      run_frontend_chronogazer: ${{ steps.classify.outputs.run_frontend_chronogazer }}
      run_rust: ${{ steps.classify.outputs.run_rust }}
      rust_args: ${{ steps.classify.outputs.rust_args }}
      run_driver_api: ${{ steps.classify.outputs.run_driver_api }}
      run_rust_db_source: ${{ steps.classify.outputs.run_rust_db_source }}
      run_linux_clippy: ${{ steps.classify.outputs.run_linux_clippy }}
      run_e2e_hub: ${{ steps.classify.outputs.run_e2e_hub }}
      run_e2e_chronogazer: ${{ steps.classify.outputs.run_e2e_chronogazer }}
    steps:
      # pull_request では checkout は PR のマージコミット（refs/pull/N/merge）。
      # fetch-depth: 2 でその 2 つの親（1 本目 = ベースの先端、2 本目 = PR の先端）
      # まで取れるので、shallow clone のままでも「1 本目の親 → マージコミット」の
      # 差分 = この PR がベースに持ち込む変更（CI が実際に検証する内容）を正しく
      # 取れる。merge-base を探す `base...head` の三点差分は shallow では
      # 失敗・誤判定しうるので使わない。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 共有 crate の依存グラフ（`cargo metadata --no-deps --offline`、ネットワーク不要）と
      # 判定表のテスト（実グラフで逆依存を確かめる）に cargo が要る。版はリポジトリの
      # rust-toolchain.toml に従う（rustup 1.28 以降の引数なしの `rustup toolchain install`
      # はそのファイルの toolchain を入れる）。ubuntu-latest に入っている rustup をそのまま
      # 使い、dtolnay/rust-toolchain で stable を別に入れることはしない。判定の本番
      # （Classify）で `cargo metadata` が失敗したときは、crates/ の変更を全体に倒す
      # （本番は止めずに安全側へ倒す）。一方、次の Test classifier は実グラフを直接
      # 読むので、cargo が無い・metadata が失敗するとこの段でジョブごと落ちて ci-gate が
      # 赤になる。これは意図: 「判定を検証できないなら落とす」ほうが、黙って全体に倒す
      # より異常に気づける。テスト側を cargo 無しで skip させたり通したりしない。
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal --no-self-update
          cargo --version

      # 判定表のテスト（判定の漏れは「必要なテストが走らない」側の失敗なので、
      # 判定そのものを毎回検証してから使う）。実グラフを読むテストは cargo が使えない
      # と失敗する（上の Install Rust toolchain のコメント参照。Classify と役割が違い、
      # こちらは検証できなければ落とす、Classify は動かし続けるために全体へ倒す）。
      - name: Test classifier
        run: node --test .github/scripts/ci-changes.test.mjs

      - name: List changed files
        id: diff
        if: github.event_name == 'pull_request'
        run: |
          out="$RUNNER_TEMP/changed.txt"
          # HEAD^2 が無い = マージコミットではない（想定外の checkout）。
          # そのときは ok=false にして判定側でフル CI に倒す。
          if git rev-parse --verify -q 'HEAD^2' >/dev/null \
            && git -c core.quotePath=false diff --name-only --no-renames 'HEAD^1' HEAD > "$out"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "changed files: $(wc -l < "$out")"
            cat "$out"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PR の差分を取得できなかったのでフル CI にする"
          fi

      - name: Classify
        id: classify
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DIFF_OK: ${{ steps.diff.outputs.ok }}
          CI_CHANGED_FILES: ${{ runner.temp }}/changed.txt
        run: node .github/scripts/ci-changes.mjs

  # 旧 frontend ジョブのうち repo 全体に掛かる ESLint / Prettier をここへ分けた。
  # docs だけの変更でも Markdown の整形はここで検査する。
  lint-format:
    name: Lint / Format (repo 全体)
    needs: changes
    if: needs.changes.outputs.run_lint_format == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # apps/*/package.json の @banto/* は tyaro/banto への git subdirectory 参照。
    # banto は 2026-07-12 に PUBLIC になったので、pnpm の既定の git fetcher が
    # 資格情報なしで解決する（rust ジョブの banto-core 等の git タグ依存と同じ）。
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version is intentionally omitted: pnpm/action-setup resolves it from
      # the "packageManager" field in the root package.json (pnpm@10.33.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

  frontend-hub:
    name: Frontend banto-hub (check / test / build)
    needs: changes
    if: needs.changes.outputs.run_frontend_hub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @banto/* のうち .svelte.ts を持つものが vite.config.ts の optimizeDeps.exclude から
      # 漏れていないか（漏れると pnpm dev だけが壊れ、build・E2E では見つからない。#478）。
      - name: Check optimizeDeps.exclude (banto)
        run: node scripts/check-banto-optimize-deps.mjs apps/banto-hub

      - name: Test scripts
        run: node --test scripts/check-banto-optimize-deps.test.mjs

      - name: Type check (svelte-check + tsc)
        run: pnpm --filter banto-hub check

      - name: Test
        run: pnpm --filter banto-hub test

      - name: Build
        run: pnpm --filter banto-hub build

  frontend-chronogazer:
    name: Frontend chronogazer (check / test / build)
    needs: changes
    if: needs.changes.outputs.run_frontend_chronogazer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @banto/* のうち .svelte.ts を持つものが vite.config.ts の optimizeDeps.exclude から
      # 漏れていないか（漏れると pnpm dev だけが壊れ、build・E2E では見つからない。#478）。
      - name: Check optimizeDeps.exclude (banto)
        run: node scripts/check-banto-optimize-deps.mjs apps/chronogazer

      - name: Type check (svelte-check + tsc)
        run: pnpm --filter chronogazer check

      - name: Test
        run: pnpm --filter chronogazer test

      - name: Build
        run: pnpm --filter chronogazer build

  rust:
    name: Rust (fmt / clippy)
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # CI のビルドは実行ファイルの大きさとリンク時間が効く。デバッグ情報は行番号表
      # （panic の場所・バックトレース）だけ残して軽くする。`test` プロファイルは
      # `dev` を継承するので CARGO_PROFILE_TEST_DEBUG は要らない。Swatinem/rust-cache の
      # キーは CARGO_* の env を含むので、この行を足した最初の 1 回はキャッシュが外れる。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    # banto-tags (and every later I-series crate) depends on banto-core /
    # banto-storage via a git tag reference into tyaro/banto (see
    # crates/banto-tags/Cargo.toml, banto's docs/publishing.md). banto went
    # PUBLIC on 2026-07-12, so Cargo's default git fetcher resolves it with
    # no credentials - no token or insteadOf rewrite is needed here.
    #
    # #468: the job id stays `rust` so Swatinem/rust-cache keeps its existing
    # key. main pushes always run the full workspace, so the cache main
    # saves (and PRs restore) stays a full-workspace cache.
    #
    # #ci-speed（2026-10-19）: nextest は下の `rust-test` ジョブへ分けた。このジョブは
    # fmt / clippy だけを回す（doctest は rust-test-build）。
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # `cache-workspace-crates` は見送った（#638 レビュー: rust-cache のキーにソースの中身が入らず、完全一致の復元では保存されない。checkout で更新時刻も新しくなり、自前の crate は結局ビルドし直しになる）。
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # rustfmt only parses/reformats - no compilation, so it always covers
      # every workspace member (cheap), whatever the clippy/test scope below.
      - name: fmt
        run: cargo fmt --all --check
      # Scope (`rust_args`, from the changes job): `--workspace` when the root
      # Cargo.toml/Cargo.lock, toolchain, proto, .cargo, .config or .github
      # changed (and on every push to main); otherwise `-p` for the touched
      # app's packages plus their consumers (RUST_PACKAGES in
      # .github/scripts/ci-changes.mjs) and, for crates/<name>/**, that package
      # plus every workspace package that depends on it, transitively, through
      # normal/dev/build path dependencies (`cargo metadata` in the changes job).
      # The workspace scope has no --exclude: the Tauri src-tauri crate
      # (`chronogazer`) has real tests of its own - PR #39 fixed a compile
      # error in relay-wright's src-tauri tests (relay-wright has since been
      # archived, see docs/plan.md) that a prior narrower CI scope had let
      # through undetected (a stale field reference left behind by T2-3). So
      # it stays in scope rather than being excluded for build-time reasons:
      # this job runs on windows-latest with Swatinem/rust-cache, where the
      # Tauri/WebView2 dependency build time is acceptable.
      - name: clippy
        run: cargo clippy ${{ needs.changes.outputs.rust_args }} --all-targets --timings -- -D warnings
      # crate ごとのビルド時間（clippy の check ビルド）。`--timings` は追加のビルドを
      # しない（ビルドの二重化なし）。失敗しても残す。
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-clippy
          path: target/cargo-timings/cargo-timing-*.html
          if-no-files-found: ignore
          retention-days: 14

  # #ci-speed（2026-10-19）: 旧 `rust` ジョブから nextest を分けた。ビルドは
  # `rust-test-build` が 1 回だけ行い（nextest archive）、`rust-test`（3 シャード）は
  # そのアーカイブを展開してテストを走らせるだけにする。対象（`rust_args`）と実行条件
  # （`run_rust`）は `rust` ジョブと同じ。
  # - 目的は Windows ランナーの使用時間の削減。それまでは 3 シャードが同じテスト
  #   バイナリを各自ビルドしていた（各 3〜4 分 x 3 台）。待ち時間は縮まらない
  #   （ビルド → テストが直列になる）ことは承知の上で、ビルドの 3 重化をやめる。
  # - 新しく足した最初の 1 回はキャッシュが外れて、ビルドが長くなる。
  rust-test-build:
    name: Rust test build (nextest archive / doctest)
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # rust ジョブと同じ（理由はそちらのコメント）。
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # #ci-speed（2026-10-19）: キャッシュの保存は main だけ（全 rust-cache 共通）。
      # PR も保存すると 1 本約 1GB の Windows キャッシュでリポジトリの上限 10GB に
      # すぐ届き、main のキャッシュが消されて PR がキャッシュ無しになった
      # （19:22 に完全一致したキーが 20:04 には消えていた）。PR は main のキャッシュを読む。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # テストバイナリ一式を 1 つのアーカイブにまとめる（実行はしない）。
      - name: build (nextest archive)
        run: cargo nextest archive ${{ needs.changes.outputs.rust_args }} --archive-file nextest-archive.tar.zst --timings
      - name: Upload nextest archive
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          if-no-files-found: error
          retention-days: 1
      # nextest は doctest を走らせない。archive のビルドでコンパイル済みの lib を
      # 再利用できるので、rust ジョブで test プロファイルをもう 1 回フルビルドせず
      # ここで回す。シャードはこのジョブを待つので doctest の分だけ開始が遅れる
      # （実測: doctest 本体は約 5 秒 + doc のコンパイル）。archive のアップロードを
      # 先に済ませてから回す。doctest が落ちるとこのジョブが失敗し、シャードは
      # 走らない（ci-gate も赤になるので見落としはしない）。
      - name: test (doctest)
        run: cargo test --doc ${{ needs.changes.outputs.rust_args }}
      - name: Install wasm-tools 1.262.0 (verified binary)
        if: needs.changes.outputs.rust_args == '--workspace' || contains(format(' {0} ', needs.changes.outputs.rust_args), ' -p banto-hub-host ')
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@1.262.0
          checksum: true
          fallback: none
      # Canonical guest source is a public, separate repository. This test is
      # ignored in the normal nextest archive because that archive has no guest
      # artifact; run it explicitly here after building the pinned component.
      - name: test (WASM Hub components)
        if: needs.changes.outputs.rust_args == '--workspace' || contains(format(' {0} ', needs.changes.outputs.rust_args), ' -p banto-hub-host ')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Guest main: its wit/driver.wit is the host WIT (#902 added
          # item-error.verification-failed in guest #47).
          $canonicalSha = '3b7f0f6120af689fdd7a807cff7837657242c6b2'
          # Regression pins below predate #47. Their driver.wit (this blob)
