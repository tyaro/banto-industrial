# CI（#468 で「変更したパスに応じて選んで実行する」構成に分けた）。
#
# 構成:
#   changes ──┬─ lint-format            （必ず。repo 全体の ESLint + Prettier）
#             ├─ frontend-hub           （条件付き）
#             ├─ frontend-chronogazer   （条件付き）
#             ├─ rust                   （条件付き。対象は workspace 全体か -p に絞る）
#             ├─ rust-db-source         （条件付き。PostgreSQL）
#             ├─ e2e-chronogazer        （条件付き）
#             └─ e2e-hub                （条件付き）
#   ci-gate（必ず。if: always()）: 上の全ジョブを見て、failure / cancelled、または
#   「走るべきなのに skipped」があれば fail。条件で skipped になったものは成功扱い。
#   **ブランチ保護の Required Check は `ci-gate` 1 つに集約する**（ジョブを増減しても
#   保護の設定を触らずに済む）。
#
# 判定は `.github/scripts/ci-changes.mjs`（純関数 + 判定表テスト
# `ci-changes.test.mjs`。ローカルでは `node --test .github/scripts/ci-changes.test.mjs`）。
# - push（main）と PR 以外の起動はフル CI（安全側）。
# - `.github/**`・`scripts/**`・どの規則にも当たらないパスはフル CI。
# - `crates/**`・Cargo.toml / Cargo.lock・toolchain・proto は Rust workspace 全体 +
#   両アプリの E2E。root の package.json / pnpm-lock.yaml / lint・format・TS 設定は
#   全 frontend + 両 E2E。
#
# 将来 `apps/banto-scada` を足すとき:
#   1. ci-changes.mjs の RULES に `^apps/banto-scada/` → `scada`（E2E を足すなら
#      `e2e/tests-banto-scada/` 等 → `e2e_scada`）を足し、AREAS・derive()
#      （`run_frontend_scada` / `run_e2e_scada`）・RUST_PACKAGES.scada を足す。
#   2. ci-changes.test.mjs に「scada だけの変更」の行を足す。
#   3. 下の `changes.outputs` に新しい出力を足す。
#   4. frontend-hub / e2e-hub を写して frontend-scada / e2e-scada ジョブを足す
#      （`if:` は新しい出力を見る。Swatinem/rust-cache のキーはジョブ ID ごとに
#      分かれるので、ジョブ ID を既存と重ねない）。
#   5. ci-gate の `needs` と、ステップ内の `check` 行に新しいジョブを足す。
#   Required Check は ci-gate のままなので、保護の設定は変えなくてよい。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes (変更パス判定)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.classify.outputs.full }}
      docs: ${{ steps.classify.outputs.docs }}
      rust_all: ${{ steps.classify.outputs.rust_all }}
      frontend_all: ${{ steps.classify.outputs.frontend_all }}
      hub: ${{ steps.classify.outputs.hub }}
      chronogazer: ${{ steps.classify.outputs.chronogazer }}
      hub_sink: ${{ steps.classify.outputs.hub_sink }}
      e2e_hub: ${{ steps.classify.outputs.e2e_hub }}
      e2e_chronogazer: ${{ steps.classify.outputs.e2e_chronogazer }}
      run_lint_format: ${{ steps.classify.outputs.run_lint_format }}
      run_frontend_hub: ${{ steps.classify.outputs.run_frontend_hub }}
      run_frontend_chronogazer: ${{ steps.classify.outputs.run_frontend_chronogazer }}
      run_rust: ${{ steps.classify.outputs.run_rust }}
      rust_args: ${{ steps.classify.outputs.rust_args }}
      run_rust_db_source: ${{ steps.classify.outputs.run_rust_db_source }}
      run_e2e_hub: ${{ steps.classify.outputs.run_e2e_hub }}
      run_e2e_chronogazer: ${{ steps.classify.outputs.run_e2e_chronogazer }}
    steps:
      # pull_request では checkout は PR のマージコミット（refs/pull/N/merge）。
      # fetch-depth: 2 でその 2 つの親（1 本目 = ベースの先端、2 本目 = PR の先端）
      # まで取れるので、shallow clone のままでも「1 本目の親 → マージコミット」の
      # 差分 = この PR がベースに持ち込む変更（CI が実際に検証する内容）を正しく
      # 取れる。merge-base を探す `base...head` の三点差分は shallow では
      # 失敗・誤判定しうるので使わない。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 判定表のテスト（判定の漏れは「必要なテストが走らない」側の失敗なので、
      # 判定そのものを毎回検証してから使う）。
      - name: Test classifier
        run: node --test .github/scripts/ci-changes.test.mjs

      - name: List changed files
        id: diff
        if: github.event_name == 'pull_request'
        run: |
          out="$RUNNER_TEMP/changed.txt"
          # HEAD^2 が無い = マージコミットではない（想定外の checkout）。
          # そのときは ok=false にして判定側でフル CI に倒す。
          if git rev-parse --verify -q 'HEAD^2' >/dev/null \
            && git -c core.quotePath=false diff --name-only --no-renames 'HEAD^1' HEAD > "$out"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "changed files: $(wc -l < "$out")"
            cat "$out"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PR の差分を取得できなかったのでフル CI にする"
          fi

      - name: Classify
        id: classify
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DIFF_OK: ${{ steps.diff.outputs.ok }}
          CI_CHANGED_FILES: ${{ runner.temp }}/changed.txt
        run: node .github/scripts/ci-changes.mjs

  # 旧 frontend ジョブのうち repo 全体に掛かる ESLint / Prettier をここへ分けた。
  # docs だけの変更でも Markdown の整形はここで検査する。
  lint-format:
    name: Lint / Format (repo 全体)
    needs: changes
    if: needs.changes.outputs.run_lint_format == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # apps/*/package.json の @banto/* は tyaro/banto への git subdirectory 参照。
    # banto は 2026-07-12 に PUBLIC になったので、pnpm の既定の git fetcher が
    # 資格情報なしで解決する（rust ジョブの banto-core 等の git タグ依存と同じ）。
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version is intentionally omitted: pnpm/action-setup resolves it from
      # the "packageManager" field in the root package.json (pnpm@10.33.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

  frontend-hub:
    name: Frontend banto-hub (check / test / build)
    needs: changes
    if: needs.changes.outputs.run_frontend_hub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @banto/* のうち .svelte.ts を持つものが vite.config.ts の optimizeDeps.exclude から
      # 漏れていないか（漏れると pnpm dev だけが壊れ、build・E2E では見つからない。#478）。
      - name: Check optimizeDeps.exclude (banto)
        run: node scripts/check-banto-optimize-deps.mjs apps/banto-hub

      - name: Test scripts
        run: node --test scripts/check-banto-optimize-deps.test.mjs

      - name: Type check (svelte-check + tsc)
        run: pnpm --filter banto-hub check

      - name: Test
        run: pnpm --filter banto-hub test

      - name: Build
        run: pnpm --filter banto-hub build

  frontend-chronogazer:
    name: Frontend chronogazer (check / test / build)
    needs: changes
    if: needs.changes.outputs.run_frontend_chronogazer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @banto/* のうち .svelte.ts を持つものが vite.config.ts の optimizeDeps.exclude から
      # 漏れていないか（漏れると pnpm dev だけが壊れ、build・E2E では見つからない。#478）。
      - name: Check optimizeDeps.exclude (banto)
        run: node scripts/check-banto-optimize-deps.mjs apps/chronogazer

      - name: Type check (svelte-check + tsc)
        run: pnpm --filter chronogazer check

      - name: Test
        run: pnpm --filter chronogazer test

      - name: Build
        run: pnpm --filter chronogazer build

  rust:
    name: Rust (fmt / clippy / test)
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    # banto-tags (and every later I-series crate) depends on banto-core /
    # banto-storage via a git tag reference into tyaro/banto (see
    # crates/banto-tags/Cargo.toml, banto's docs/publishing.md). banto went
    # PUBLIC on 2026-07-12, so Cargo's default git fetcher resolves it with
    # no credentials - no token or insteadOf rewrite is needed here.
    #
    # #468: the job id stays `rust` so Swatinem/rust-cache keeps its existing
    # key. main pushes always run the full workspace, so the cache main
    # saves (and PRs restore) stays a full-workspace cache.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rustfmt only parses/reformats - no compilation, so it always covers
      # every workspace member (cheap), whatever the clippy/test scope below.
      - name: fmt
        run: cargo fmt --all --check
      # Scope (`rust_args`, from the changes job): `--workspace` when crates/**,
      # Cargo.toml/Cargo.lock, toolchain, proto or .github changed (and on
      # every push to main); otherwise `-p` for the touched app's packages
      # plus their consumers (see RUST_PACKAGES in .github/scripts/ci-changes.mjs).
      # The workspace scope has no --exclude: the Tauri src-tauri crate
      # (`chronogazer`) has real tests of its own - PR #39 fixed a compile
      # error in relay-wright's src-tauri tests (relay-wright has since been
      # archived, see docs/plan.md) that a prior narrower CI scope had let
      # through undetected (a stale field reference left behind by T2-3). So
      # it stays in scope rather than being excluded for build-time reasons:
      # this job runs on windows-latest with Swatinem/rust-cache, where the
      # Tauri/WebView2 dependency build time is acceptable.
      - name: clippy
        run: cargo clippy ${{ needs.changes.outputs.rust_args }} --all-targets -- -D warnings
      - name: test
        run: cargo test ${{ needs.changes.outputs.rust_args }}

  # 外部 DB 連携 S2（docs/banto-hub-external-db-design.md §7「S2 / S5 の統合
  # テストは CI で PostgreSQL のサービスコンテナを使う」）。上の `rust` ジョブ
  # は windows-latest で、GitHub Actions のサービスコンテナは Linux ランナー
  # でしか使えないため、DB Source（S2）と DB Sink サイドカー（S5、
  # `apps/banto-hub-sink`）の実 PostgreSQL テストを ubuntu-latest の別ジョブへ
  # 切り出す。`BANTO_TEST_PG_URL` が無いときは各テストが
  # `eprintln!("skipped: ...")` で素通りするので、このジョブが無くても
  # `rust` ジョブは緑のまま（ゲートの意味は
  # apps/banto-hub/core/tests/db_source.rs のモジュール doc 参照）。
  #
  # #468: banto-hub・banto-hub-sink・crates・Cargo の共通設定を変えたとき
  # （とフル CI のとき）だけ走る。
  #
  # apt でのシステムパッケージ導入は不要: banto-hub-core は Tauri/WebKitGTK に
  # 依存しない（`e2e-hub` ジョブが同じ ubuntu-latest で
  # `cargo build -p banto-hub-core --bin banto-hub` を素で通しているのが実証）。
  rust-db-source:
    name: Rust (db-source / PostgreSQL)
    needs: changes
    if: needs.changes.outputs.run_rust_db_source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BANTO_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 統合テスト（実 PostgreSQL に対する正常/NULL/未対応型/0行/クエリ
      # エラー/接続断/構成変更/状態API/書き込み拒否）。
      - name: test (db_source integration)
        run: cargo test -p banto-hub-core --test db_source
      # `db_source` モジュール自身のユニットテスト（S1a の接続テストを
      # 含む - こちらも BANTO_TEST_PG_URL があるときだけ実 DB を触る）。
      - name: test (db_source unit)
        run: cargo test -p banto-hub-core --lib db_source
      # 外部 DB 連携 S5（サイドカー `banto-hub-sink`）: 単体テストと、
      # プロセス内の Hub + 実 PostgreSQL に対する統合テスト
      # （tests/sidecar.rs - interval/on_change・テーブル消失からの復帰・
      # 停止時の最終 status push）。banto-hub-core を dev-dependency として
      # ビルドするので、上の2ステップとキャッシュを共有できるこの位置に置く。
      - name: test (banto-hub-sink)
        run: cargo test -p banto-hub-sink

  # #468: 旧 `e2e` ジョブ（chronogazer と banto-hub を 1 ジョブで）を 2 つに
  # 分けた。hub だけの変更で chronogazer の build / Playwright を走らせない。
  # ジョブ ID が変わったので Swatinem/rust-cache のキーも e2e-chronogazer /
  # e2e-hub に分かれる（main の最初の push で作られる。互いのビルドで上書き
  # し合わない）。
  e2e-chronogazer:
    name: E2E chronogazer (Playwright smoke)
    needs: changes
    if: needs.changes.outputs.run_e2e_chronogazer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The static SvelteKit output the `--features embed-ui` binary below
      # embeds (apps/chronogazer/core/src/assets.rs).
      - name: Build frontend (chronogazer)
        run: pnpm --filter chronogazer build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # e2e/playwright.config.ts's webServer launches this binary directly
      # (not `cargo run`) - it must already exist before `pnpm e2e` below.
      - name: Build banto-serve (embed-ui)
        run: cargo build -p chronogazer-core --bin banto-serve --features embed-ui

      # R1-C C-4: e2e/playwright.config.ts's second webServer is the dev PLC
      # (apps/chronogazer/core/examples/dev_plc.rs, a Modbus TCP simulator)
      # that user-simulator-roundtrip.spec.ts collects from. Prebuilt for the
      # same reason as banto-serve above.
      - name: Build dev PLC example
        run: cargo build -p chronogazer-core --example dev_plc

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke suite (chronogazer)
        run: pnpm e2e

      # #507: 閲覧公開（grant publicViewer）の E2E。banto-serve は
      # BANTO_VIEWER_PUBLIC を起動時にしか読まないので、別の config（ポート 8804、
      # 閲覧公開 ON の 2 台目の banto-serve）。同じ banto-serve バイナリを使う。
      - name: Run E2E public-viewer suite (chronogazer)
        run: pnpm e2e:public-viewer

      - name: Upload Playwright report (chronogazer)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/playwright-report-public-viewer/
          retention-days: 7

  # T18-1 (docs/banto-hub-desktop-plan.md §16.3): apps/banto-hub has its own
  # Playwright config (e2e/banto-hub.playwright.config.ts,
  # `pnpm e2e:banto-hub`) covering first-run setup/login/logout and the
  # TAG-P0-1 continuous-registration DOM behavior.
  e2e-hub:
    name: E2E banto-hub (Playwright)
    needs: changes
    if: needs.changes.outputs.run_e2e_hub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The static SvelteKit output the `--features embed-ui` binary below
      # embeds (apps/banto-hub/core/src/assets.rs).
      - name: Build frontend (banto-hub)
        run: pnpm --filter banto-hub build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # e2e/banto-hub.playwright.config.ts's webServer launches this binary
      # directly - must exist before `pnpm e2e:banto-hub` below. banto-hub
      # itself is Windows-service-oriented (§8「常駐」) but the console-mode
      # binary this config runs is cross-platform (the Windows-only SCM code
      # is `#[cfg(windows)]`-gated - see apps/banto-hub/core/src/bin/banto-hub.rs's
      # doc comment), so it builds and runs fine here on ubuntu-latest.
      - name: Build banto-hub (embed-ui)
        run: cargo build -p banto-hub-core --bin banto-hub --features embed-ui

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite (banto-hub)
        run: pnpm e2e:banto-hub

      - name: Upload Playwright report (banto-hub)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-banto-hub
          path: e2e/playwright-report-banto-hub/
          retention-days: 7

  # Required Check 用の最終ゲート（#468）。必ず走り、
  # - changes が success でなければ fail（判定できていない = 何も保証できない）
  # - どのジョブでも failure / cancelled があれば fail
  # - changes が「走らせる」と判定したのに skipped なら fail
  # - 条件で skipped になったものは成功扱い
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - changes
      - lint-format
      - frontend-hub
      - frontend-chronogazer
      - rust
      - rust-db-source
      - e2e-chronogazer
      - e2e-hub
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          if [ "$changes" != "success" ]; then
            echo "::error::changes が $changes（判定できていないので通さない）"
            exit 1
          fi

          fail=0
          # どのジョブでも failure / cancelled は fail。
          while IFS=$'\t' read -r job result; do
            case "$result" in
              failure|cancelled)
                echo "::error::$job が $result"
                fail=1
                ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<<"$NEEDS")

          # 走るべきジョブが skipped になっていないか（changes の判定と突き合わせる）。
          check() {
            local job=$1 key=$2 result want
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            want=$(jq -r --arg k "$key" '.changes.outputs[$k]' <<<"$NEEDS")
            if [ "$want" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::$job は実行が必要（$key=true）なのに $result"
              fail=1
            fi
          }
          check lint-format run_lint_format
          check frontend-hub run_frontend_hub
          check frontend-chronogazer run_frontend_chronogazer
          check rust run_rust
          check rust-db-source run_rust_db_source
          check e2e-chronogazer run_e2e_chronogazer
          check e2e-hub run_e2e_hub

          exit "$fail"
