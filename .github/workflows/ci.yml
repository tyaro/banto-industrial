name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt / clippy / check / test)
    runs-on: windows-latest
    # banto-tags (and every later I-series crate) depends on banto-core /
    # banto-storage via a git tag reference into the private tyaro/banto
    # repository (see crates/banto-tags/Cargo.toml, banto's
    # docs/publishing.md). Cargo's default git fetcher has no credentials
    # for that repo, so this job needs:
    #   1. a repository secret BANTO_READ_TOKEN - a GitHub PAT with `read`
    #      access to tyaro/banto (classic PAT with `repo` scope, or a fine-
    #      grained PAT scoped to that repo) - set it under this repository's
    #      Settings > Secrets and variables > Actions
    #   2. the git-credential rewrite + CARGO_NET_GIT_FETCH_WITH_CLI below,
    #      so `cargo build`/`test`/`clippy` shell out to the `git` CLI
    #      (which honors the rewritten URL) instead of Cargo's built-in
    #      (unauthenticated) git fetcher
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v4
      - name: configure git credentials for private banto dependency
        run: git config --global url."https://x-access-token:${{ secrets.BANTO_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
