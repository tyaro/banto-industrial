name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # apps/chronogazer's @banto/* dependencies are git subdirectory refs
    # into tyaro/banto (github:tyaro/banto#v0.1.1&path:packages/...). banto
    # went PUBLIC on 2026-07-12, so pnpm's default git fetcher resolves them
    # with no credentials - no token setup is needed here (same reasoning as
    # the rust job's banto-core/-storage/-server git-tag deps).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version is intentionally omitted: pnpm/action-setup resolves it from
      # the "packageManager" field in the root package.json (pnpm@10.33.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Type check (svelte-check + tsc)
        run: pnpm check

      - name: Test
        run: pnpm --recursive --if-present test

      - name: Build
        run: pnpm build

  rust:
    name: Rust (fmt / clippy / test)
    runs-on: windows-latest
    timeout-minutes: 45
    # banto-tags (and every later I-series crate) depends on banto-core /
    # banto-storage via a git tag reference into tyaro/banto (see
    # crates/banto-tags/Cargo.toml, banto's docs/publishing.md). banto went
    # PUBLIC on 2026-07-12, so Cargo's default git fetcher resolves it with
    # no credentials - no token or insteadOf rewrite is needed here.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rustfmt only parses/reformats - no compilation, so like the steps
      # below it covers every workspace member, including the
      # `chronogazer`/`relay-wright` src-tauri crates.
      - name: fmt
        run: cargo fmt --all --check
      # Scope: the whole workspace, no --exclude. The two Tauri src-tauri
      # crates (`chronogazer`, `relay-wright`) have real tests of their own
      # (relay-wright: 25, chronogazer: 5) - PR #39 fixed a compile error in
      # relay-wright's src-tauri tests that a prior narrower CI scope had let
      # through undetected (a stale field reference left behind by T2-3).
      # So they stay in scope rather than being excluded for build-time
      # reasons: this job runs on windows-latest with Swatinem/rust-cache,
      # where the Tauri/WebView2 dependency build time is acceptable.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # T18-1 (docs/banto-hub-desktop-plan.md §16.3): apps/banto-hub now has
    # its own Playwright config (e2e/banto-hub.playwright.config.ts,
    # `pnpm e2e:banto-hub`) covering first-run setup/login/logout and the
    # TAG-P0-1 continuous-registration DOM behavior - it runs in this same
    # job, after the chronogazer suite.
    # H5: apps/relay-wright now has its own Playwright config too
    # (e2e/relay-wright.playwright.config.ts, `pnpm e2e:relay-wright`),
    # covering the Tauri-free embedded-server mode (spec §11.1 mode 2) -
    # see that config's doc comment for why Tauri-webview-only paths (mode
    # 1) are out of scope here.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` is recursive (`pnpm --recursive --if-present build`,
      # root package.json) so it already produces both
      # apps/chronogazer/build AND apps/banto-hub/build - the static
      # SvelteKit outputs each app's `--features embed-ui` binary (below)
      # embeds (apps/chronogazer/core/src/assets.rs,
      # apps/banto-hub/core/src/assets.rs). No separate
      # `pnpm --filter banto-hub build` step is needed.
      - name: Build frontend
        run: pnpm build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # e2e/playwright.config.ts's webServer launches this binary directly
      # (not `cargo run`) - it must already exist before `pnpm e2e` below.
      - name: Build banto-serve (embed-ui)
        run: cargo build -p chronogazer-core --bin banto-serve --features embed-ui

      # e2e/banto-hub.playwright.config.ts's webServer launches this binary
      # directly, same reasoning - must exist before `pnpm e2e:banto-hub`
      # below. banto-hub itself is Windows-service-oriented (§8「常駐」) but
      # the console-mode binary this config runs is cross-platform (the
      # Windows-only SCM code is `#[cfg(windows)]`-gated - see
      # apps/banto-hub/core/src/bin/banto-hub.rs's doc comment), so it
      # builds and runs fine here on ubuntu-latest.
      - name: Build banto-hub (embed-ui)
        run: cargo build -p banto-hub-core --bin banto-hub --features embed-ui

      # e2e/relay-wright.playwright.config.ts's webServer launches this
      # binary directly, same reasoning as banto-hub above - must exist
      # before `pnpm e2e:relay-wright` below. `pnpm build` (above) already
      # built apps/relay-wright/build recursively, but relay-wright is a
      # Tauri app (unlike chronogazer/banto-hub's plain SvelteKit apps) so
      # its own `pnpm --filter relay-wright build` is run explicitly here
      # too, to keep this step self-contained if the recursive build step
      # ever narrows its scope.
      - name: Build relay-wright frontend
        run: pnpm --filter relay-wright build

      - name: Build relay-wright-serve (embed-ui)
        run: cargo build -p relay-wright-core --bin relay-wright-serve --features embed-ui

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke suite (chronogazer)
        run: pnpm e2e

      # T18-1: banto-hub's own suite (first-run setup/login/logout +
      # TAG-P0-1 continuous-registration DOM behavior) - separate step so a
      # failure here is distinguishable from the chronogazer suite above.
      - name: Run E2E suite (banto-hub)
        run: pnpm e2e:banto-hub

      # H5: relay-wright's own suite (embedded-server mode first-run
      # setup/login/logout + PLC接続 REST CRUD) - separate step, same
      # reasoning as banto-hub above.
      - name: Run E2E suite (relay-wright)
        run: pnpm e2e:relay-wright

      - name: Upload Playwright report (chronogazer)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload Playwright report (banto-hub)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-banto-hub
          path: e2e/playwright-report-banto-hub/
          retention-days: 7

      - name: Upload Playwright report (relay-wright)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-relay-wright
          path: e2e/playwright-report-relay-wright/
          retention-days: 7
