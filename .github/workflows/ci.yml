          wasm-tools component targets 'crates/banto-driver-wasm/wit' $env:BANTO_SLMP_DIAGNOSTICS_COMPONENT_WASM --world driver-with-write-and-diagnostics-v1
          if ($LASTEXITCODE -ne 0) { throw 'diagnostic SLMP world mismatch' }
          cargo +1.98.1 test -p banto-driver-wasm --test diagnostics_v1 --locked -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'optional diagnostics world compatibility failed' }
          $env:BANTO_SLMP_OPERATIONAL_WRITE_COMPONENT_WASM = $env:BANTO_SLMP_DIAGNOSTICS_COMPONENT_WASM
          $diagnosticLog = Join-Path $env:RUNNER_TEMP 'wasm-slmp-diagnostics-hub-test.txt'
          cargo +1.98.1 test -p banto-hub-host --test t12_connection_test slmp_wasm_operational_write_test:: --locked -- --ignored --skip new_guest_ 2>&1 | Tee-Object -FilePath $diagnosticLog
          if ($LASTEXITCODE -ne 0) { throw 'diagnostic SLMP Hub tests failed' }
          if (-not (Select-String -Path $diagnosticLog -Pattern '^test result: ok\. 16 passed; 0 failed; 0 ignored;' -Quiet)) {
            throw 'diagnostic SLMP Hub tests did not all run'
          }
          # Keep the earlier diagnostic and read/write guests above for
          # compatibility. Build guest main (SLMP code as of #58, WIT as of #47)
          # separately for Hub acceptance. Its own pin: $canonicalSha stays at #47.
          # #43 leaves bit tags proven Outside out of the read plan; the earlier
          # guests above still read them one by one. #51 reads W word bits
          # (W1A.0), #55 and #56 read S/Z/RD and the Q ZR as read-only
          # range-Unknown tags (E1 3E frame and E2 routed access are accepted here).
          $newSlmpSha = 'f06a90ffadb21fbd3a7157bf27bb20560c81182e'
          Enter-GuestPin $newSlmpSha 'new SLMP guest'
          foreach ($wit in @('write-v1.wit', 'diagnostics-v1.wit')) {
            $guestBlob = git -C $guest rev-parse --verify "${newSlmpSha}:wit/$wit"
            $hostBlob = git rev-parse --verify "HEAD:crates/banto-driver-wasm/wit/$wit"
            if ($LASTEXITCODE -ne 0 -or $guestBlob -ne $hostBlob) {
              throw "new SLMP guest $wit mismatch"
            }
          }
          # The guest repository does not publish an SLMP manifest. The
          # checked-in Host operational-write manifest is the current loader
          # fixture; never substitute the guest's Modbus manifest.
          $slmpManifest = Get-Content 'apps/banto-hub/host/tests/t12_slmp_wasm_operational_write/manifest.json' -Raw | ConvertFrom-Json
          if ($slmpManifest.id -ne 'slmp-wasm-operational-write' -or $slmpManifest.writeApi -ne '1' -or
              -not ($slmpManifest.capabilities -contains 'read') -or -not ($slmpManifest.capabilities -contains 'write')) {
            throw 'SLMP Hub fixture manifest mismatch'
          }
          cargo +1.98.1 build --manifest-path (Join-Path $guest 'slmp-component/Cargo.toml') --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { throw 'new SLMP guest build failed' }
          $newSlmpModule = Join-Path $guest 'slmp-component/target/wasm32-unknown-unknown/debug/banto_slmp_read_component.wasm'
          $env:BANTO_SLMP_NEW_COMPONENT_WASM = Join-Path $env:RUNNER_TEMP 'slmp-44-component.wasm'
          wasm-tools component new $newSlmpModule -o $env:BANTO_SLMP_NEW_COMPONENT_WASM
          if ($LASTEXITCODE -ne 0) { throw 'new SLMP component creation failed' }
          wasm-tools validate $env:BANTO_SLMP_NEW_COMPONENT_WASM
          if ($LASTEXITCODE -ne 0) { throw 'new SLMP component validation failed' }
          wasm-tools component targets 'crates/banto-driver-wasm/wit' $env:BANTO_SLMP_NEW_COMPONENT_WASM --world driver-with-write-and-diagnostics-v1
          if ($LASTEXITCODE -ne 0) { throw 'new SLMP component world mismatch' }
          $env:BANTO_SLMP_OPERATIONAL_WRITE_COMPONENT_WASM = $env:BANTO_SLMP_NEW_COMPONENT_WASM
          $env:BANTO_SLMP_DIAGNOSTICS_COMPONENT_WASM = $env:BANTO_SLMP_NEW_COMPONENT_WASM
          $newSlmpLog = Join-Path $env:RUNNER_TEMP 'wasm-slmp-44-hub-test.txt'
          cargo +1.98.1 test -p banto-hub-host --test t12_connection_test slmp_wasm_operational_write_test:: --locked -- --ignored 2>&1 | Tee-Object -FilePath $newSlmpLog
          if ($LASTEXITCODE -ne 0) { throw 'new SLMP Hub acceptance tests failed' }
          if (-not (Select-String -Path $newSlmpLog -Pattern '^test result: ok\. 36 passed; 0 failed; 0 ignored;' -Quiet)) {
            throw 'new SLMP Hub acceptance tests did not all run'
          }
          # Stage-2 numeric reads use the separately reviewed guest revision.
          # Keep the older guest revisions above for read and write regressions.
          $numericSha = '9ffa939ffc3551325551b28e4993ec62b8ddc34d'
          Enter-GuestPin $numericSha 'numeric guest'
          $env:BANTO_STAGE2_MODBUS_MANIFEST = Join-Path $guest 'component/manifest.json'
          cargo +1.98.1 build --manifest-path (Join-Path $guest 'component/Cargo.toml') --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { throw 'numeric Modbus guest build failed' }
          $numericModbusModule = Join-Path $guest 'component/target/wasm32-unknown-unknown/debug/banto_modbus_tcp_component.wasm'
          $env:BANTO_STAGE2_MODBUS_WASM = Join-Path $env:RUNNER_TEMP 'numeric-modbus-component.wasm'
          wasm-tools component new $numericModbusModule -o $env:BANTO_STAGE2_MODBUS_WASM
          if ($LASTEXITCODE -ne 0) { throw 'numeric Modbus component creation failed' }
          wasm-tools validate $env:BANTO_STAGE2_MODBUS_WASM
          if ($LASTEXITCODE -ne 0) { throw 'numeric Modbus component validation failed' }
          wasm-tools component targets 'crates/banto-driver-wasm/wit/driver.wit' $env:BANTO_STAGE2_MODBUS_WASM --world driver
          if ($LASTEXITCODE -ne 0) { throw 'numeric Modbus component world mismatch' }
          cargo +1.98.1 build --manifest-path (Join-Path $guest 'slmp-component/Cargo.toml') --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { throw 'numeric SLMP guest build failed' }
          $numericSlmpModule = Join-Path $guest 'slmp-component/target/wasm32-unknown-unknown/debug/banto_slmp_read_component.wasm'
          $env:BANTO_STAGE2_SLMP_WASM = Join-Path $env:RUNNER_TEMP 'numeric-slmp-component.wasm'
          wasm-tools component new $numericSlmpModule -o $env:BANTO_STAGE2_SLMP_WASM
          if ($LASTEXITCODE -ne 0) { throw 'numeric SLMP component creation failed' }
          wasm-tools validate $env:BANTO_STAGE2_SLMP_WASM
          if ($LASTEXITCODE -ne 0) { throw 'numeric SLMP component validation failed' }
          wasm-tools component targets 'crates/banto-driver-wasm/wit/driver.wit' $env:BANTO_STAGE2_SLMP_WASM --world driver
          if ($LASTEXITCODE -ne 0) { throw 'numeric SLMP component world mismatch' }
          $numericTestLog = Join-Path $env:RUNNER_TEMP 'wasm-numeric-stage2-test.txt'
          cargo +1.98.1 test -p banto-driver-wasm --test numeric_stage2 --locked -- --ignored --skip local_fc4_eight_kinds_use_input_registers_without_write_capability --skip local_r_w_eight_kinds_use_hex_addresses_without_write_capability 2>&1 | Tee-Object -FilePath $numericTestLog
          if ($LASTEXITCODE -ne 0) { throw 'WASM numeric stage-2 host tests failed' }
          if (-not (Select-String -Path $numericTestLog -Pattern '^test result: ok\. 6 passed; 0 failed; 0 ignored;' -Quiet)) {
            throw 'WASM numeric stage-2 host tests did not all run'
          }
          $numericHubLog = Join-Path $env:RUNNER_TEMP 'wasm-numeric-stage2-hub-test.txt'
          cargo +1.98.1 test -p banto-hub-host --test t12_connection_test eight_numeric_kinds_collect_and_serve_rest --locked -- --ignored --skip wasm_fc4_eight_numeric_kinds_collect_and_serve_rest --skip slmp_wasm_test::r_w_eight_numeric_kinds_collect_and_serve_rest 2>&1 | Tee-Object -FilePath $numericHubLog
          if ($LASTEXITCODE -ne 0) { throw 'WASM numeric stage-2 Hub tests failed' }
          if (-not (Select-String -Path $numericHubLog -Pattern '^test result: ok\. 2 passed; 0 failed; 0 ignored;' -Quiet)) {
            throw 'WASM numeric stage-2 Hub tests did not both run'
          }
          # FC4 and SLMP W use a separately reviewed read-only guest revision.
          # Keep the stage-2 and write revisions above pinned for regressions.
          $fc4WSha = '290648da33895a707abcaaafeb23bd0f05d5b828'
          Enter-GuestPin $fc4WSha 'FC4/W guest'
          $env:BANTO_LOCAL_FC4_MANIFEST = Join-Path $guest 'component/manifest.json'
          cargo +1.98.1 build --manifest-path (Join-Path $guest 'component/Cargo.toml') --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { throw 'FC4 Modbus guest build failed' }
          $fc4Module = Join-Path $guest 'component/target/wasm32-unknown-unknown/debug/banto_modbus_tcp_component.wasm'
          $env:BANTO_LOCAL_FC4_WASM = Join-Path $env:RUNNER_TEMP 'fc4-modbus-component.wasm'
          wasm-tools component new $fc4Module -o $env:BANTO_LOCAL_FC4_WASM
          if ($LASTEXITCODE -ne 0) { throw 'FC4 Modbus component creation failed' }
          wasm-tools validate $env:BANTO_LOCAL_FC4_WASM
          if ($LASTEXITCODE -ne 0) { throw 'FC4 Modbus component validation failed' }
          wasm-tools component targets 'crates/banto-driver-wasm/wit/driver.wit' $env:BANTO_LOCAL_FC4_WASM --world driver
          if ($LASTEXITCODE -ne 0) { throw 'FC4 Modbus component world mismatch' }
          cargo +1.98.1 build --manifest-path (Join-Path $guest 'slmp-component/Cargo.toml') --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { throw 'SLMP W guest build failed' }
          $wModule = Join-Path $guest 'slmp-component/target/wasm32-unknown-unknown/debug/banto_slmp_read_component.wasm'
          $env:BANTO_LOCAL_W_WASM = Join-Path $env:RUNNER_TEMP 'slmp-w-component.wasm'
          wasm-tools component new $wModule -o $env:BANTO_LOCAL_W_WASM
          if ($LASTEXITCODE -ne 0) { throw 'SLMP W component creation failed' }
          wasm-tools validate $env:BANTO_LOCAL_W_WASM
          if ($LASTEXITCODE -ne 0) { throw 'SLMP W component validation failed' }
          wasm-tools component targets 'crates/banto-driver-wasm/wit/driver.wit' $env:BANTO_LOCAL_W_WASM --world driver
          if ($LASTEXITCODE -ne 0) { throw 'SLMP W component world mismatch' }
          $fc4WHostLog = Join-Path $env:RUNNER_TEMP 'wasm-fc4-w-host-test.txt'
          cargo +1.98.1 test -p banto-driver-wasm --test numeric_stage2 local_ --locked -- --ignored 2>&1 | Tee-Object -FilePath $fc4WHostLog
          if ($LASTEXITCODE -ne 0) { throw 'FC4/W host tests failed' }
          if (-not (Select-String -Path $fc4WHostLog -Pattern '^test result: ok\. 2 passed; 0 failed; 0 ignored;' -Quiet)) {
            throw 'FC4/W host tests did not both run'
          }
          $fc4WHubLog = Join-Path $env:RUNNER_TEMP 'wasm-fc4-w-hub-test.txt'
          cargo +1.98.1 test -p banto-hub-host --test t12_connection_test eight_numeric_kinds_collect_and_serve_rest --locked -- --ignored --skip wasm_fc3_eight_numeric_kinds_collect_and_serve_rest --skip slmp_wasm_test::r_eight_numeric_kinds_collect_and_serve_rest 2>&1 | Tee-Object -FilePath $fc4WHubLog
          if ($LASTEXITCODE -ne 0) { throw 'FC4/W Hub tests failed' }
          if (-not (Select-String -Path $fc4WHubLog -Pattern '^test result: ok\. 2 passed; 0 failed; 0 ignored;' -Quiet)) {
            throw 'FC4/W Hub tests did not both run'
          }
          # Modbus FC1/2/3/4 and gated FC5/16/22 join uses the exact reviewed
          # guest package manifest and the optional write world (guest main:
          # Modbus code as of #58 (A1 coil/discrete probe, B1 register_bit_write);
          # its WIT is still the #47 one, so Enter-GuestPin keeps the WIT checkout).
          $modbusJoinSha = 'f06a90ffadb21fbd3a7157bf27bb20560c81182e'
          Enter-GuestPin $modbusJoinSha 'Modbus join guest'
          $modbusWriteWit = git -C $guest rev-parse --verify "${modbusJoinSha}:wit/write-v1.wit"
          if ($LASTEXITCODE -ne 0 -or $modbusWriteWit -ne $hostWriteWit) { throw 'Modbus join write WIT mismatch' }
          $env:BANTO_MODBUS_MANIFEST = Join-Path $guest 'component/manifest.json'
          cargo +1.98.1 build --manifest-path (Join-Path $guest 'component/Cargo.toml') --target wasm32-unknown-unknown --locked
          if ($LASTEXITCODE -ne 0) { throw 'Modbus join guest build failed' }
          $modbusJoinModule = Join-Path $guest 'component/target/wasm32-unknown-unknown/debug/banto_modbus_tcp_component.wasm'
          $env:BANTO_MODBUS_COMPONENT_WASM = Join-Path $env:RUNNER_TEMP 'modbus-join-component.wasm'
          wasm-tools component new $modbusJoinModule -o $env:BANTO_MODBUS_COMPONENT_WASM
          if ($LASTEXITCODE -ne 0) { throw 'Modbus join component creation failed' }
          wasm-tools validate $env:BANTO_MODBUS_COMPONENT_WASM
          if ($LASTEXITCODE -ne 0) { throw 'Modbus join component validation failed' }
          wasm-tools component targets 'crates/banto-driver-wasm/wit' $env:BANTO_MODBUS_COMPONENT_WASM --world driver-with-write-v1
          if ($LASTEXITCODE -ne 0) { throw 'Modbus join write world mismatch' }
          $modbusJoinLog = Join-Path $env:RUNNER_TEMP 'wasm-modbus-join-test.txt'
          cargo +1.98.1 test -p banto-driver-wasm --test modbus_join --locked -- --ignored 2>&1 | Tee-Object -FilePath $modbusJoinLog
          if ($LASTEXITCODE -ne 0) { throw 'Modbus join adapter tests failed' }
          if (-not (Select-String -Path $modbusJoinLog -Pattern '^test result: ok\. 7 passed; 0 failed; 0 ignored;' -Quiet)) {
            throw 'Modbus join adapter tests did not all run'
          }
          $modbusHubLog = Join-Path $env:RUNNER_TEMP 'wasm-modbus-hub-join-test.txt'
          cargo +1.98.1 test -p banto-hub-host --test t12_connection_test modbus_wasm_join_test:: --locked -- --ignored 2>&1 | Tee-Object -FilePath $modbusHubLog
          if ($LASTEXITCODE -ne 0) { throw 'Modbus Hub join tests failed' }
          if (-not (Select-String -Path $modbusHubLog -Pattern '^test result: ok\. 7 passed; 0 failed; 0 ignored;' -Quiet)) {
            throw 'Modbus Hub join tests did not all run'
          }
      # crate ごとのビルド時間（nextest のテストビルド）。失敗しても残す。
      - name: Upload cargo timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-test
          path: target/cargo-timings/cargo-timing-*.html
          if-no-files-found: ignore
          retention-days: 14

  # #ci-speed（2026-10-19）: `rust-test-build` のアーカイブを 3 台にシャーディングして
  # 走らせる。ビルドはしない（Rust ツールチェーンも rust-cache も使わない）。
  # - `--partition count:N/3` はテストを 1 件ずつ順に各シャードへ配る。`hash:` と違い
  #   件数が均等に近く、バイナリ単位の分け方と違い重い統合テストの偏りが出にくい
  #   （3735 テスト / 78 バイナリ）。
  # - test-groups（.config/nextest.toml の hub-default-mutex・heavy-runtime の直列化）は
  #   シャードの中でだけ効く。シャードは別のランナー（別のマシン）なので、
  #   シャードをまたいでぶつかる共有物（名前付き mutex・固定ポート）はそもそも無い。
  rust-test:
    name: Rust test (nextest ${{ matrix.shard }}/3)
    needs: [changes, rust-test-build]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # checkout は `--workspace-remap`（ワークスペースの場所）のために要る。
      - uses: actions/checkout@v7
      # テストは cargo-nextest（テスト 1 件 = 1 プロセスで、バイナリをまたいで並列に
      # 走る）。同時に走るとぶつかるテストは .config/nextest.toml の test-groups で
      # 直列にしてある（理由もそこ）。ローカルでも `cargo nextest run` が使える。
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
      # `cargo nextest` ではなく `cargo-nextest nextest` と直接呼ぶ: リポジトリに
      # rust-toolchain.toml があり、cargo を経由すると toolchain のダウンロードが走りうる
      # （アーカイブの実行に Rust は要らない）。
      # アーカイブは一時ディレクトリでなくワークスペース直下（`--extract-to .`）へ
      # 展開する。chronogazer_server.rs などが `env!("CARGO_BIN_EXE_<bin>")`（コンパイル時
      # の絶対パス。例 D:\a\banto-industrial\banto-industrial\target\debug\xxx.exe）で
      # バイナリを起動するので、展開先の `target/` がビルドした台と同じ絶対パスに
      # 無いと壊れる。GitHub のランナーは checkout 先が同じパスなので、ワークスペース
      # 直下へ展開すれば一致する。`--extract-overwrite` は展開先に既存ファイルが
      # あっても失敗させないため。
      - name: test (nextest)
        run: cargo-nextest nextest run --archive-file nextest-archive.tar.zst --workspace-remap . --extract-to . --extract-overwrite --profile ci --partition count:${{ matrix.shard }}/3
      # テストごとの所要時間（遅いテスト探し用）。失敗しても残す。
      - name: Upload nextest junit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  # 外部 DB 連携 S2（docs/banto-hub-external-db-design.md §7「S2 / S5 の統合
  # テストは CI で PostgreSQL のサービスコンテナを使う」）。上の `rust` ジョブ
  # は windows-latest で、GitHub Actions のサービスコンテナは Linux ランナー
  # でしか使えないため、DB Source（S2）と DB Sink サイドカー（S5、
  # `apps/banto-hub-sink`）の実 PostgreSQL テストを ubuntu-latest の別ジョブへ
  # 切り出す。`BANTO_TEST_PG_URL` が無いときは各テストが
  # `eprintln!("skipped: ...")` で素通りするので、このジョブが無くても
  # `rust` ジョブは緑のまま（ゲートの意味は
  # apps/banto-hub/core/tests/db_source.rs のモジュール doc 参照）。
  #
  # #468: banto-hub・banto-hub-sink・Cargo の共通設定を変えたとき、共有 crate の変更が
  # banto-hub-core か banto-hub-sink に届くとき（ci-changes.mjs の JOB_PACKAGES）、
  # とフル CI のときだけ走る。
  #
  # nextest にしない理由: 3 ステップとも実 PostgreSQL 1 つを共有し、小さいので並列化の
  # 利得が薄い一方、プロセスが別になると DB 上の状態の取り合いが増える。
  #
  # apt でのシステムパッケージ導入は不要: banto-hub-core は Tauri/WebKitGTK に
  # 依存しない（`e2e-hub` ジョブが同じ ubuntu-latest で
  # `cargo build -p banto-hub-host --bin banto-hub`（core を含む）を素で通しているのが実証）。
  rust-db-source:
    name: Rust (db-source / PostgreSQL)
    needs: changes
    if: needs.changes.outputs.run_rust_db_source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BANTO_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # 統合テスト（実 PostgreSQL に対する正常/NULL/未対応型/0行/クエリ
      # エラー/接続断/構成変更/状態API/書き込み拒否）。
      - name: test (db_source integration)
        run: cargo test -p banto-hub-core --test db_source
      # `db_source` モジュール自身のユニットテスト（S1a の接続テストを
      # 含む - こちらも BANTO_TEST_PG_URL があるときだけ実 DB を触る）。
      - name: test (db_source unit)
        run: cargo test -p banto-hub-core --lib db_source
      # R2a-3a: db_source と DB ブリッジ（R2a-3b）が共有する crate（列→f64 の変換・
      # 列の解決・品質の梯子・接続オプション）。単体テストは PostgreSQL なしで走る
      # が、この crate を触ったときに確実にこのジョブも走るよう（ci-changes.mjs の
      # JOB_PACKAGES）、ここで明示的に流す。
      - name: test (banto-db-source)
        run: cargo test -p banto-db-source
      # 外部 DB 連携 S5（サイドカー `banto-hub-sink`）: 単体テストと、
      # プロセス内の Hub + 実 PostgreSQL に対する統合テスト
      # （tests/sidecar.rs - interval/on_change・テーブル消失からの復帰・
      # 停止時の最終 status push）。banto-hub-core を dev-dependency として
      # ビルドするので、上の2ステップとキャッシュを共有できるこの位置に置く。
      # R2a-3b: DB ブリッジの統合テスト（tests/bridge.rs - 値が Hub に届く・収集の停止と
      # 開始・WS の切断と再接続・DB の停止・スコープの無い接続）も同じ
      # `cargo test -p banto-hub-sink` で走る。
      # R2a-3c（R2a の完了条件）: Hub 内の Source との突き合わせ（tests/bridge_parity.rs -
      # §10.4 の 11 場面 1〜9・7b・7c。9 は 60 秒の上限ちょうどの 3 クエリ）も同じ。
      - name: test (banto-hub-sink)
        run: cargo test -p banto-hub-sink
      # 配布物と同じく sink を単体で（dev-dependency の feature を混ぜずに）確かめる。
      # `cargo test` は dev 側（banto-hub-core など）の sqlx の feature と合わさって
      # 通ってしまい、#764 から `cargo build --release -p banto-hub-sink` が
      # `Executor::describe` の未定義で落ちるのを見逃していた（alpha.35 のリリースビルドで発覚）。
      - name: check (banto-hub-sink 単体)
        run: cargo check -p banto-hub-sink

  # #392 B3-3b の監査 Nit 1: メインの Rust ジョブは windows-latest なので、Windows 以外
  # だけで出る `dead_code` など（例: `banto-hub-core` の `resolve_service_acl_target`、
  # `chronogazer-elev` の Windows 専用の再公開の cfg 漏れ）を CI で捕まえられない。昇格
  # まわりの 2 crate の lib を ubuntu で clippy する軽いジョブ。Rust の対象（`rust_args`）に
  # この 2 つのどちらかが入るとき（workspace 全体を含む）だけ走る（`run_linux_clippy`。
  # 判定は ci-changes.mjs の JOB_PACKAGES）。#623 PR-2 から、`banto-instance-lock` が
  # 対象に入るときはその clippy・テストもここで走らせる（下の段）。`banto-safe-root`
  # （#623 PR-1b のレビュー S-2）も同じ。
  linux-clippy:
    name: Rust (linux clippy / 昇格まわり)
    needs: changes
    if: needs.changes.outputs.run_linux_clippy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy (chronogazer-elev / banto-hub-core の lib)
        run: cargo clippy -p chronogazer-elev -p banto-hub-core --lib -- -D warnings
      # R1-7a（docs/banto-driver-api-design.md §2.4）: banto-hub の bin（`banto-hub`・
      # `banto-hub-elev`）は `banto-hub-host` へ移った。bin は lib を持たないので `--lib`
      # とは別の段にする。Windows 専用の `win_service` は `cfg(windows)` で外れ、非 Windows の
      # 分岐（`banto-hub-elev` の案内だけの `main` など）とマニフェストのテストを見る。
      - name: clippy (banto-hub-host の bin)
        run: cargo clippy -p banto-hub-host --all-targets -- -D warnings
      # #623 PR-2 のレビュー P2-1: `banto-instance-lock` は非 Windows に別の実装
      # （flock・`O_NOFOLLOW` の診断ファイル）とテストの分岐を持つが、メインの Rust
      # ジョブは windows-latest なので、ここで走らせないと一度もコンパイル・実行されない。
      # Rust の対象（`rust_args`）にこの crate が入るとき（workspace 全体を含む）だけ。
      - name: clippy + test (banto-instance-lock、非 Windows の実装)
        if: needs.changes.outputs.rust_args == '--workspace' || contains(format(' {0} ', needs.changes.outputs.rust_args), ' -p banto-instance-lock ')
        run: |
          cargo clippy -p banto-instance-lock --all-targets -- -D warnings
          cargo test -p banto-instance-lock
      # #623 PR-1b のレビュー S-2: `banto-safe-root` にも非 Windows の分岐（`Mode::Plain`、
      # `guarded_is_unsupported_off_windows`、`nofollow` の `non_windows_is_unsupported`）が
      # あるが、依存としてコンパイルされるだけで `-D warnings` もテストも走っていなかった。
      # dev-dependency の `banto-service-elev` は Windows 専用の依存を `cfg(windows)` に
      # 閉じていて、Linux でもビルドできる（上の `chronogazer-elev` の clippy が既に通している）。
      - name: clippy + test (banto-safe-root、非 Windows の実装)
        if: needs.changes.outputs.rust_args == '--workspace' || contains(format(' {0} ', needs.changes.outputs.rust_args), ' -p banto-safe-root ')
        run: |
          cargo clippy -p banto-safe-root --all-targets -- -D warnings
          cargo test -p banto-safe-root

  # R1-1 / R1-2（docs/banto-driver-api-design.md §2.2・§9.1）: crates.io へ公開する
  # `banto-driver-api`・`banto-driver-engine`・`banto-driver-conformance`（API の適合テスト一式。API に
  # path + version で依存）の互換性を守る軽いジョブ（ubuntu）。いずれかが Rust の対象に
  # 入るとき（= いずれか自身の変更か、workspace 全体のとき。API の変更は逆依存の
  # conformance も対象に入れる）だけ走る（`run_driver_api`。判定は ci-changes.mjs の
  # JOB_PACKAGES）。
  # - MSRV: `Cargo.toml` の `rust-version`（1.85、3 つとも同じ）で check する。リポジトリの
  #   rust-toolchain.toml（1.98.1）が `rustup default` より優先されるので、
  #   `RUSTUP_TOOLCHAIN` で上書きする。`rust-version` を上げるときは、この版と
  #   `dtolnay/rust-toolchain@<版>` も同じ PR で上げる（minor を上げ CHANGELOG に書く）。
  # - `--all-features`（API の feature `serde`）の clippy / test: workspace の中にこの
  #   feature を有効にする crate は無いので、rust / rust-test ジョブでは一度もコンパイル
  #   されない。
  # - cargo-semver-checks: crate ごとに、基準は `<crate 名>-v*` の最も新しいタグ
  #   （各 crate の CHANGELOG.md の「タグの名前」。`banto-driver-api-v*` /
  #   `banto-driver-conformance-v*`）。その crate の最初のタグができるまでは飛ばす。
  #   minor を上げる PR（破壊を意図する）では `check-release` が破壊を報告しないことを
  #   確かめる（0.x の minor は破壊を許す）。
  driver-api:
    name: Rust (banto-driver-api・engine・conformance / MSRV・features・semver)
    needs: changes
    if: needs.changes.outputs.run_driver_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # semver-checks の基準（タグとその履歴）を読むため全履歴・全タグを取る。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: MSRV check (Rust 1.85)
        env:
          RUSTUP_TOOLCHAIN: '1.85'
        run: |
          cargo --version
          cargo check -p banto-driver-api -p banto-driver-engine -p banto-driver-conformance
          cargo check -p banto-driver-api -p banto-driver-engine -p banto-driver-conformance --all-features
      # ここからはリポジトリのピン（rust-toolchain.toml）で回す。
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal --no-self-update
          cargo --version
      - name: clippy + test (--all-features)
        run: |
          cargo clippy -p banto-driver-api -p banto-driver-engine -p banto-driver-conformance --all-targets --all-features -- -D warnings
          cargo test -p banto-driver-api -p banto-driver-engine -p banto-driver-conformance --all-features
      - name: cargo-semver-checks
        run: |
          set -euo pipefail
          installed=false
          for pkg in banto-driver-api banto-driver-engine banto-driver-conformance; do
            base=$(git tag --list "${pkg}-v*" --sort=-v:refname | head -n 1)
            if [ -z "$base" ]; then
              echo "::notice::${pkg}-v* のタグがまだ無いので ${pkg} の cargo-semver-checks を飛ばす（最初の公開まで）"
              continue
            fi
            echo "${pkg} baseline: $base"
            if [ "$installed" = false ]; then
              cargo install cargo-semver-checks --locked
              installed=true
            fi
            cargo semver-checks check-release -p "$pkg" --baseline-rev "$base"
          done

  # #468: 旧 `e2e` ジョブ（chronogazer と banto-hub を 1 ジョブで）を 2 つに
  # 分けた。hub だけの変更で chronogazer の build / Playwright を走らせない。
  # ジョブ ID が変わったので Swatinem/rust-cache のキーも e2e-chronogazer /
  # e2e-hub に分かれる（main の最初の push で作られる。互いのビルドで上書き
  # し合わない）。
  e2e-chronogazer:
    name: E2E chronogazer (Playwright smoke)
    needs: changes
    if: needs.changes.outputs.run_e2e_chronogazer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The static SvelteKit output the `--features embed-ui` binary below
      # embeds (apps/chronogazer/core/src/assets.rs).
      - name: Build frontend (chronogazer)
        run: pnpm --filter chronogazer build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # e2e/playwright.config.ts's webServer launches this binary directly
      # (not `cargo run`) - it must already exist before `pnpm e2e` below.
      - name: Build banto-serve (embed-ui)
        run: cargo build -p chronogazer-core --bin banto-serve --features embed-ui

      # R1-C C-4: e2e/playwright.config.ts's second webServer is the dev PLC
      # (apps/chronogazer/core/examples/dev_plc.rs, a Modbus TCP simulator)
      # that user-simulator-roundtrip.spec.ts collects from. Prebuilt for the
      # same reason as banto-serve above.
      - name: Build dev PLC example
        run: cargo build -p chronogazer-core --example dev_plc

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke suite (chronogazer)
        run: pnpm e2e

      # #507: 閲覧公開（grant publicViewer）の E2E。banto-serve は
      # BANTO_VIEWER_PUBLIC を起動時にしか読まないので、別の config（ポート 8804、
      # 閲覧公開 ON の 2 台目の banto-serve）。同じ banto-serve バイナリを使う。
      - name: Run E2E public-viewer suite (chronogazer)
        run: pnpm e2e:public-viewer

      # #392 B2-2: サービス接続モード（grant localDesktop）の E2E。banto-serve は
      # localDesktop を常に閉じるので、本番の headless host chronogazer-server を
      # スペックが子プロセスとして起動・再起動・停止する（ポート 8807。テスト用の
      # ポートの注入と --control-stdin はデバッグビルドだけ）。UI は上の
      # frontend のビルドを embed-ui で埋め込む。
      - name: Build chronogazer-server (embed-ui)
        run: cargo build -p chronogazer-core --bin chronogazer-server --features embed-ui

      - name: Run E2E service-connection suite (chronogazer)
        run: pnpm e2e:server

      - name: Upload Playwright report (chronogazer)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/playwright-report-public-viewer/
            e2e/playwright-report-chronogazer-server/
          retention-days: 7

  # T18-1 (docs/banto-hub-desktop-plan.md §16.3): apps/banto-hub has its own
  # Playwright config (e2e/banto-hub.playwright.config.ts,
  # `pnpm e2e:banto-hub`) covering first-run setup/login/logout and the
  # TAG-P0-1 continuous-registration DOM behavior.
  e2e-hub:
    name: E2E banto-hub (Playwright)
    needs: changes
    if: needs.changes.outputs.run_e2e_hub == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The static SvelteKit output the `--features embed-ui` binary below
      # embeds (apps/banto-hub/core/src/assets.rs).
      - name: Build frontend (banto-hub)
        run: pnpm --filter banto-hub build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # e2e/banto-hub.playwright.config.ts's webServer launches this binary
      # directly - must exist before `pnpm e2e:banto-hub` below. banto-hub
      # itself is Windows-service-oriented (§8「常駐」) but the console-mode
      # binary this config runs is cross-platform (the Windows-only SCM code
      # is `#[cfg(windows)]`-gated - see apps/banto-hub/host/src/bin/banto-hub.rs's
      # doc comment), so it builds and runs fine here on ubuntu-latest.
      - name: Build banto-hub (embed-ui)
        run: cargo build -p banto-hub-host --bin banto-hub --features embed-ui

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite (banto-hub)
        run: pnpm e2e:banto-hub

      - name: Upload Playwright report (banto-hub)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-banto-hub
          path: e2e/playwright-report-banto-hub/
          retention-days: 7

  # Required Check 用の最終ゲート（#468）。必ず走り、
  # - changes が success でなければ fail（判定できていない = 何も保証できない）
  # - どのジョブでも failure / cancelled があれば fail
  # - changes が「走らせる」と判定したのに skipped なら fail
  # - 条件で skipped になったものは成功扱い
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - changes
      - lint-format
      - frontend-hub
      - frontend-chronogazer
      - rust
      - rust-test-build
      - rust-test
      - rust-db-source
      - linux-clippy
      - driver-api
      - e2e-chronogazer
      - e2e-hub
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          if [ "$changes" != "success" ]; then
            echo "::error::changes が $changes（判定できていないので通さない）"
            exit 1
          fi

          fail=0
          # どのジョブでも failure / cancelled は fail。
          while IFS=$'\t' read -r job result; do
            case "$result" in
              failure|cancelled)
                echo "::error::$job が $result"
                fail=1
                ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<<"$NEEDS")

          # 走るべきジョブが skipped になっていないか（changes の判定と突き合わせる）。
          check() {
            local job=$1 key=$2 result want
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            want=$(jq -r --arg k "$key" '.changes.outputs[$k]' <<<"$NEEDS")
            if [ "$want" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::$job は実行が必要（$key=true）なのに $result"
              fail=1
            fi
          }
          check lint-format run_lint_format
          check frontend-hub run_frontend_hub
          check frontend-chronogazer run_frontend_chronogazer
          check rust run_rust
          check rust-test-build run_rust
          check rust-test run_rust
          check rust-db-source run_rust_db_source
          check linux-clippy run_linux_clippy
          check driver-api run_driver_api
          check e2e-chronogazer run_e2e_chronogazer
          check e2e-hub run_e2e_hub

          exit "$fail"
