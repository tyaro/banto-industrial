name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # apps/chronogazer's @banto/* dependencies are git subdirectory refs
    # into tyaro/banto (github:tyaro/banto#v0.1.1&path:packages/...). banto
    # went PUBLIC on 2026-07-12, so pnpm's default git fetcher resolves them
    # with no credentials - no token setup is needed here (same reasoning as
    # the rust job's banto-core/-storage/-server git-tag deps).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version is intentionally omitted: pnpm/action-setup resolves it from
      # the "packageManager" field in the root package.json (pnpm@10.33.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Type check (svelte-check + tsc)
        run: pnpm check

      - name: Test
        run: pnpm --recursive --if-present test

      - name: Build
        run: pnpm build

  rust:
    name: Rust (fmt / clippy / test)
    runs-on: windows-latest
    timeout-minutes: 45
    # banto-tags (and every later I-series crate) depends on banto-core /
    # banto-storage via a git tag reference into tyaro/banto (see
    # crates/banto-tags/Cargo.toml, banto's docs/publishing.md). banto went
    # PUBLIC on 2026-07-12, so Cargo's default git fetcher resolves it with
    # no credentials - no token or insteadOf rewrite is needed here.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rustfmt only parses/reformats - no compilation, so like the steps
      # below it covers every workspace member, including the
      # `chronogazer`/`relay-wright` src-tauri crates.
      - name: fmt
        run: cargo fmt --all --check
      # Scope: the whole workspace, no --exclude. The two Tauri src-tauri
      # crates (`chronogazer`, `relay-wright`) have real tests of their own
      # (relay-wright: 25, chronogazer: 5) - PR #39 fixed a compile error in
      # relay-wright's src-tauri tests that a prior narrower CI scope had let
      # through undetected (a stale field reference left behind by T2-3).
      # So they stay in scope rather than being excluded for build-time
      # reasons: this job runs on windows-latest with Swatinem/rust-cache,
      # where the Tauri/WebView2 dependency build time is acceptable.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Known gap: this only covers apps/chronogazer. apps/banto-hub has no
    # Playwright e2e config yet (docs/t5-handoff.md §2) - add a parallel job
    # here once one exists.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Produces apps/chronogazer/build - the static SvelteKit output
      # `--features embed-ui` (below) embeds into the server binary
      # (apps/chronogazer/core/src/assets.rs).
      - name: Build frontend
        run: pnpm build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      # e2e/playwright.config.ts's webServer launches this binary directly
      # (not `cargo run`) - it must already exist before `pnpm e2e` below.
      - name: Build banto-serve (embed-ui)
        run: cargo build -p chronogazer-core --bin banto-serve --features embed-ui

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke suite
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
