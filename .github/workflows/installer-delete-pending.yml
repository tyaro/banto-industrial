name: Installer GUI capability

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-gui-capability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gui-capability:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      BANTO_973_GUI_TEST: github-hosted-gui-capability-only-v1
      BANTO_973_EXPECTED_SHA: ${{ github.sha }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate hosted environment and create fresh GUI-only root
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'GitHub-hosted Windows only' }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Admin token required; no UAC requested' }
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:BANTO_973_EXPECTED_SHA) { throw 'Immutable SHA mismatch' }
          $root = Join-Path $env:RUNNER_TEMP ('Banto973Gui-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root 'proof') | Out-Null
          [IO.File]::WriteAllText((Join-Path $root '.banto-973-gui'), "$env:GITHUB_RUN_ID`n$head`n", [Text.UTF8Encoding]::new($false))
          "BANTO_973_GUI_ROOT=$root" >> $env:GITHUB_ENV
          @{ status='not_executed'; head_sha=$head; event_sha=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; runner_environment=$env:RUNNER_ENVIRONMENT; workflow_sha256=(Get-FileHash -LiteralPath '.github/workflows/installer-gui-capability.yml' -Algorithm SHA256).Hash; image_os=$env:ImageOS; image_version=$env:ImageVersion; service_operations=0; ChronoGazer_UI_test='not_executed' } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'proof/workflow-start.json')
      - name: Pure GUI capability regression (no Win32 API loading)
        run: python -B -m unittest discover -s apps/chronogazer/installer/tests -p test_windows_gui_capability.py
      - name: Observe own calibration window and desktop crop (not ChronoGazer acceptance)
        run: python -B apps/chronogazer/installer/tests/windows_gui_capability.py
      - uses: actions/upload-artifact@v7
        if: always() && env.BANTO_973_GUI_ROOT != ''
        with:
          name: installer-gui-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BANTO_973_GUI_ROOT }}/proof/
          if-no-files-found: error
          retention-days: 14
