# サプライチェーン検証(2026-08-08 導入、docs/improvement-plan.md H6)。
# ライセンス・既知脆弱性(advisory)・重複バージョン・依存の取得元(source)を
# `cargo deny check`(EmbarkStudios/cargo-deny-action)で検証する。設定は
# リポジトリルートの deny.toml(各セクションに判断理由をコメント済み)。
#
# ci.yml(rust ジョブ)は絶対に変更しない別作業者管理のファイルのため、本
# ワークフローは独立ファイルとして追加した。
name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:

# ci.yml と同じ流儀(ワークフロー名 + ref でグループ化し、新しい push/PR
# 更新が来たら実行中の古いジョブをキャンセルする)。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # advisories だけ独立ジョブにする。理由: advisory DB の新着(既存の
  # 依存が後から vulnerable/unmaintained と判明するケース)は、Rust
  # コードに無関係な PR でも突然 CI を赤くし得る。cargo-deny-action の
  # README はこれを `continue-on-error` で握りつぶす例を示しているが、
  # それだと「advisory が見つかったのに誰も気づかない」状態になり
  # 産業用途の供給網監視としては本末転倒(H6 の趣旨は可視化)。そこで
  # continue-on-error は使わず、代わりにジョブを分離するだけに留める:
  # PR の checks 一覧で「advisories が落ちている」と一目で分かる一方、
  # licenses/bans/sources 側の合否には影響しない(逆も同様)。
  advisories:
    name: cargo-deny (advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml(2026-08-08 導入、H6)と同じバージョンに固定する。
      # cargo-deny-action の `rust-version` を省略するとアクション同梱の
      # イメージ既定バージョン(README 記載時点で 1.85.0)が使われ、この
      # リポジトリで検証したバージョンと食い違う。`cargo deny` 自体は
      # コンパイルはしないが `cargo metadata` は実行するため、依存クレート
      # 側の rust-version/edition 要求によっては古い cargo だと
      # 失敗しうる。ここを rust-toolchain.toml と別管理にしないため固定。
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: '1.94.1'
          command: check advisories
          # arguments は既定値 `--all-features` のままにする(明示未指定)。
          # 2026-08-08 実測: --all-features で増える依存(rust-embed 一式・
          # sha2 0.11 系など10クレート)は deny.toml の allow 済みライセンス
          # (MIT/Apache-2.0)のみで、default-features 版と比べて追加の
          # 判断は不要だったため、素直に既定を使う。

  # licenses / bans / sources は挙動が変わりやすい advisory と切り離し、
  # まとめて1ジョブにする(cargo-deny-action README の推奨構成と同じ形)。
  licenses-bans-sources:
    name: cargo-deny (licenses / bans / sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: '1.94.1'
          command: check licenses bans sources
