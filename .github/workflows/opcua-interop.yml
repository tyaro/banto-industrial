name: OPC UA interop

# リリース（タグの push: v* / trend-v*）と手動の実行（workflow_dispatch）では、
# 変更パスの絞り込みをせず全部走らせる（2026-11-22 オーナー決定）。
# タグの push では paths は評価されない（GitHub の仕様）ので、タグでは必ず走る。
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*', 'trend-v*']
    paths:
      - '.github/workflows/opcua-interop.yml'
      - 'interop/opcua/**'
      - 'apps/banto-hub/core/**'
      - 'apps/banto-hub/host/**'
      - 'apps/banto-hub/README.md'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docs/testing/banto-hub-opcua-verification.md'
  pull_request:
    paths:
      - '.github/workflows/opcua-interop.yml'
      - 'interop/opcua/**'
      - 'apps/banto-hub/core/**'
      - 'apps/banto-hub/host/**'
      - 'apps/banto-hub/README.md'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docs/testing/banto-hub-opcua-verification.md'

permissions:
  contents: read

# タグの push と手動の実行は run_id で独立した group にする。ref で束ねると、同じ ref の別の実行に
# 取り消されたり、待機中の run が 1 本だけの仕様で次の run に置き換えられたりする(2026-11-22 レビュー)。
# PR・branch の push は今まで通り ref で束ねる。
concurrency:
  group: opcua-interop-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  asyncua-smoke:
    name: Linux asyncua interop smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build Hub (REST only)
        run: cargo build --locked -p banto-hub-host --bin banto-hub
      - name: Install pinned asyncua client
        run: python -m pip install -r interop/opcua/requirements.txt
      - name: Verify Hub through independent OPC UA client
        run: python interop/opcua/smoke.py target/debug/banto-hub
