# Dependabot 設定(2026-08-08 導入、docs/improvement-plan.md H6)。
#
# 方針:
# - 対象は cargo(ルート workspace)・npm(ルート pnpm workspace、
#   pnpm-workspace.yaml で apps/* を束ねているが lockfile は pnpm-lock.yaml
#   1本のみなのでルート1エントリで足りる)・github-actions(.github/workflows/
#   配下を自動検出)の3エコシステム、いずれも weekly。
# - 更新頻度を上げすぎると「supply-chain.yml の cargo-deny チェックに
#   毎回さらされる小刻みな PR」が乱発し、H6 で入れた仕組み自体がノイズ源に
#   なるため、まずは weekly から様子を見る。
# - open-pull-requests-limit は控えめ(5)にし、一度にレビュー負荷が
#   跳ね上がらないようにする(値を使い切ったら随時引き上げを検討する)。
# - コミットメッセージは本リポジトリの Conventional Commits 風の
#   慣習(scope を括弧で示す)に軽く合わせて prefix を指定する。
# - groups（2026-10-28 オーナー決定）: 1 本ずつだと rebase と CI の待ちが
#   本数分かかるので、製品の出力に効かないもの（ビルド時だけの crate、
#   lint・型検査・試験の道具、CI の action）は 1 本の PR にまとめる。
#   実行時・ビルドの出力に効くもの（tokio・TLS・svelte・kit・vite・tauri など）は
#   入れず、今までどおり 1 本ずつ出させる。S7 のような実機試験の前に
#   「道具だけ先に上げ、実行時に効くものは後へ回す」と分けられるようにするため。
#   グループは version updates だけに効き、security updates は 1 本ずつのまま。
#
# 備考: banto-core/banto-storage/banto-server は crates.io ではなく
# `https://github.com/tyaro/banto.git` への git 依存(tag 固定、
# deny.toml [sources] 参照)。Dependabot の cargo エコシステムは git 依存の
# 自動更新提案が registry 依存ほど手厚くない(タグの新旧判定を誤る)ため、
# 下の cargo エントリの `ignore` で明示的に除外し、これらの更新は
# 手動(banto 側のタグ更新に追従する形)で行う想定。
version: 2
updates:
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # banto-* は crates.io ではなく git 依存(tag 固定)で、更新は banto 側の
    # リリースに追従する手動運用(上の備考参照)。Dependabot は git タグの
    # 新旧を正しく判定できず、2026-08-30 に v1.4.0 -> v1.3.0 という
    # **ダウングレード**を3本提案した(#184/#187/#191、クローズ済み)。
    # v1.3.0 の banto-storage は sqlx 0.8 固定で、当リポジトリの sqlx 0.9
    # (#181)と型が食い違いビルドが壊れるため、明示的に除外する。
    ignore:
      - dependency-name: 'banto-core'
      - dependency-name: 'banto-storage'
      - dependency-name: 'banto-server'
    # ビルド時だけに使う crate（リソースの埋め込み・Tauri のビルド・protoc の同梱）。
    # prost-build は prost と版をそろえるので入れない。
    groups:
      cargo-build-tools:
        patterns:
          - 'embed-resource'
          - 'tauri-build'
          - 'protoc-bin-vendored*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # lint・整形・型検査・試験の道具（ビルドの出力に入らない）。typescript は
    # Svelte の前処理に関わるので入れない。
    groups:
      npm-tooling:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'globals'
          - 'prettier'
          - 'prettier-*'
          - 'svelte-check'
          - 'vitest'
          - '@vitest/*'
          - '@playwright/test'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    # dtolnay/rust-toolchain は action の版ではなく、タグの名前が Rust の版
    # （ci.yml の MSRV `@1.85`、supply-chain.yml の `@1.98.1`）。Dependabot は
    # これを action の版とみなし、まだ無い Rust の版のタグ（1.120）へ上げる PR を
    # 出した（#831、2026-08-30 にも同じ型）。版は rust-version・
    # rust-toolchain.toml と同じ PR で手で上げるので、明示的に除外する。
    ignore:
      - dependency-name: 'dtolnay/rust-toolchain'
    # CI の action は製品に入らないので、major も含めて 1 本にまとめる。
    groups:
      github-actions:
        patterns:
          - '*'
